<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs – my game (Entry 2)</title>
<style>
:root{--g:#2E7D32;--b:#1F5FA8;--red:#C62828;--amb:#F9A825;--dark:#262626;--grey:#595959;--bg:#FFF8E7;--pale:#EAF4E4;--paleb:#E6EFFA;--txt:#7A3E00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark);display:flex;justify-content:center}
#app{width:100%;max-width:1100px;height:100dvh;display:flex;flex-direction:column;padding:10px 12px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:16px;touch-action:manipulation}
.top{display:flex;align-items:center;gap:8px;min-height:52px}
.top .home{background:#fff;border:2px solid #BFBFBF;font-size:20px;font-weight:bold;padding:8px 14px}
.top .bar{flex:1;height:14px;background:#E0E0E0;border-radius:8px;overflow:hidden}
.top .bar i{display:block;height:100%;background:var(--g);width:0}
.top .count{font-weight:bold;font-size:18px;min-width:56px;text-align:right}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;gap:10px;padding-top:6px}
.inst{font-size:clamp(22px,4.5vw,30px);font-weight:bold;color:var(--b);text-align:center}
.prompt{font-size:clamp(28px,6vw,48px);font-weight:bold;text-align:center;line-height:1.25}
.emoji{font-size:clamp(70px,16vh,130px);text-align:center;line-height:1.1}
.choices{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.choices.one{grid-template-columns:1fr}
.ch{background:#fff;border:3px solid var(--b);color:var(--dark);font-size:clamp(22px,4.6vw,36px);font-weight:bold;padding:14px 10px;min-height:72px;line-height:1.15}
.ch.ok{background:var(--g);border-color:var(--g);color:#fff}
.ch.no{background:var(--red);border-color:var(--red);color:#fff;animation:shake .35s}
.ch:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{background:var(--g);color:#fff;font-size:clamp(24px,5vw,34px);font-weight:bold;padding:14px 24px;min-height:66px}
.next{align-self:center;min-width:60%}
.spk{background:#fff;border:3px solid var(--g);font-size:32px;padding:6px 18px;align-self:center}
.fb{font-size:clamp(22px,4.4vw,32px);font-weight:bold;text-align:center;min-height:1.3em}
.fb.ok{color:var(--g)} .fb.no{color:var(--red)}
.gap{color:var(--b);text-decoration:underline}
/* home */
.flag{width:min(46vw,260px);height:auto;display:block;margin:4px auto;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
h1{text-align:center;font-size:clamp(30px,6vw,46px)}
.sub{text-align:center;font-size:clamp(18px,3.5vw,24px);color:var(--grey)}
.blocks{display:grid;gap:10px;grid-template-columns:1fr 1fr;flex:1;min-height:0;align-content:center}
.blk{background:#fff;border:3px solid var(--g);font-size:clamp(22px,4.6vw,32px);font-weight:bold;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.blk.st{border-color:#E67E22;grid-column:1/-1}
.blk small{font-size:clamp(15px,3vw,19px);color:var(--grey);font-weight:normal}
.rag{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-left:6px;border:2px solid #fff;box-shadow:0 0 0 2px #999}
.R{background:var(--red)} .A{background:var(--amb)} .G{background:#2E9E3A} .N{background:#E0E0E0}
/* intro */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;align-items:center}
.intro .card{text-align:center;background:#fff;border-radius:20px;padding:18px 26px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.intro .card .emoji{font-size:clamp(70px,14vh,110px)}
.intro .card .pt{font-size:clamp(24px,5vw,36px);font-weight:bold}
.intro .how{text-align:center}
.intro .how .i1{font-size:clamp(26px,5.5vw,38px);font-weight:bold;color:var(--b)}
.intro .how .i2{font-size:clamp(18px,3.6vw,24px);color:var(--grey);margin-top:6px}
/* reading */
.read{flex:1;display:flex;gap:12px;min-height:0}
.textbox{background:#fff;border:3px solid #E0C49A;border-radius:16px;padding:12px 14px;overflow:hidden;color:var(--txt);line-height:1.35;flex:1.3;min-height:0}
.textbox b{color:var(--dark)}
.qside{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:0}
.q{font-weight:bold;line-height:1.25}
@media (max-width:760px){.read{flex-direction:column}.textbox{flex:1}.qside{flex:none}}
/* order */
.slots{min-height:76px;background:#fff;border:3px dashed var(--b);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-items:center;justify-content:center}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px}
.tile{background:var(--paleb);border:3px solid var(--b);font-size:clamp(22px,4.6vw,32px);font-weight:bold;padding:10px 16px}
.slots .tile{background:#FFF3B0;border-color:#C9A800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{background:#fff;border:3px solid #BFBFBF;font-size:22px;font-weight:bold;padding:10px 18px}
/* typing */
textarea,input.ty{width:100%;font-family:inherit;font-size:clamp(24px,5vw,34px);padding:12px;border:3px solid var(--b);border-radius:14px;resize:none}
.correct{font-size:clamp(22px,4.5vw,32px);font-weight:bold;color:var(--g);text-align:center}
.formcard{background:#fff;border:3px solid #E0C49A;border-radius:16px;padding:10px 14px;color:var(--txt);line-height:1.35;overflow:hidden;min-height:0}
.label{font-size:clamp(24px,5vw,36px);font-weight:bold;text-align:center}
/* write */
.write{flex:1;display:flex;gap:14px;min-height:0}
.wl{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.wr{width:220px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.wr button{font-size:20px;font-weight:bold;padding:12px 8px;color:#fff}
.small{font-size:16px;color:var(--grey);font-weight:bold;text-transform:uppercase;letter-spacing:.5px}
.starter{font-size:clamp(26px,5.5vw,38px);font-weight:bold;color:var(--b)}
.ex{font-size:clamp(20px,4vw,28px);color:var(--g);font-weight:bold}
@media (max-width:760px){.write{flex-direction:column}.wr{width:100%;flex-direction:row}.wr button{flex:1;font-size:17px;padding:10px 4px}}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.res .light{width:140px;height:140px;border-radius:50%}
.res .msg{font-size:clamp(28px,6vw,44px);font-weight:bold}
.res .pts{font-size:clamp(22px,4.5vw,30px)}
/* question box in level colour (Entry 2 = blue) */
.prompt,.qside .q{background:var(--paleb);border:3px solid var(--b);border-radius:16px;padding:10px 14px}

</head>

/* ===================== STATE (saved on this phone) ===================== */
const KEY = 'jobs-essentials-E2-v1';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function st(id) { return S[id] || (S[id] = {part:0, item:0, pts:{}, done:false}); }

/* ===================== VOICE – best en-GB voice ===================== */
let VOICE = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
  const rank = v => /Natural|Online/i.test(v.name) ? 0 : /Google UK/i.test(v.name) ? 1 : /Premium|Enhanced/i.test(v.name) ? 2 : 3;
  gb.sort((a, b) => rank(a) - rank(b));
  VOICE = gb[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) {
  try {
    if (!window.speechSynthesis || !t) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\s.,'’?!:/–-]/gu, '').replace(/–/g, ' to '));
    if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; } else u.lang = 'en-GB';
    u.rate = 0.9; speechSynthesis.speak(u);
  } catch (e) {}
}

/* ===================== HELPERS ===================== */
const app = document.getElementById('app');

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function rag(p) { return p == null ? 'N' : p >= 0.9 ? 'G' : p >= 0.6 ? 'A' : 'R'; }
function blockScore(b) {
  const s = st(b.id); let got = 0, max = 0;
  Object.values(s.pts).forEach(arr => arr.forEach(v => { got += v; max += 1; }));
  return {got, max};
}
function fit(el, min) {
  if (!el) return; let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollHeight > el.clientHeight + 1 && fs > (min || 13)) { fs -= 1; el.style.fontSize = fs + 'px'; }
}
const UNION = `<svg class="flag" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg"><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>`;

/* ===================== HOME ===================== */
function home() {
  try { speechSynthesis.cancel(); } catch (e) {}
  let html = `<div class="screen">${UNION}<h1>Jobs</h1><div class="sub">Entry 2 · Tap a part</div><div class="blocks">`;
  BLOCKS.forEach(b => {
    const s = st(b.id), sc = blockScore(b);
    const status = s.done ? `<span class="rag ${rag(sc.got / sc.max)}"></span>` :
      (s.part || s.item) ? `<small>Part ${s.part + 1} of ${b.parts.length} – go on</small>` : `<small>${b.parts.length} parts</small>`;
    html += `<button class="blk ${b.st ? 'st' : ''}" data-b="${b.id}">${b.icon} ${b.name} ${s.done ? status : ''}${s.done ? `<small>${sc.got} / ${sc.max}</small>` : status}</button>`;
  });
  html += `</div></div>`;
  h(html);
  app.querySelectorAll('.blk').forEach(x => x.onclick = () => openBlock(x.dataset.b));
}
function openBlock(id) {
  const b = BLOCKS.find(x => x.id === id), s = st(id);
  if (s.done) { S[id] = {part:0, item:0, pts:{}, done:false}; save(); }
  st(id).item === 0 ? intro(b) : item(b);
}

/* ===================== FRAME ===================== */
function frame(b, inner) {
  const s = st(b.id), p = b.parts[s.part];
  const pct = Math.round(100 * s.item / p.items.length);
  return `<div class="top"><button class="home">⌂ Stop</button><div class="bar"><i style="width:${pct}%"></i></div><div class="count">${s.item + 1}/${p.items.length}</div></div><div class="screen">${inner}</div>`;
}
function wireHome() { const x = app.querySelector('.home'); if (x) x.onclick = home; }

function intro(b) {
  const s = st(b.id), p = b.parts[s.part];
  const pts = p.type === 'write' ? 'Check your sentence' : '1 point each';
  h(`<div class="top"><button class="home">⌂ Stop</button></div><div class="intro">
     <div class="card"><div class="emoji">${p.icon}</div><div class="pt">Part ${s.part + 1} of ${b.parts.length}: ${p.title}</div></div>
     <div class="how"><div class="i1">${p.inst}</div><div class="i2">${p.items.length} questions · ${pts}</div></div>
     <button class="big" id="go">Start ▶</button></div>`);
  wireHome(); document.getElementById('go').onclick = () => item(b);
}

function record(b, v) {
  const s = st(b.id); (s.pts[s.part] = s.pts[s.part] || [])[s.item] = v; save();
}
function advance(b) {
  const s = st(b.id), p = b.parts[s.part];
  s.item++;
  if (s.item >= p.items.length) { s.part++; s.item = 0; }
  if (s.part >= b.parts.length) { s.done = true; s.part = 0; save(); return result(b); }
  save(); s.item === 0 ? intro(b) : item(b);
}
function nextBtn(b) {
  const n = document.createElement('button'); n.className = 'big next'; n.textContent = 'Next ▶';
  n.onclick = () => advance(b); return n;
}

/* ===================== ITEMS ===================== */
function item(b) {
  const s = st(b.id), p = b.parts[s.part], it = p.items[s.item];
  ({pick, read, order, type, write})[p.type](b, p, it);
  wireHome();
}

function choiceButtons(b, it, cls) {
  const opts = shuffle(it.ch);
  return `<div class="choices ${cls}">${opts.map(o => `<button class="ch" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
}
function wireChoices(b, it, area) {
  let first = true;
  app.querySelectorAll('.ch').forEach(btn => btn.onclick = () => {
    const v = btn.dataset.v;
    if (v === it.a) {
      btn.classList.add('ok'); app.querySelectorAll('.ch').forEach(x => x.disabled = true);
      if (first) record(b, 1);
      app.querySelector('.fb').className = 'fb ok'; app.querySelector('.fb').textContent = first ? '✔ Yes!' : '✔';
      speak(it.say || it.a);
      if (!app.querySelector('.next')) area.appendChild(nextBtn(b));
    } else {
      btn.classList.add('no'); btn.disabled = true;
      if (first) { record(b, 0); first = false; }
      app.querySelector('.fb').className = 'fb no'; app.querySelector('.fb').textContent = '✗ Try again.';
    }
  });
}

function pick(b, p, it) {
  const cls = p.one ? 'one' : (it.ch.length === 3 || p.three) ? 'one' : '';
  let top = '';
  if (it.emoji) top += `<div class="emoji">${it.emoji}</div>`;
  if (it.listen) top += `<button class="spk" id="sp">🔊</button>`;
  if (it.q) top += `<div class="prompt">${it.q.replace('___', '<span class="gap">_____</span>')}</div>`;
  h(frame(b, `<div class="inst">${p.inst}</div>${top}<div class="fb"></div>${choiceButtons(b, it, cls)}<div id="area" style="display:flex;justify-content:center"></div>`));
  if (it.listen) { document.getElementById('sp').onclick = () => speak(it.listen); setTimeout(() => speak(it.listen), 300); }
  wireChoices(b, it, document.getElementById('area'));
}

function read(b, p, it) {
  h(frame(b, `<div class="inst">${p.inst}</div><div class="read"><div class="textbox" id="tx">${p.text}</div>
    <div class="qside"><div class="q prompt" style="font-size:clamp(22px,4vw,32px)">${it.q}</div><div class="fb"></div>${choiceButtons(b, it, 'one')}<div id="area" style="display:flex;justify-content:center"></div></div></div>`));
  const tx = document.getElementById('tx');
  tx.style.fontSize = (window.innerWidth > 760 ? 24 : 19) + 'px'; fit(tx, 12);
  app.querySelectorAll('.ch').forEach(c => { c.style.fontSize = 'clamp(19px,3.6vw,30px)'; if (window.innerWidth <= 760) { c.style.minHeight = '52px'; c.style.padding = '8px'; } });
  wireChoices(b, it, document.getElementById('area'));
}

function order(b, p, it) {
  let tiles = shuffle(it.tiles.map((t, i) => ({t, i})));
  while (tiles.map(x => x.t).join('|') === it.tiles.join('|')) tiles = shuffle(tiles);
  let placed = [], first = true;
  h(frame(b, `<div class="inst">${p.inst}</div><div class="slots" id="sl"></div><div class="tiles" id="tl"></div>
    <div class="fb"></div><div class="row" id="area"><button class="ghost" id="undo">↩ Back</button><button class="big" id="chk">Check ✔</button></div>`));
  const sl = document.getElementById('sl'), tl = document.getElementById('tl');
  function draw() {
    sl.innerHTML = placed.map(x => `<button class="tile">${esc(x.t)}</button>`).join('') + (placed.length ? '<span style="font-size:32px;font-weight:bold">.</span>' : '');
    tl.innerHTML = tiles.filter(x => !placed.includes(x)).map(x => `<button class="tile" data-i="${x.i}">${esc(x.t)}</button>`).join('');
    tl.querySelectorAll('.tile').forEach(btn => btn.onclick = () => { placed.push(tiles.find(x => x.i == btn.dataset.i)); draw(); });
    sl.querySelectorAll('.tile').forEach((btn, k) => btn.onclick = () => { placed.splice(k, 1); draw(); });
  }
  draw();
  document.getElementById('undo').onclick = () => { placed.pop(); draw(); };
  document.getElementById('chk').onclick = () => {
    if (placed.length < it.tiles.length) return;
    const got = placed.map(x => x.t).join('|').toLowerCase();
    const fb = app.querySelector('.fb');
    if (it.ok.some(o => o.join('|').toLowerCase() === got)) {
      if (first) record(b, 1);
      fb.className = 'fb ok'; fb.textContent = '✔ ' + it.say; speak(it.say);
      const area = document.getElementById('area'); area.innerHTML = ''; area.appendChild(nextBtn(b));
      sl.querySelectorAll('.tile').forEach(x => x.disabled = true);
    } else {
      if (first) { record(b, 0); first = false; }
      fb.className = 'fb no'; fb.textContent = '✗ Try again.'; placed = []; draw();
    }
  };
}

function norm(s, caps) {
  s = s.replace(/\s+/g, ' ').trim().replace(/\s+([,.?!])/g, '$1');
  if (!caps) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s;
}
function type(b, p, it) {
  const top = p.text ? `<div class="formcard" id="fc">${p.text}</div><div class="label">${it.label}</div>` :
    `<div class="prompt" style="color:var(--txt)">${esc(it.show)}</div>`;
  h(frame(b, `<div class="inst">${p.inst}</div>${top}<input class="ty" id="ty" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="fb"></div><div class="correct" id="cor"></div><div class="row" id="area"><button class="big" id="chk">Check ✔</button></div>`));
  if (p.text) { const fc = document.getElementById('fc'); fc.style.fontSize = (window.innerWidth > 760 ? 24 : 18) + 'px'; fc.style.flex = '1'; fit(fc, 12); }
  const ty = document.getElementById('ty'); let first = true;
  setTimeout(() => ty.focus(), 100);
  const check = () => {
    const v = norm(ty.value, p.caps); if (!v) return;
    const ok = it.a.some(a => norm(a, p.caps) === v || (!p.caps && norm(a, false) === v));
    const fb = app.querySelector('.fb');
    if (ok) {
      if (first) record(b, 1);
      fb.className = 'fb ok'; fb.textContent = '✔ Yes!'; speak(it.say); ty.disabled = true;
      const area = document.getElementById('area'); area.innerHTML = ''; area.appendChild(nextBtn(b));
    } else if (first) {
      record(b, 0); first = false;
      fb.className = 'fb no'; fb.textContent = '✗ Look:'; document.getElementById('cor').textContent = it.a[0];
      speak(it.say); ty.value = ''; ty.focus();
    } else {
      fb.className = 'fb no'; fb.textContent = '✗ Copy it:';
    }
  };
  document.getElementById('chk').onclick = check;
  ty.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
}

function write(b, p, it) {
  h(frame(b, `<div class="write"><div class="wl">
      <div class="inst" style="text-align:left">${it.q}</div>
      <div class="small">Sentence starter</div><div class="starter">${esc(it.starter)}…</div>
      <textarea id="ty" rows="3" spellcheck="false"></textarea>
      <div class="small" style="text-transform:none">Then write it on paper ✏️</div>
      <div id="exw"></div>
      <button class="big" id="see" style="align-self:flex-start">Check ✔</button></div>
    <div class="wr" id="wr" style="visibility:hidden">
      <button style="background:var(--red)" data-v="0">Not yet</button>
      <button style="background:var(--amb);color:#262626" data-v="0.5">Nearly</button>
      <button style="background:#2E9E3A" data-v="1">I can write it!</button></div></div>`));
  const ty = document.getElementById('ty'); ty.value = it.starter;
  setTimeout(() => { ty.focus(); ty.setSelectionRange(ty.value.length, ty.value.length); }, 100);
  const grow = () => { ty.style.height = 'auto'; ty.style.height = ty.scrollHeight + 'px'; };
  ty.addEventListener('input', grow); grow();
  document.getElementById('see').onclick = () => {
    if (ty.value.trim().length <= it.starter.trim().length) return;
    document.getElementById('exw').innerHTML = `<div class="small">Example</div><div class="ex">${esc(it.ex)}</div>`;
    document.getElementById('see').remove(); speak(it.ex);
    document.getElementById('wr').style.visibility = 'visible';
  };
  app.querySelectorAll('#wr button').forEach(x => x.onclick = () => { record(b, parseFloat(x.dataset.v)); advance(b); });
}

/* ===================== RESULT ===================== */
function result(b) {
  const sc = blockScore(b), r = rag(sc.got / sc.max);
  const msg = {G:'Excellent! 🎉', A:'Good! Practise again.', R:'Try again. You can do it!'}[r];
  const col = {G:'#2E9E3A', A:'#F9A825', R:'#C62828'}[r];
  h(`<div class="res"><div class="light" style="background:${col}"></div><div class="msg">${msg}</div>
     <div class="pts">${b.icon} ${b.name}: ${Math.round(sc.got * 10) / 10} / ${sc.max}</div>
     <div class="row"><button class="ghost" id="again">↻ Again</button><button class="big" id="menu">Menu ▶</button></div></div>`);
  document.getElementById('menu').onclick = home;
  document.getElementById('again').onclick = () => { S[b.id] = {part:0, item:0, pts:{}, done:false}; save(); intro(b); };
}

home();
</script>
</body>
</html>
