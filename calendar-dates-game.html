<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar & Dates – Game</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#c3e6c5;--paper:#fff;--ink:#1f1b2e;--muted:#4a4560;--g:#2e9e3e;--gs:#e2f4dd;--p:#5b3fa8;--ps:#ece6f8;--w:#c0561c;--ws:#fbe2d2;--line:#e6dcc0;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:clamp(15px,2.3vh,22px);display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;flex:none}
.brand{font-weight:700;font-size:1.2em;margin-right:auto}
.pill{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:3px 12px;font-weight:700}
.sw{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.sw button{border:0;background:none;padding:4px 10px;font-weight:700;font-size:.9em}
.sw button.on{background:var(--ink);color:#fff}
.vb{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 10px;font-weight:700;font-size:.9em}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 12px 10px;width:100%}
#home{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.hero{display:flex;align-items:center;gap:12px;background:var(--p);color:#fff;border-radius:18px;padding:8px 16px;flex:none;font-size:1.1em}
.hero b{font-size:1.25em}
#menu{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px}
@media (max-width:700px){#menu{grid-template-columns:repeat(2,1fr)}}
.gbtn{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;min-height:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.gbtn:hover{background:var(--ps)}
.gic{font-size:42cqmin;line-height:1}
.gt{font-weight:700;text-align:center;line-height:1.1;font-size:min(15cqh,10cqw)}
.gb{font-size:.8em;color:var(--muted)}
.bottom{display:flex;gap:10px;flex:none}
.bottom button{flex:1;border:3px solid var(--ink);background:#fff;border-radius:16px;padding:10px;font-weight:700;font-size:1.05em}
#play{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;flex:none}
.back{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 12px;font-weight:700}
#gtitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.1em}
.prog{flex:1;height:12px;background:rgba(255,255,255,.7);border-radius:6px;overflow:hidden;min-width:60px;border:2px solid var(--ink)}
#bar{display:block;height:100%;background:var(--g);transition:width .3s}
#cnt{font-weight:700}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1.3;min-height:0}
.card.slim{flex:0 0 auto;padding:12px 16px}
.card img.big{flex:1;min-height:0;max-width:100%;object-fit:contain}
.card img.mini{height:10vh;object-fit:contain}
.q{font-weight:700;font-size:clamp(18px,min(4.6vh,6vw),48px);text-align:center;line-height:1.25}
.q.big{font-size:clamp(26px,5.6vh,58px)}
.hint{font-weight:700;color:var(--muted);font-size:clamp(18px,3.4vh,34px);text-align:center}
.say{border:0;background:var(--g);color:#fff;border-radius:99px;padding:.25em .9em;font-weight:700;font-size:clamp(18px,3.4vh,32px);vertical-align:middle;box-shadow:0 4px 0 #1d6b28}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 #1d6b28}
.gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--muted);text-align:center;color:var(--g)}.gap.count{color:var(--muted)}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.opts.n3{grid-template-columns:1fr}
.opt{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:4px 10px;font-weight:700;font-size:clamp(18px,min(4.4vh,6vw),46px);min-height:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.opt.sm{font-size:clamp(14px,min(3.3vh,4vw),34px);line-height:1.2}
.opt:hover:not(:disabled),.popt:hover:not(:disabled){background:var(--ps)}
.popt{border:3px solid var(--ink);background:#fff;border-radius:18px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.popt img.op{flex:1;min-height:0;max-width:100%;object-fit:contain}
.popt .lbl{font-weight:700;display:none;font-size:clamp(16px,3vh,30px)}.popt.show .lbl{display:block}
.right{background:var(--g)!important;border-color:var(--g)!important;color:#fff!important}
.popt.right{background:var(--gs)!important;color:var(--ink)!important;box-shadow:0 0 0 5px var(--g)}
.wrong{background:var(--w)!important;border-color:var(--w)!important;color:#fff!important}
.popt.wrong{background:var(--ws)!important;color:var(--ink)!important}
.fb{display:none}
.fb.show{display:flex;position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0));align-items:center;gap:14px;z-index:5;border-top:3px solid var(--ink);font-size:clamp(17px,3vh,28px)}
.fb.ok{background:var(--gs)}.fb.no{background:var(--ws)}
.fbt{flex:1;display:flex;flex-direction:column}
.nx,.nav{border:3px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:10px 22px;font-weight:700;font-size:clamp(17px,3vh,28px)}
.nav{background:#fff;color:var(--ink)}.nav.main{background:var(--ink);color:#fff}
.nav:disabled{opacity:.4}
.row{display:flex;gap:10px;justify-content:center;flex:none;flex-wrap:wrap}
.learn .word{font-size:clamp(28px,6vh,60px);font-weight:700;text-align:center}.learn .mean{color:var(--muted);font-size:clamp(18px,3.4vh,34px);text-align:center}
.slot{min-height:9vh;border:3px dashed var(--ink);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#fff;flex:none}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;flex:1;min-height:0}
.tile{border:3px solid var(--p);background:var(--ps);border-radius:14px;padding:.35em .7em;font-weight:700;font-size:clamp(16px,min(4.2vh,5vw),44px)}.tile.on{border-color:var(--g);background:var(--gs)}
.end .stars{font-size:clamp(40px,9vh,90px);letter-spacing:6px}.end .big{font-size:clamp(28px,6vh,60px);font-weight:700}.miss{font-size:clamp(15px,2.6vh,24px);color:var(--muted);text-align:center}
.pop{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);color:var(--ink);font-weight:700;font-size:1.4em;padding:6px 18px;border-radius:99px;animation:pp 1.2s forwards;z-index:9;pointer-events:none}
@keyframes pp{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#fff;border-radius:20px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:18px;position:relative;border:3px solid var(--ink)}
.mbox h2{margin:0 0 10px}.mbox input{width:100%;font:inherit;padding:10px;margin:6px 0;border:2px solid var(--ink);border-radius:10px}
.mx{position:absolute;right:10px;top:8px;border:0;background:none;font-size:1.6em}
.vbtn{display:block;width:100%;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:10px;margin:6px 0;font-weight:700}.vbtn.on{background:var(--gs);border-color:var(--g)}
.sc{width:100%;border-collapse:collapse;margin-bottom:8px}.sc td{border-bottom:1px solid #ddd;padding:6px}
.qrs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.qb{text-align:center;border:2px solid var(--ink);border-radius:12px;padding:10px}
@media print{header,.bottom,#home,#play,.row,input,.hint,.mx{display:none!important}#modal{position:static;background:none}.mbox{max-height:none;border:0}}
.opt .t{display:block;font-size:min(46cqh,13cqw);line-height:1.1}
.opt .t.sent{font-size:min(30cqh,6.4cqw);line-height:1.15}
.opts.n3 .opt .t{font-size:min(50cqh,9cqw)}.opts.n3 .opt .t.sent{font-size:min(44cqh,6cqw)}
@media (max-width:700px){.opts.long{grid-template-columns:1fr;flex:1.8}.opt .t.sent{font-size:min(40cqh,7.5cqw)}.opts.n3 .opt .t.sent{font-size:min(44cqh,7.5cqw)}}
.popt{container-type:size}.popt .lbl{font-size:min(16cqh,11cqw)!important}
.bottom button{font-size:clamp(16px,2.8vh,28px)}

.q.huge{font-size:clamp(34px,min(9vh,11vw),96px)}
.calcard{flex:1.6}
table.cal{border-collapse:collapse;width:100%;max-width:760px;flex:1;min-height:0;font-weight:700}
table.cal th{background:#2e7d32;color:#fff;font-size:clamp(14px,2.6vh,26px);padding:2px}
table.cal td{border:2px solid #1f1b2e;text-align:center;font-size:clamp(16px,3vh,32px);background:#fff}
table.cal td.hl{background:#ffd60a}
.lvl3 button{padding:4px 9px}
.learn .word{font-size:clamp(40px,min(13vh,14vw),140px)!important}.learn .mean{font-size:clamp(20px,min(4.5vh,6vw),48px)!important}
</style></head><body>
<header><div class="brand">📅 Calendar & Dates</div><span class="pill">⭐ <span id="ptsN">0</span> <span id="badge"></span></span>
<button class="vb" onclick="voices()">🗣️ Voice</button>
<div class="sw"><button id="sp0" onclick="setRate(0)">🐢</button><button id="sp1" onclick="setRate(1)">Slow</button><button id="sp2" onclick="setRate(2)">Normal</button></div>
<div class="sw lvl3" id="lvsw"><button id="lv0" onclick="setLevel(0)">Pre-Entry</button><button id="lv1" onclick="setLevel(1)">Entry 1</button><button id="lv2" onclick="setLevel(2)">Entry 2</button></div></header>
<main><section id="home"><div class="hero"><span style="font-size:1.8em">📅</span><div><b>Days, months and dates</b><br>Level: <span id="lvname"></span> · Choose a game. Tap 🔊 to listen.</div></div>
<div id="menu"></div><div class="bottom"><button onclick="learner()">📧 My scores (learners)</button><button onclick="teacher()">👩‍🏫 Teacher: QR codes</button></div></section>
<section id="play" class="hide"><div class="bar"><button class="back" onclick="home()">◀ Games</button><span id="gtitle"></span><div class="prog"><i id="bar"></i></div><span id="cnt"></span></div><div id="stage"></div></section></main>
<div class="fb" id="fb"></div>
<div id="modal" class="hide" onclick="if(event.target===this)closeM()"><div class="mbox"><button class="mx" onclick="closeM()">✕</button><div id="mbody"></div></div></div>

const SM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
const SEAS=[['spring','March, April, May'],['summer','June, July, August'],['autumn','September, October, November'],['winter','December, January, February']];
const ONES=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth','twentieth'];
function ordWord(n){if(n<=20)return ONES[n];if(n===30)return 'thirtieth';const t=n<30?'twenty':'thirty';return t+'-'+ONES[n%10]}
function ordNum(n){const s=(n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');return n+s}
const LVNAME=['Pre-Entry','Entry 1','Entry 2'];
const GAMES=[['learn','👀','Learn the words'],['listen','👂','Listen and choose'],['sayit','🎤','Say it!'],['short','✂️','Short forms'],['next','➡️','What comes next?'],['cal','📅','Read the calendar'],['build','🧩','Build the sentence'],['seasons','🍂','Seasons']];
/* ================= ENGINE ================= */
const RATES=[0.45,0.6,0.8];let RATE=1,LEVEL=1,GAME=null,Q=[],qi=0,score=0,total=0,missed=[],STREAK=0,ROUND=0,LOCK=false;
const $=id=>document.getElementById(id);
const st=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=(n,cls='')=>IMG[n]?`<img class="${cls}" src="${IMG[n]}" alt="">`:'';
let SPK=0,CT=null;
function gbVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));const sc=v=>(/natural/i.test(v.name)?0:/online|google/i.test(v.name)?1:2);return vs.sort((a,b)=>sc(a)-sc(b))}catch(e){return[]}}
function pickVoice(){const vs=gbVoices();const want=st('cg-voice');let v=vs.find(x=>x.name===want);if(!v){v=navigator.onLine?vs[0]:(vs.find(x=>x.localService)||vs[0])}return v}
function utter(t,done){try{const s=speechSynthesis;if(!t.trim()){done&&done();return}const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=RATES[RATE];const v=pickVoice();if(v)u.voice=v;if(done)u.onend=done;s.speak(u)}catch(e){done&&done()}}
function speak(t){const id=++SPK;clearInterval(CT);try{speechSynthesis.cancel()}catch(e){}
 if(t.includes('___')){const [a,b]=t.split('___');utter(a,()=>{if(id!==SPK)return;let n=7;const g=$('gap');const show=()=>{if(g&&id===SPK&&!g.dataset.done){g.textContent=n>0?n:'?';g.classList.toggle('count',n>0)}};show();
  CT=setInterval(()=>{if(id!==SPK){clearInterval(CT);return}n--;show();if(n<=0){clearInterval(CT);utter(b)}},1000)})}else utter(t)}
const sayable=t=>t.replace(/(\d+)(st|nd|rd|th)\b/g,(m,n)=>'the '+ordWord(+n)).replace(/\bthe the\b/g,'the');
const say=(t,l='🔊 Listen')=>`<button class="say" onclick='speak(${JSON.stringify(sayable(t)).replace(/'/g,"&#39;")})'>${l}</button>`;
function setRate(r){RATE=r;[0,1,2].forEach(i=>$('sp'+i).classList.toggle('on',i===r));st('cg-rate',r);speak('This is the speed.')}
function voices(){const vs=gbVoices();const cur=(pickVoice()||{}).name;
 modal(`<h2>🗣️ Choose a British voice</h2>${vs.length?vs.map(v=>`<button class="vbtn ${v.name===cur?'on':''}" onclick='setVoice(${JSON.stringify(v.name).replace(/'/g,"&#39;")})'>${esc(v.name.replace(/Microsoft |Google /,''))}${/natural/i.test(v.name)?' ⭐ natural':''}</button>`).join(''):'<p>No British voices found on this device.</p>'}
 <p class="hint">Voices depend on the device. For the most natural voices on a computer, open the game in <b>Microsoft Edge</b> (⭐ natural).</p>`)}
function setVoice(n){st('cg-voice',n);speak('Hello! Today is Monday, the first of September.');voices()}
function setLevel(l){LEVEL=l;[0,1,2].forEach(i=>$('lv'+i).classList.toggle('on',i===l));st('cg-level',l);home()}
/* points */
const BADGES=[[50,'🥉'],[150,'🥈'],[300,'🥇'],[500,'🏆']];
const pts=()=>parseInt(st('cg-pts-'+LEVEL)||'0')||0;
function drawPts(){$('ptsN').textContent=pts();$('badge').textContent=BADGES.filter(([n])=>pts()>=n).map(x=>x[1]).join('')}
function pop(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function addPts(n,l){const b=pts(),a=b+n;st('cg-pts-'+LEVEL,a);ROUND+=n;drawPts();const nb=BADGES.find(([x])=>b<x&&a>=x);pop(nb?`New badge ${nb[1]}!`:`+${n}${l?' '+l:''}`)}
function right(){STREAK++;addPts(STREAK>=3?15:10,STREAK>=3?`🔥${STREAK}`:'');score++}
function wrong(t){STREAK=0;missed.push(t)}
function show(id){['home','play'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function home(){SPK++;clearInterval(CT);try{speechSynthesis.cancel()}catch(e){}stopRec();drawPts();show('home');
 $('lvname').textContent=LVNAME[LEVEL];
 $('menu').innerHTML=GAMES.map(([id,ic,t])=>{const b=st(`cg-best-${id}-${LEVEL}`);return `<button class="gbtn" onclick="start('${id}')"><span class="gic">${ic}</span><span class="gt">${t}</span>${b&&id!=='learn'?`<span class="gb">⭐ ${b}</span>`:''}</button>`}).join('')}
/* ================= QUESTION BUILDERS ================= */
function mc(prompt,ans,opts,extra={}){const n=extra.n||4;const o=[...new Set(opts.filter(x=>x!==ans))].slice(0,n-1);return Object.assign({type:'mc',prompt,ans,opts:shuffle([ans,...o])},extra)}
function others(list,ans,n){return pick(list.filter(x=>x!==ans),n)}
function learnSet(){const L=LEVEL,c=[];
 DAYS.forEach((d,i)=>c.push({w:d,m:`${SD[i]} • the ${ordWord(i+1)} day of the week`}));
 MONTHS.forEach((m,i)=>c.push({w:m,m:`${SM[i]} • month ${i+1}`}));
 const ords=L===0?[1,2,3]:L===1?[1,2,3,4,5,10,11,12,21,22,23,31]:[1,2,3,5,11,12,20,21,22,23,30,31];
 ords.forEach(n=>c.push({w:ordNum(n),m:ordWord(n),say:ordWord(n)}));
 SEAS.forEach(([s,m])=>c.push({w:s,m,img:s}));
 if(L===2)[['yesterday','the day before today'],['tomorrow','the day after today'],['a fortnight','two weeks'],['the weekend','Saturday and Sunday']].forEach(([w,m])=>c.push({w,m}));
 return c}
function listenSet(){const L=LEVEL,q=[];
 if(L===0){pick(DAYS,4).forEach(d=>q.push(mc(d,d,others(DAYS,d,2),{n:3,speakQ:d})));pick(MONTHS,4).forEach(m=>q.push(mc(m,m,others(MONTHS,m,2),{n:3,speakQ:m})))}
 if(L===1){pick(DAYS,3).forEach(d=>q.push(mc(d,d,others(DAYS,d,3),{speakQ:d})));pick(MONTHS,4).forEach(m=>q.push(mc(m,m,others(MONTHS,m,3),{speakQ:m})));
  pick([1,2,3,4,5,11,12,21,22,23,30,31],3).forEach(n=>q.push(mc(ordNum(n),ordNum(n),[ordNum(n+1>31?n-1:n+1),ordNum(n%10===1?n+1:n-1),String(n)],{speakQ:'the '+ordWord(n)})))}
 if(L===2){for(let i=0;i<10;i++){const d=1+Math.floor(Math.random()*28),m=Math.floor(Math.random()*12);const ans=`${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}`;
  const P=x=>String(x).padStart(2,'0');const wrong=[(d<=12&&d!==m+1)?`${P(m+1)}/${P(d)}`:`${P(d+2)}/${P(m+1)}`,`${P(d+1)}/${P(m+1)}`,`${P(d)}/${P((m+1)%12+1)}`];
  q.push(mc(ans,ans,wrong,{speakQ:`the ${ordWord(d)} of ${MONTHS[m]}`}))}}
 return shuffle(q).slice(0,10)}
function sayitSet(){const L=LEVEL;let w=[];
 if(L===0)w=pick(DAYS,4).concat(pick(MONTHS,4));
 if(L===1)w=pick(DAYS,3).concat(pick(MONTHS,3)).concat(pick([1,2,3,5,21,22],2).map(n=>'the '+ordWord(n)));
 if(L===2)w=pick([[1,0],[3,5],[15,8],[22,10],[31,11],[2,1],[23,3]],6).map(([d,m])=>`the ${ordWord(d)} of ${MONTHS[m]}`).concat(['a fortnight','Wednesday']);
 return w.map(t=>({type:'say',text:t}))}
function shortSet(){const L=LEVEL,q=[];
 if(L===0)pick(SD.map((s,i)=>[s,DAYS[i]]),6).forEach(([s,d])=>q.push(mc(s,d,others(DAYS,d,2),{n:3,big:true})));
 if(L>=1){pick(SD.map((s,i)=>[s,DAYS[i]]),4).forEach(([s,d])=>q.push(mc(s,d,others(DAYS,d,3),{big:true})));pick(SM.map((s,i)=>[s,MONTHS[i]]),6).forEach(([s,m])=>q.push(mc(s,m,others(MONTHS,m,3),{big:true})))}
 if(L===2){q.length=0;[['06/11/2026','Friday, 6th November 2026'],['03/12/2026','Thursday, 3rd December 2026'],['05/04/2027','Monday, 5th April 2027'],['17/07/2027','Saturday, 17th July 2027'],['12/10/2026','Monday, 12th October 2026'],['01/01/2027','Friday, 1st January 2027']].forEach(([s,l])=>{
   const [d,m,y]=s.split('/').map(Number);q.push(mc(s,l,[l.replace(MONTHS[m-1],MONTHS[d-1]||MONTHS[(m)%12]),l.replace(/\d+(st|nd|rd|th)/,ordNum(m)),l.replace(String(y),String(y+1))],{big:true,sent:true}))});
  pick(SM.map((s,i)=>[s,MONTHS[i]]),4).forEach(([s,m])=>q.push(mc(s,m,others(MONTHS,m,3),{big:true})))}
 return shuffle(q)}
function nextSet(){const L=LEVEL,q=[];
 const seq=(arr,i,k)=>arr.slice(i,i+k).join(', ')+', ___';
 if(L===0){for(const i of pick([0,1,2,3,4],4))q.push(mc(seq(DAYS,i,2),DAYS[i+2],others(DAYS,DAYS[i+2],2),{n:3}));for(const i of pick([0,2,4,6,8],3))q.push(mc(seq(MONTHS,i,2),MONTHS[i+2],others(MONTHS,MONTHS[i+2],2),{n:3}))}
 if(L===1){for(const i of pick([0,1,2,3,4],3))q.push(mc(seq(DAYS,i,2),DAYS[i+2],others(DAYS,DAYS[i+2],3)));for(const i of pick([0,3,5,7,9],3))q.push(mc(seq(MONTHS,i,2),MONTHS[i+2],others(MONTHS,MONTHS[i+2],3)));
  [[1,2],[2,3],[20,21],[21,22],[29,30]].forEach(([a,b])=>q.push(mc(`${ordNum(a)}, ${ordNum(b)}, ___`,ordNum(b+1),[String(b+1),ordNum(b+2),(b+1)+'nd'].filter(x=>x!==ordNum(b+1)))));
  const i=Math.floor(Math.random()*6);q.push(mc(`The day after ${DAYS[i]} is ___.`,DAYS[i+1],others(DAYS,DAYS[i+1],3),{sent:false}))}
 if(L===2){const dd=i=>DAYS[(i+7)%7];
  for(const i of pick([1,2,3,4,5,6],3))q.push(mc(`The day before ${DAYS[i]} is ___.`,dd(i-1),others(DAYS,dd(i-1),3)));
  for(const i of pick([0,1,2,3,4],3))q.push(mc(`Two days after ${DAYS[i]} is ___.`,dd(i+2),others(DAYS,dd(i+2),3)));
  for(const i of pick([1,3,5,8,10],2))q.push(mc(`The month before ${MONTHS[i]} is ___.`,MONTHS[i-1],others(MONTHS,MONTHS[i-1],3)));
  for(const n of pick([4,6,9,11],2))q.push(mc(`The ${ordWord(n)} month of the year is ___.`,MONTHS[n-1],others(MONTHS,MONTHS[n-1],3)))}
 return shuffle(q).slice(0,10)}
/* calendar: September (1st = Monday) */
function calHTML(hl=[]){let h='<table class="cal"><tr>'+SD.map(d=>`<th>${d}</th>`).join('')+'</tr>';let n=1;
 for(let r=0;r<5;r++){h+='<tr>';for(let c=0;c<7;c++){const ok=n<=30;h+=`<td class="${ok&&hl.includes(n)?'hl':''}">${ok?n:''}</td>`;n++}h+='</tr>'}return h+'</table>'}
const dayOf=n=>DAYS[(n-1)%7];
function calSet(){const L=LEVEL,q=[];const C=(p,a,o,hl=[],ex={})=>q.push(Object.assign(mc(p,a,o,{n:L===0?3:4}),{cal:true,hl},ex));
 if(L===0){for(const n of pick([1,5,10,14,18,22,26,30],5))C(`What day is the ${ordNum(n)}?`,dayOf(n),others(DAYS,dayOf(n),2),[n]);C('How many days are in September?','30',['31','28'],[]);C('What is the first day of September?','Monday',['Friday','Sunday'],[1])}
 if(L===1){for(const n of pick([3,9,13,19,23,27,30],4))C(`What day is the ${ordNum(n)}?`,dayOf(n),others(DAYS,dayOf(n),3));
  C('What is the date of the third Friday?','19th',['12th','26th','5th']);C('How many Wednesdays are in September?','4',['5','3','6']);C('What is the date of the last Sunday?','28th',['21st','30th','27th']);C('What day is the last day of September?','Tuesday',['Monday','Wednesday','Sunday'])}
 if(L===2){const T='Today is Wednesday 17th.';
  C(`${T} What is the date tomorrow?`,'18th',['16th','19th','24th'],[17]);C(`${T} What was the date yesterday?`,'16th',['18th','15th','10th'],[17]);C(`${T} What is the date next Wednesday?`,'24th',['18th','23rd','31st'],[17]);
  C(`${T} What was the date a week ago?`,'10th',['3rd','16th','11th'],[17]);C(`${T} What is the date a fortnight today?`,'1st October',['30th September','2nd October','24th September'],[17]);
  C('How many days is it from the 3rd to the 10th?','7',['6','8','10']);C('How many days is it from the 15th to the 20th?','5',['4','6','15'])}
 return q}
function buildSet(){const S={0:['Today is Monday.','My birthday is in May.','It is cold in winter.','I work on Saturday.','The first month is January.'],
 1:['My birthday is on the 3rd of June.','Christmas is on the 25th of December.','Monday is the first day of the week.','The leaves fall in autumn.',"I don't work on Sunday."],
 2:["I work on Monday, but I don't work on Tuesday.",'I like Saturdays because I can relax at home.','It is late, so I am going to bed.','I need a day off on Friday because I am ill.','Today is the 5th of March, and tomorrow is the 6th.']};
 return shuffle(S[LEVEL]).map(s=>({type:'build',text:s}))}
function seasonSet(){const L=LEVEL,q=[];const names=SEAS.map(s=>s[0]);
 SEAS.forEach(([s,m])=>q.push(Object.assign(mc('Which season is it?',s,others(names,s,L===0?2:3),{n:L===0?3:4}),{img:s})));
 if(L>=1){[['It is hot in ___.','summer'],['It is cold in ___.','winter'],['The leaves fall in ___.','autumn'],['The flowers grow in ___.','spring']].forEach(([p,a])=>q.push(mc(p,a,others(names,a,3))))}
 if(L===2){SEAS.forEach(([s,m])=>q.push(mc(`${m} are in ___.`,s,others(names,s,3))))}
 return shuffle(q).slice(0,10)}
/* ================= PLAY ================= */
function start(id){GAME=id;qi=0;score=0;total=0;missed=[];STREAK=0;ROUND=0;show('play');$('gtitle').textContent=GAMES.find(g=>g[0]===id)[2];
 Q=({learn:learnSet,listen:listenSet,sayit:sayitSet,short:shortSet,next:nextSet,cal:calSet,build:buildSet,seasons:seasonSet})[id]();render()}
function prog(){$('bar').style.width=(Q.length?qi/Q.length*100:0)+'%';$('cnt').textContent=`${Math.min(qi+1,Q.length)}/${Q.length}`}
const stage=h=>$('stage').innerHTML=h;
function render(){LOCK=false;stopRec();if(qi>=Q.length)return GAME==='learn'?home():end();prog();$('fb').className='fb';
 if(GAME==='learn')return rLearn();const q=Q[qi];({mc:rMC,say:rSay,build:rBuild})[q.type](q)}
function next(){qi++;render()}
function fb(ok,ans,sayt,extra=''){const f=$('fb');f.className='fb show '+(ok?'ok':'no');
 f.innerHTML=`<div class="fbt"><b>${ok?'✅ Well done!':'❌ The answer is: '+esc(ans)}</b>${extra?'<span>'+extra+'</span>':''}</div><button class="nx" onclick="next()">Next ▶</button>`;if(sayt)speak(sayable(sayt))}
function opts(list,onpick){const long=list.some(o=>o.length>16);return `<div class="opts n${list.length} ${long?'long':''}">${list.map(o=>`<button class="opt" data-v="${esc(o)}" onclick="${onpick}(this)"><span class="t ${long?'sent':''}">${esc(o)}</span></button>`).join('')}</div>`}
function mark(ans,btn){document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===ans)b.classList.add('right')});if(btn&&btn.dataset.v!==ans)btn.classList.add('wrong')}
function rLearn(){const v=Q[qi];stage(`<div class="card learn">${v.img?img(v.img,'big'):''}<div class="word">${esc(v.w)}</div><div class="mean">${esc(v.m)}</div>${say(v.say||v.w)}</div>
 <div class="row"><button class="nav" onclick="qi=Math.max(0,qi-1);render()" ${qi?'':'disabled'}>◀</button><button class="nav main" onclick="next()">${qi<Q.length-1?'Next ▶':'Finish ✓'}</button></div>`);speak(sayable(v.say||v.w))}
function rMC(q){let top='';
 if(q.speakQ){top=`<div class="card slim"><div class="q">Listen. Choose the answer.</div>${say(q.speakQ,'🔊 Listen again')}</div>`;setTimeout(()=>speak(q.speakQ),300)}
 else if(q.cal){top=`<div class="card calcard">${calHTML(q.hl||[])}<div class="q">${esc(q.prompt)} ${say(q.prompt)}</div></div>`}
 else if(q.img){top=`<div class="card">${img(q.img,'big')}<div class="q">${esc(q.prompt)}</div></div>`}
 else{const p=esc(q.prompt).replace('___','<span class="gap" id="gap">?</span>');top=`<div class="card slim"><div class="q ${q.big?'huge':'big'}">${p}</div>${say(q.prompt)}</div>`}
 stage(top+opts(q.opts,'pMC'))}
function pMC(b){if(LOCK)return;LOCK=true;SPK++;const q=Q[qi];total++;const ok=b.dataset.v===q.ans;mark(q.ans,b);const g=$('gap');if(g){g.dataset.done=1;g.classList.remove('count');g.textContent=q.ans}
 const full=q.prompt.includes('___')?q.prompt.replace('___',q.ans):q.ans;ok?right():wrong(`${q.prompt.replace('___','…')} → ${q.ans}`);fb(ok,q.ans,full)}
/* say it (speech recognition) */
let REC=null;
function stopRec(){try{REC&&REC.abort()}catch(e){}REC=null}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function rSay(q){stage(`<div class="card slim"><div class="q huge">${esc(q.text)}</div>${say(q.text,'🔊 Listen first')}</div>
 <div class="opts n2">${SR?`<button class="opt" onclick="listenMe()"><span class="t">🎤 Tap and say it</span></button>`:''}<button class="opt" onclick="selfOK()"><span class="t">✅ I said it</span></button></div><div class="hint" id="heard"></div>`);setTimeout(()=>speak(q.text),300)}
const clean=s=>s.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function listenMe(){if(LOCK)return;try{speechSynthesis.cancel()}catch(e){}const q=Q[qi];$('heard').textContent='🎤 Listening… speak now';
 REC=new SR();REC.lang='en-GB';REC.maxAlternatives=5;REC.interimResults=false;
 REC.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const tgt=clean(q.text).replace(/^the /,'');const ok=alts.some(a=>{const c=clean(a);return c.includes(tgt)||tgt.split(' ').filter(w=>w.length>2).every(w=>c.includes(w))});
  $('heard').textContent='I heard: “'+alts[0]+'”';if(ok){LOCK=true;total++;right();fb(true,q.text,'')}else{$('heard').textContent+=' – try again, or tap “I said it”.'}};
 REC.onerror=()=>{$('heard').textContent='The microphone did not work here. Say it aloud and tap “I said it”.'};
 try{REC.start()}catch(e){}}
function selfOK(){if(LOCK)return;LOCK=true;const q=Q[qi];total++;right();fb(true,q.text,'')}
/* build */
let placed=[],pool=[];
function rBuild(){const w=Q[qi].text.split(' ');placed=[];pool=shuffle(w.map((x,i)=>({x,i})));if(pool.length>1&&pool.every((p,i)=>p.i===i))pool.reverse();dBuild()}
function dBuild(){const it=Q[qi];stage(`<div class="card slim"><div class="q">Put the words in order.</div>${say(it.text,'🔊 Hint')}</div>
 <div class="slot">${placed.map((p,k)=>`<button class="tile on" onclick="unp(${k})">${esc(p.x)}</button>`).join('')||'<span class="hint">Tap the words below</span>'}</div>
 <div class="tiles">${pool.map((p,k)=>`<button class="tile" onclick="plc(${k})">${esc(p.x)}</button>`).join('')}</div>
 <div class="row"><button class="nav" onclick="rBuild()">↺ Start again</button><button class="nav main" id="chk" onclick="cBuild()" ${pool.length?'disabled':''}>Check</button></div>`)}
function plc(k){placed.push(pool.splice(k,1)[0]);dBuild()}function unp(k){pool.push(placed.splice(k,1)[0]);dBuild()}
function cBuild(){if(LOCK)return;LOCK=true;const s=Q[qi].text,got=placed.map(p=>p.x).join(' ');total++;const ok=got===s;ok?right():wrong(s);document.querySelectorAll('.tile,.nav').forEach(b=>b.disabled=true);fb(ok,s,s)}
/* end */
function end(){const pct=total?score/total:0,s=pct>=.9?3:pct>=.7?2:1;const k=`cg-best-${GAME}-${LEVEL}`;const prev=parseInt(st(k)||'0');if(score>=prev)st(k,`${score}/${total}`);
 $('bar').style.width='100%';$('cnt').textContent='';$('fb').className='fb';
 stage(`<div class="card end"><div class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><div class="big">${score} / ${total}</div><div>⭐ +${ROUND} points</div>
 ${missed.length?`<div class="miss"><b>Check again:</b><br>${missed.slice(0,4).map(esc).join('<br>')}</div>`:'<div>Excellent! No mistakes.</div>'}</div>
 <div class="row"><button class="nav" onclick="start('${GAME}')">Play again</button><button class="nav main" onclick="home()">All games</button></div>`)}
/* modals */
function modal(h){$('mbody').innerHTML=h;$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide')}
function learner(){const rows=GAMES.filter(g=>g[0]!=='learn').map(([id,ic,t])=>`<tr><td>${ic} ${t}</td><td>${st(`cg-best-${id}-${LEVEL}`)||'–'}</td></tr>`).join('');
 modal(`<h2>📧 My scores – ${LVNAME[LEVEL]}</h2><table class="sc">${rows}<tr><td><b>Total points</b></td><td><b>⭐ ${pts()}</b></td></tr></table>
 <input id="rn" placeholder="Your name" value="${esc(st('cg-name')||'')}"><input id="rm" type="email" placeholder="Email address" value="${esc(st('cg-mail')||'')}">
 <div class="row"><button class="nav main" onclick="mail()">📧 Email my scores</button><button class="nav" onclick="copyS()">📋 Copy</button></div><p id="mm" class="hint"></p>`)}
function sText(){return `Calendar & Dates game\nName: ${$('rn').value}\nLevel: ${LVNAME[LEVEL]}\nDate: ${new Date().toLocaleDateString('en-GB')}\n\n`+GAMES.filter(g=>g[0]!=='learn').map(([id,ic,t])=>`${t}: ${st(`cg-best-${id}-${LEVEL}`)||'not played'}`).join('\n')+`\n\nTotal points: ${pts()}`}
function mail(){const n=$('rn').value.trim(),m=$('rm').value.trim();if(!n){$('mm').textContent='Please write your name.';return}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$('mm').textContent='Please check the email address.';return}
 st('cg-name',n);st('cg-mail',m);location.href=`mailto:${encodeURIComponent(m)}?subject=${encodeURIComponent('Calendar game – '+n)}&body=${encodeURIComponent(sText())}`;$('mm').textContent='Your email app opens now. Press Send.'}
function copyS(){try{navigator.clipboard.writeText(sText()).then(()=>$('mm').textContent='Copied!')}catch(e){}}
function teacher(){const here=/^https?:/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)?location.origin+location.pathname:'';
 modal(`<h2>👩‍🏫 Teacher</h2><p class="hint">Paste the web address of this game. Each QR code opens one level (the level switch is hidden).</p><input id="qu" value="${esc(here)}" placeholder="https://...">
 <div class="row"><button class="nav main" onclick="mkQR()">Make QR codes</button><button class="nav" onclick="window.print()">🖨️ Print</button></div><p id="qm" class="hint"></p><div id="qrs" class="qrs"></div>
 <p class="hint">Points on this device – Pre-Entry: ${st('cg-pts-0')||0} · Entry 1: ${st('cg-pts-1')||0} · Entry 2: ${st('cg-pts-2')||0}</p><button class="nav" onclick="if(confirm('Reset all scores on this device?')){Object.keys(localStorage).filter(k=>/^cg-(pts|best)/.test(k)).forEach(k=>localStorage.removeItem(k));closeM();home()}">Reset scores</button>`)}
function mkQR(){const u=$('qu').value.trim().split('?')[0];if(!/^https?:\/\//.test(u)){$('qm').textContent='Please paste an address that starts with https://';return}
 const go=()=>{$('qrs').innerHTML=[0,1,2].map(l=>`<div class="qb"><b>${LVNAME[l]}</b><div id="qr${l}"></div><small>Calendar & Dates</small></div>`).join('');[0,1,2].forEach(l=>new QRCode($('qr'+l),{text:`${u}?level=${l}`,width:170,height:170}))};
 if(window.QRCode)return go();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=go;s.onerror=()=>$('qm').textContent='Connect to the internet to make QR codes.';document.head.appendChild(s)}
/* init */
{const r=st('cg-rate');if(r!==null&&RATES[+r]!==undefined)RATE=+r;[0,1,2].forEach(i=>$('sp'+i).classList.toggle('on',i===RATE));
 const q=new URLSearchParams(location.search).get('level');if(['0','1','2'].includes(q)){LEVEL=+q;$('lvsw').classList.add('hide')}else{const s=st('cg-level');if(['0','1','2'].includes(s))LEVEL=+s}
 [0,1,2].forEach(i=>$('lv'+i).classList.toggle('on',i===LEVEL));home();try{speechSynthesis.getVoices()}catch(e){}}
</script></body></html>
