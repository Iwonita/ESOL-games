<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Getting to Know You – Game</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1f1b2e;--muted:#4a4560;--bg:#eef3f9;--navy:#012169;--red:#c8102e;--lv:#2e7d32;--lvs:#e4f2e4;--ok:#2e9e3e;--oks:#e2f4dd;--no:#c0561c;--nos:#fbe2d2;--G:#2e9e3e;--A:#f0a500;--R:#d32f2f;box-sizing:border-box}

header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--navy);color:#fff;border-bottom:5px solid var(--red);flex:none;flex-wrap:wrap}

.dots{display:flex;gap:5px}.dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff}.dot.now{background:#fff}.dot.G{background:var(--G)}.dot.A{background:var(--A)}.dot.R{background:var(--R)}

.big{font-size:clamp(34px,min(10vh,11vw),110px);font-weight:700;letter-spacing:.14em}
.pic{flex:1;min-height:0;max-width:100%;object-fit:contain}
.vis{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;gap:12px}.vis svg,.vis img{height:100%;max-width:100%}
.opts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;height:clamp(130px,30vh,300px)}
.opts.n3{grid-template-columns:1fr 1fr 1fr}.opts.n5{grid-template-columns:repeat(5,1fr)}.opts.n2{grid-template-columns:1fr 1fr}
.opts.long{grid-template-columns:1fr;height:clamp(170px,38vh,360px)}
.opt{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:4px 10px;font-weight:700;min-height:0;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.opt span{display:block;font-size:min(42cqh,11cqw);line-height:1.1}.opts.long .opt span{font-size:min(40cqh,5.2cqw)}.opts.n5 .opt span{font-size:min(55cqh,45cqw)}
.opt:hover:not(:disabled){background:var(--lvs)}
.card .opts{width:100%;height:auto;flex:1;min-height:0;max-height:62%}
.q.huge{font-size:clamp(30px,min(10vh,8vw),110px)}.q.intro{font-size:clamp(30px,min(7.5vh,6vw),80px)}.instr.bigi{font-size:clamp(20px,min(4.2vh,3.6vw),44px)}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.25fr;gap:12px}.split .card{min-height:0}
.opts.sq{height:auto;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}.opts.sq .opt span{font-size:min(30cqh,12cqw)}

.opts.long{height:clamp(220px,54vh,560px)}.opts.long .opt span{font-size:min(34cqh,4.6cqw)}
@media (max-width:760px){.opts{height:clamp(150px,40vh,380px)}.opts.n3{grid-template-columns:1fr}.opts.n3 .opt span{font-size:min(36cqh,8cqw)!important}.opts.n3.short .opt span{font-size:min(55cqh,14cqw)!important}.opts.n3 .opt span,.opts.n2 .opt span{font-size:min(30cqh,22cqw)}.opts.sq .opt span{font-size:min(26cqh,15cqw)}.opts.long .opt span{font-size:min(36cqh,8cqw)}.opts.n5 .opt span{font-size:min(45cqh,50cqw)}}
@media (max-width:760px){.split{grid-template-columns:1fr;grid-template-rows:1fr 1.1fr}}
@media (max-width:760px){.opt span{font-size:min(38cqh,14cqw)}.opts.long .opt span{font-size:min(42cqh,9cqw)}}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}.opt:disabled:not(.ok):not(.no){opacity:.5}

.btn.sec{background:#fff;color:var(--ink)}.btn.lv{background:var(--lv);border-color:var(--lv)}.btn:disabled{opacity:.4}

.say{border:0;background:var(--ok);color:#fff;border-radius:99px;padding:.2em .9em;font-weight:700;font-size:clamp(16px,2.6vh,26px)}
/* start */
.start{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.start .flag{height:clamp(70px,16vh,170px);border-radius:10px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}

.lvbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.lvb{border:4px solid var(--ink);border-radius:22px;padding:.5em 1.4em;font-weight:700;font-size:clamp(24px,5vh,52px);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.lvb.e1{background:#2e7d32}.lvb.e2{background:#1f5fa8}
.small{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 12px;font-weight:700;font-size:.85em}

.chip.on{background:var(--lvs)}.chip.used{visibility:hidden}.chip.capd{background:#fff4cc;border-color:#e0a800}
.endp{font-weight:700;font-size:clamp(22px,4.4vh,44px)}

.reading{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:12px}

table.res td,table.res th{border-bottom:2px solid #ddd;padding:.35em .5em;text-align:left}
.rag{display:inline-block;min-width:5.5em;text-align:center;border-radius:99px;color:#fff;font-weight:700;padding:.1em .6em}.rag.G{background:var(--G)}.rag.A{background:var(--A);color:#1f1b2e}.rag.R{background:var(--R)}
.bigrag{font-size:clamp(28px,7vh,72px);font-weight:700;border-radius:24px;padding:.15em .8em;color:#fff}.bigrag.G{background:var(--G)}.bigrag.A{background:var(--A);color:#1f1b2e}.bigrag.R{background:var(--R)}
.review{overflow:hidden;width:100%;text-align:left;font-size:clamp(15px,2.5vh,24px)}.review .it{border-bottom:2px solid #eee;padding:.3em 0}.review .x{color:var(--R);font-weight:700}.review .v{color:var(--G);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px;border:3px solid var(--ink);position:relative}
.qrs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.qb{text-align:center;border:2px solid var(--ink);border-radius:12px;padding:10px}
@media print{header,.actions,main>*:not(#modal),.mbox>p,.mbox>button,.mbox input{display:none!important}#modal{position:static;background:none}.mbox{border:0;max-height:none}}
@media (max-width:760px){table.res{font-size:clamp(12px,1.9vh,17px)}table.res td,table.res th{padding:.2em .3em}.bigrag{font-size:clamp(22px,4.6vh,40px);padding:.1em .6em}.rag{min-width:4.6em}.res .ico{display:none}}
.ospk{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#f1edf9;border-radius:50%;width:34px;height:34px;line-height:34px;text-align:center;font-size:17px;font-style:normal;cursor:pointer;padding:0}
.opt{position:relative}.opt span:first-child{padding-right:34px}.opts.short .opt span:first-child{padding-right:0}
.learn{justify-content:flex-start;overflow:hidden;gap:10px}
.learn h2{margin:0;font-size:clamp(22px,4vh,34px)}
.lrow{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e6dcc8;border-radius:14px;padding:8px 12px;font-size:clamp(17px,2.9vh,26px);text-align:left}
.lrow .t{flex:1}.lrow.ex{background:#eef7ee;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;width:100%}
.board .cell{background:#f1edf9;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(13px,2vh,18px);font-weight:700}
.board .cell img{height:clamp(44px,9vh,90px);width:auto}

.bt{font-weight:800;font-size:clamp(18px,3vh,26px);align-self:flex-start}
.hint{background:#e3f4e4;border-radius:14px;padding:10px 14px;font-weight:700;font-size:clamp(18px,3vh,26px);width:100%;text-align:left}

function bestVoice(){try{const all=speechSynthesis.getVoices();let vs=all.filter(v=>/^en[-_]GB/i.test(v.lang));if(!vs.length)vs=all.filter(v=>/^en/i.test(v.lang));const sc=v=>(/natural/i.test(v.name)?100:0)+(/online/i.test(v.name)?50:0)+(/google/i.test(v.name)?40:0)+(/premium/i.test(v.name)?35:0)+(/enhanced/i.test(v.name)?30:0)+(/sonia|libby|serena|kate|daniel|female/i.test(v.name)?5:0)+(/^en[-_]US/i.test(v.lang)?3:0)-(v.localService===false?0:1);return vs.sort((a,b)=>sc(b)-sc(a))[0]}catch(e){}}
try{speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
function voice(){return bestVoice()}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/_+/g,' … ').replace(/[✘✔→●○↔|]/g,' ').replace(/\p{Extended_Pictographic}|\u200d|\ufe0f/gu,' ').replace(/\s{2,}/g,' ').trim().replace(/\([^)]*\)/g,''));u.lang='en-GB';u.rate=[0.65,0.9][RATE];const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function setRate(r){RATE=r;[0,1].forEach(i=>$('sp'+i).classList.toggle('on',i===r))}
const sayB=(t,l='🔊')=>`<button class="say" onclick='speak(${JSON.stringify(t).replace(/'/g,"&#39;")})'>${l}</button>`;
const parts=()=>GAME[S.level];const cur=()=>parts()[S.queue[S.qi]];
function hud(){if(!S.level){$('hud').innerHTML='';return}
 $('hud').innerHTML=`<button class="menub" onclick="partsMenu()">☰ All parts</button><span class="pill">${S.level===1?'Entry 1':'Entry 2'}${S.name?' · '+esc(S.name):''}</span><span class="dots">${parts().map((p,i)=>[p,i]).filter(([p,i])=>S.base.includes(i)).map(([p,i])=>{const r=S.res[p.id];const c=r!==undefined?ragOf(r,p.items.length):'';return `<span class="dot ${c} ${S.queue[S.qi]===i&&!c?'now':''}" title="${esc(p.name)}"></span>`}).join('')}</span>`}
function setActions(h){$('act').innerHTML=h}
function frame(inner){main.innerHTML=inner+`<div class="actions" id="act"></div>`}
/* clock */
function clock(h,m){const a=(h%12+m/60)*30,b=m*6;const R=(d,l)=>[100+l*Math.sin(d*Math.PI/180),100-l*Math.cos(d*Math.PI/180)];
 let s=`<svg viewBox="0 0 200 200" role="img" aria-label="clock"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#1f1b2e" stroke-width="6"/>`;
 for(let i=0;i<60;i++){const [x1,y1]=R(i*6,i%5?86:80),[x2,y2]=R(i*6,90);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1f1b2e" stroke-width="${i%5?1.5:3.5}"/>`}
 for(let i=1;i<=12;i++){const [x,y]=R(i*30,66);s+=`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="21" font-weight="700" font-family="Atkinson Hyperlegible,Verdana,sans-serif" fill="#1f1b2e">${i}</text>`}
 const [hx,hy]=R(a,46),[mx,my]=R(b,74);return s+`<line x1="100" y1="100" x2="${hx}" y2="${hy}" stroke="#1f1b2e" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="100" x2="${mx}" y2="${my}" stroke="#c0561c" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#1f1b2e"/></svg>`}
/* ---------- start ---------- */
function startScreen(){S.level=0;hud();document.body.className='l1';
 frame(`<div class="start"><span class="flag" aria-hidden="true"></span><h1>Getting to Know You</h1>
 <div class="lvbtns"><button class="lvb e1" onclick="go(1)">Entry 1</button><button class="lvb e2" onclick="go(2)">Entry 2</button></div>
 <div class="instr">Choose a block. Get GREEN in every block! 🟢</div><button class="small" onclick="teacher()">👩‍🏫 Teacher: QR codes</button></div>`);
 const L=new URLSearchParams(location.search).get('level');if(L==='1'||L==='2'){document.querySelector('.lvbtns').innerHTML=`<button class="lvb e${L}" onclick="go(${L})">Start ▶</button>`}
}
function partsParam(l){const all=GAME[l].map((_,i)=>i);const v=new URLSearchParams(location.search).get('parts');if(!v)return all;const out=[];v.split(',').forEach(x=>{const [a,b]=x.split('-').map(Number);for(let i=a;i<=(b||a);i++)if(i>=1&&i<=all.length)out.push(i-1)});return out.length?out:all}
function go(l){const n='';
 const pp=partsParam(l);S={name:n,level:l,base:pp,queue:pp.slice(),qi:0,item:0,res:{},log:{},attempt:{},lock:false,started:new Date()};document.body.className='l'+l;intro()}
/* ---------- part intro / done ---------- */

const mk=h=>String(h).replace(/[✘✗]/g,'<span class="xr">✘</span>').replace(/[✔✓]/g,'<span class="ck">✔</span>');
const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/[•→=]/g,',');
function learn(p){hud();const L=p.lesson,R=(LEARN[S.level]||{})[p.id];if(!L&&!R){intro2();return}
 const rows=R||L.rules.slice(0,3);
 frame(`<div class="card learn2"><h2>📘 ${esc(L?L.title:p.name)}</h2>${rows.map(r=>`<div class="lrow2"><span class="t">${mk(r)}</span><button class="bspk" onclick='speak(${JSON.stringify(plain(r)).replace(/'/g,"&#39;")})'>🔊</button></div>`).join('')}<div class="lnext">Next: ${esc(p.instr)}</div></div>`);
 setActions(`<button class="btn lv" id="go">I’m ready ▶</button>`);$('go').onclick=intro2;$('go').focus()}
function intro(){const p=cur();if(!(S.attempt[p.id]>0)&&p.lesson&&!p.noLearn){S.attempt[p.id]=0;learn(p);return}intro2()}
function intro2(){const p=cur();S.item=0;S.res[p.id]=undefined;delete S.res[p.id];S.log[p.id]=[];S.attempt[p.id]=(S.attempt[p.id]||0)+1;S.order=shuffle(p.items.map((_,i)=>i));hud();
 frame(`<div class="card"><div class="big" style="letter-spacing:0;font-size:clamp(60px,18vh,190px)">${p.icon}</div><div class="q intro">Part ${S.base.indexOf(S.queue[S.qi])+1} of ${S.base.length}: ${esc(p.name)}</div></div><div class="card ibox"><div class="instr bigi">${esc(String(p.instr).split(/(?<=[.!?])\s+/)[0])}</div><div class="instr bigi">${p.items.length} questions · 1 point each${S.attempt[p.id]>1?' · Try '+S.attempt[p.id]:''}</div></div>`);
 setActions(`<button class="btn lv" id="go">Start ▶</button>`);$('go').onclick=show;$('go').focus()}
function show(){S.lock=false;const p=cur(),it=p.items[S.order[S.item]];hud();
 const t=p.type==='mixed'?it.kind:p.type;NOSPK=(t==='letters'||t==='gaps');({gaps:rGaps,mcq:rMCQ,letters:rLetters,caps:rCaps,punct:rPunct,order:rOrder,reading:rReading,scene:rScene,write:rWrite})[t](p,it)}
function score(ok,q,given,right){const p=cur();S.log[p.id].push({q,given,right,ok});if(ok)S.res[p.id]=(S.res[p.id]||0)+1;else S.res[p.id]=S.res[p.id]||0}
function after(ok,right){const last=S.item>=cur().items.length-1;
 setActions(`<span class="fb ${ok?'ok':'no'}">${ok?'✅ Correct!':'❌ Answer: '+esc(right)}</span><button class="btn" id="nx">${last?'Finish part ✔':'Next ▶'}</button>`);
 $('nx').onclick=()=>{if(last)partDone();else{S.item++;show()}};$('nx').focus()}
function partDone(){const p=cur(),sc=S.res[p.id]||0,mx=p.items.length,r=ragOf(sc,mx);S.res[p.id]=sc;hud();
 frame(`<div class="card"><div class="q">${esc(p.name)} – finished!</div><div class="bigrag ${r}">${sc} / ${mx}  ${RN[r]}</div><div class="instr">${r==='G'?'Great work!':r==='A'?'Good – check your mistakes at the end.':'You will see a mini lesson and try again at the end.'}</div></div>`);
 const last=S.qi>=S.queue.length-1;setActions(`<button class="btn lv" id="nx">${last?'See my results':'Next part ▶'}</button>`);
 $('nx').onclick=()=>{if(last)results();else{S.qi++;intro()}};$('nx').focus()}
/* ---------- question types ---------- */
function opts(list,a,onpick){const o=shuffle(list);const long=list.some(x=>x.length>26);
 return {html:`<div class="opts n${o.length>4?5:o.length===2?2:o.length===3?3:4} ${long?'long':''} ${list.every(x=>x.length<=10)?'short':''}">${o.map(x=>`<button class="opt" data-v="${esc(x)}"><span>${esc(x)}</span>${!NOSPK&&x.length>=2?`<i class="ospk" role="button" aria-label="listen" onclick='event.stopPropagation();speak(${JSON.stringify(x).replace(/'/g,"&#39;")})'>🔊</i>`:''}</button>`).join('')}</div>`,
 bind(){document.querySelectorAll('.opt').forEach(b=>b.onclick=(e)=>{if(e.target.classList.contains('ospk'))return;if(S.lock)return;S.lock=true;const ok=b.dataset.v===a;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===a)x.classList.add('ok')});if(!ok)b.classList.add('no');onpick(ok,b.dataset.v)})}}}
function rMCQ(p,it){const m=opts(it.opts,it.a,(ok,g)=>{score(ok,it.q.includes('___')?it.q.replace('___','…'):(it.pic?'Picture: '+it.a:it.clock?`Clock ${it.dig||''}`:it.q),g,it.a);if(it.q.includes('___'))document.querySelector('.q').innerHTML=mk(esc(it.q)).replace('___',`<u>${esc(it.a)}</u>`);speak(it.q.includes('___')?it.q.replace('___',it.a):it.a);after(ok,it.a)});
 const vis=it.emo?`<div class="emo">${it.emo}</div>`:it.pic?`<img class="pic" src="${IMG[it.pic]}" alt="">`:it.clock?`<div class="vis">${clock(...it.clock)}</div>`:'';
 const qh=`<div class="q ${vis?'mid':'huge'}">${mk(esc(it.q)).replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')} ${vis?'':sayB(it.q)}</div>`;
 if(it.clock){frame(`<div class="split"><div class="card">${vis}${qh}</div>${m.html.replace(/class="opts[^"]*"/,'class="opts sq"')}</div>`)}
 else if(vis)frame(`<div class="card pc">${vis}${qh}</div>${m.html}`);
 else{frame(`<div class="card cq">${qh}</div>${m.html.replace('class="opts','class="opts big')}`);fitQ()}
 m.bind()}
function fitQ(){const q=document.querySelector('.card.cq .q');if(!q)return;const c=q.parentElement;const long=document.querySelector('.opts.long');
 let f=Math.min(innerHeight*(long?0.065:0.1),innerWidth*0.08);q.style.fontSize=f+'px';
 if(innerWidth>600){while(f>18&&q.scrollWidth>c.clientWidth-10){f*=0.94;q.style.fontSize=f+'px'}if(q.scrollWidth>c.clientWidth-10)q.style.whiteSpace='normal'}}
window.addEventListener('resize',()=>setTimeout(fitQ,50));
function rLetters(p,it){const shown=it.w.split('').map((c,i)=>it.gaps.includes(i)?(i===it.gaps[0]?'<span class="gap" id="g">?</span>':''):esc(c)).join('');
 const m=opts(it.opts,it.a,(ok,g)=>{$('g').textContent=it.a;$('g').style.minWidth='auto';score(ok,it.w.split('').map((c,i)=>it.gaps.includes(i)?'_':c).join(''),g,it.a);speak(it.w);after(ok,it.a+'  →  '+it.w)});
 frame(`<div class="card"><div class="instr">${esc(p.instr)}</div><div class="word">${shown}</div>${sayB(it.w,'🔊 Listen')}</div>${m.html}`);m.bind()}
function rCaps(p,it){const words=it.s.split(' ');const chosen=new Set();
 const cap=w=>/^tv\W*$/.test(w)?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1);
 frame(`<div class="card"><div class="instr">${esc(p.instr)}</div><div class="pool" id="ws">${words.map((w,i)=>`<button class="chip" data-i="${i}">${esc(w)}</button>`).join('')}</div></div>`);
 document.querySelectorAll('#ws .chip').forEach(b=>b.onclick=()=>{if(S.lock)return;const i=+b.dataset.i;if(chosen.has(i)){chosen.delete(i);b.textContent=words[i];b.classList.remove('capd')}else{chosen.add(i);b.textContent=cap(words[i]);b.classList.add('capd')}});
 setActions(`<button class="btn" id="chk">Check</button>`);
 $('chk').onclick=()=>{if(S.lock)return;S.lock=true;const need=new Set(it.caps);const ok=need.size===chosen.size&&[...need].every(i=>chosen.has(i));
  const right=words.map((w,i)=>need.has(i)?cap(w):w).join(' ');score(ok,it.s,words.map((w,i)=>chosen.has(i)?cap(w):w).join(' '),right);
  document.querySelectorAll('#ws .chip').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.textContent=need.has(i)?cap(words[i]):words[i];b.style.borderColor=need.has(i)===chosen.has(i)?'var(--G)':'var(--R)'});speak(right);after(ok,right)}}
function rPunct(p,it){const words=it.s.split(' ');const marks=p.marks||['.'];const cur={};
 frame(`<div class="card"><div class="instr">${esc(p.instr)}</div><div class="pool" id="ws">${words.map((w,i)=>`<button class="chip" data-i="${i}">${esc(w)}</button>`).join('')}</div></div>`);
 document.querySelectorAll('#ws .chip').forEach(b=>b.onclick=()=>{if(S.lock)return;const i=+b.dataset.i;const k=marks.indexOf(cur[i]);const nx=k+1<marks.length?marks[k+1]:undefined;if(nx===undefined)delete cur[i];else cur[i]=nx;b.textContent=words[i]+(cur[i]||'');b.classList.toggle('capd',!!cur[i])});
 setActions(`<button class="btn" id="chk">Check</button>`);
 $('chk').onclick=()=>{if(S.lock)return;S.lock=true;const need=it.m;const ks=new Set([...Object.keys(need),...Object.keys(cur)]);const ok=[...ks].every(i=>need[i]===cur[i]);
  const right=words.map((w,i)=>w+(need[i]||'')).join(' ');score(ok,it.s,words.map((w,i)=>w+(cur[i]||'')).join(' '),right);
  document.querySelectorAll('#ws .chip').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.textContent=words[i]+(need[i]||'');b.style.borderColor=(need[i]===cur[i])?'var(--G)':'var(--R)'});speak(right);after(ok,right)}}
function rOrder(p,it){const pool=shuffle(it.w.map((w,i)=>({w,i})));if(pool.every((x,k)=>x.i===k))pool.reverse();const picked=[];
 frame(`<div class="card"><div class="instr">${esc(it.kind?'Build the sentence.':p.instr)}</div><div class="line" id="line"></div><div class="pool" id="pool">${pool.map(x=>`<button class="chip" data-i="${x.i}">${esc(x.w)}</button>`).join('')}</div></div>`);
 const draw=()=>{$('line').innerHTML=picked.map(i=>`<span class="chip on">${esc(it.w[i])}</span>`).join('')+`<span class="endp">${esc(it.end)}</span>`;document.querySelectorAll('#pool .chip').forEach(c=>c.classList.toggle('used',picked.includes(+c.dataset.i)));$('chk').disabled=picked.length<it.w.length};
 setActions(`<button class="btn sec" id="und">↩ Undo</button><button class="btn sec" id="clr">Start again</button><button class="btn" id="chk" disabled>Check</button>`);
 document.querySelectorAll('#pool .chip').forEach(c=>c.onclick=()=>{if(S.lock)return;const i=+c.dataset.i;if(!picked.includes(i)){picked.push(i);draw()}});
 $('und').onclick=()=>{if(!S.lock){picked.pop();draw()}};$('clr').onclick=()=>{if(!S.lock){picked.length=0;draw()}};
 $('chk').onclick=()=>{if(S.lock)return;S.lock=true;const got=picked.map(i=>it.w[i]).join(' '),right=it.w.join(' ');const ok=orderOK(picked.map(i=>it.w[i]),it.w);score(ok,'Word order',got+it.end,right+it.end);speak(right);after(ok,right+it.end)};draw()}
function rReading(p,it){const m=opts(it.opts,it.a,(ok,g)=>{score(ok,it.q,g,it.a);speak(it.a);after(ok,it.a)});const first=S.item===0;
 frame(`<div class="tabs"><button class="btn sec" onclick="document.getElementById('rd').dataset.show='t';fitText()">📖 Text</button><button class="btn sec" onclick="document.getElementById('rd').dataset.show='q'">❓ Question</button></div>
 <div class="reading" id="rd" data-show="${first?'t':'q'}"><div class="text"><h3>${esc(p.title)} ${sayB(p.text.join(' '))}</h3>${p.text.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
 <div class="card"><div class="instr">Question ${S.item+1} of ${p.items.length}</div><div class="q mid">${esc(it.q)}</div>${m.html.replace('class="opts','class="opts long')}</div></div>`);m.bind();setTimeout(fitText,0);setTimeout(fitText,250)}
function fitText(){const el=document.querySelector('#rd .text');if(!el||!el.offsetParent)return;let z=52;el.style.fontSize=z+'px';while(z>9&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)){z-=1;el.style.fontSize=z+'px'}noScroll()}
window.addEventListener('resize',()=>setTimeout(fitText,50));
let NOSPK=false;
function boardHTML(sc){return `<div class="bt">${esc(sc.title)}</div><div class="board">${sc.cells.map(c=>`<div class="cell ${c.x?'x':''}">${c.pic&&IMG[c.pic]?`<img src="${IMG[c.pic]}" alt="">`:`<span style="font-size:2em">${c.ic||''}</span>`}<span>${esc(c.t)}</span><span class="m">${esc(c.m||'')}</span></div>`).join('')}</div>`}
function rScene(p,it){const m=opts(it.opts,it.a,(ok,g)=>{const full=it.q.replace('___',it.a);score(ok,it.q.replace('___','…'),g,it.a);document.querySelector('.q').innerHTML=mk(esc(it.q)).replace('___',`<u>${esc(it.a)}</u>`);speak(full);after(ok,full)});
 frame(`<div class="card scard">${boardHTML(p.scene)}<div class="q mid">${mk(esc(it.q)).replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div></div>${m.html.replace('class="opts','class="opts sopts')}`);m.bind()}
function rWrite(p,it){frame(`<div class="card wcard"><div class="q mid">${qwords(it.q)} ${sayB(it.q)}</div><div class="hint">💡 ${esc(it.hint)}</div><div id="exw"></div><div class="rate hide" id="rt"><button data-r="R" class="rR">Not yet</button><button data-r="A" class="rA">Nearly</button><button data-r="G" class="rG">I can write it!</button></div></div>`);
 setActions(`<button class="btn" id="shw">📄 Show the example</button>`);
 $('shw').onclick=()=>{$('exw').innerHTML=`<div class="exbox">${esc(it.ex)} ${sayB(it.ex)}</div><div class="instr">Check: capital letter? full stop?</div>`;$('exw').style.width='100%';speak(it.ex);$('rt').classList.remove('hide');$('shw').disabled=true};
 document.querySelectorAll('#rt button').forEach(b=>b.onclick=()=>{if(S.lock)return;S.lock=true;const r=b.dataset.r;const p2=cur();S.log[p2.id].push({q:it.q,given:{R:'Not yet',A:'Nearly',G:'I can write it'}[r],right:it.ex,ok:r==='G'});S.res[p2.id]=(S.res[p2.id]||0)+(r==='G'?1:r==='A'?0.5:0);
  document.querySelectorAll('#rt button').forEach(x=>{x.disabled=true;x.style.opacity=x===b?1:.35});after(r!=='R',it.ex)})}
/* ---------- parts menu (any time) ---------- */
function partsMenu(){try{speechSynthesis.cancel()}catch(e){};const ps=S.base.map(i=>[parts()[i],i]);
 frame(`<div class="card pmenu"><div class="q mid">${S.level===1?'Entry 1':'Entry 2'} – choose a part</div><div class="pgrid">${ps.map(([p,i],k)=>{const r=S.res[p.id];const c=r===undefined?'N':ragOf(r,p.items.length);return `<button class="ptile" onclick="jumpTo(${i})"><span class="pi">${p.icon}</span><span>${k+1}. ${esc(p.name)}</span><span class="pr ${c}">${r===undefined?'not done':r+' / '+p.items.length+' '+RN[c]}</span></button>`}).join('')}</div></div>`);
 setActions(`<button class="btn sec" id="hm">⬅ Change level</button><button class="btn" id="rs">My results</button>`);$('hm').onclick=startScreen;$('rs').onclick=results}
function jumpTo(i){S.queue=S.base.slice();S.qi=S.queue.indexOf(i);intro()}
/* ---------- results ---------- */
function results(){S.qi=S.queue.length;hud();const ps=parts().filter((p,i)=>S.base.includes(i));const max=ps.reduce((s,p)=>s+p.items.length,0),tot=ps.reduce((s,p)=>s+(S.res[p.id]||0),0),tr=ragOf(tot,max);
 const reds=S.base.filter(i=>ragOf(S.res[parts()[i].id]||0,parts()[i].items.length)==='R');
 const ambers=S.base.filter(i=>ragOf(S.res[parts()[i].id]||0,parts()[i].items.length)==='A');
 const now=new Date();
 frame(`<div class="card" style="justify-content:flex-start;overflow:hidden"><div class="q mid">${S.level===1?'Entry 1':'Entry 2'} · ${now.toLocaleDateString('en-GB')} ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
 <div class="bigrag ${tr}">${RN[tr]}  ${tot} / ${max}</div>
 <table class="res"><tr><th>Part</th><th>Score</th><th>Result</th></tr>${ps.map(p=>{const sc=S.res[p.id]||0,r=ragOf(sc,p.items.length);return `<tr><td><span class="ico">${p.icon} </span>${esc(p.name)}${S.attempt[p.id]>1?` <small>(try ${S.attempt[p.id]})</small>`:''}</td><td>${sc} / ${p.items.length}</td><td><span class="rag ${r}">${RN[r]}</span></td></tr>`}).join('')}</table>
 <div class="instr">🟢 GREEN 80%+ · 🟠 AMBER 50–79% · 🔴 RED below 50%. Show this screen to your teacher.</div></div>`);
 setActions(`<button class="btn sec" id="rev">📝 My answers</button>${reds.length?`<button class="btn lv" id="tr">📘 Mini lesson + try RED parts again</button>`:ambers.length?`<button class="btn lv" id="ta">Try AMBER parts again</button>`:''}<button class="btn sec" id="new">New game</button>`);
 $('rev').onclick=()=>review(0);$('new').onclick=startScreen;
 if($('tr'))$('tr').onclick=()=>{S.queue=reds;S.qi=0;lessonThen()};

/* ===== My House additions: random missing letters, typing writing screen, fill-the-screen sizing ===== */
const VOW='aeiou',CONS='bcdfghklmnprstw';
function pickGaps(w,n){const idx=[...w].map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0&&!(i===0&&/^[A-Z]/.test(w)));
 if(n===1)return [idx[Math.floor(Math.random()*idx.length)]];
 let a,b,t=0;do{a=idx[Math.floor(Math.random()*idx.length)];b=idx[Math.floor(Math.random()*idx.length)];t++}while((Math.abs(a-b)<2)&&t<200);return [a,b].sort((x,y)=>x-y)}
function keyLetters(right,total){const set=new Set(right);const pool=shuffle((VOW+CONS).split('').filter(c=>!set.has(c)));
 const vow=pool.filter(c=>VOW.includes(c)),con=pool.filter(c=>!VOW.includes(c));const out=[...set];
 while(out.length<total){const src=(out.length%2?vow:con).length?(out.length%2?vow:con):(vow.length?vow:con);out.push(src.shift())}return shuffle(out)}
function rGaps(p,it){const n=p.n||1;const gaps=pickGaps(it.w,n);const right=gaps.map(i=>it.w[i].toLowerCase());const fill=[];
 const keys=keyLetters(right,n===1?4:6);
 const word=()=>[...it.w].map((c,i)=>{const k=gaps.indexOf(i);if(k<0)return `<span>${esc(c)}</span>`;const v=fill[k];return `<span class="gp${v?' f':''}${k===fill.length?' nowg':''}">${v?esc(v):'&nbsp;'}</span>`}).join('');
 frame(`<div class="card gcard"><div class="instr">${esc(p.instr)}</div>${it.emo?`<div class="emo">${it.emo}</div>`:''}<div class="gword" id="gw">${word()}</div>${sayB(it.w,'🔊 Listen')}</div><div class="keys n${keys.length}" id="keys">${keys.map(k=>`<button class="opt key" data-k="${k}"><span>${k}</span></button>`).join('')}</div>`);
 const check=()=>{S.lock=true;const ok=fill.every((v,k)=>v===right[k]);
  $('gw').innerHTML=[...it.w].map((c,i)=>{const k=gaps.indexOf(i);if(k<0)return `<span>${esc(c)}</span>`;return `<span class="gp f ${fill[k]===right[k]?'gok':'gno'}">${esc(it.w[i])}</span>`}).join('');
  document.querySelectorAll('.key').forEach(b=>{b.disabled=true;if(right.includes(b.dataset.k))b.classList.add('ok')});
  score(ok,[...it.w].map((c,i)=>gaps.includes(i)?'_':c).join(' '),[...it.w].map((c,i)=>{const k=gaps.indexOf(i);return k<0?c:(fill[k]||'_')}).join(''),it.w);speak(it.w);after(ok,it.w);fitBig()};
 document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(S.lock)return;fill.push(b.dataset.k);$('gw').innerHTML=word();if(fill.length===n)check();else{setActions(`<button class="btn sec" id="und">↩ Undo</button>`);$('und').onclick=()=>{if(S.lock)return;fill.pop();$('gw').innerHTML=word();setActions('')};fitBig()}});
 setActions('')}

/* ===== no scrolling, ever: shrink whatever does not fit ===== */
function over(el){return el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1}
function shrinkToFit(el){if(!el||!el.offsetParent)return;const kids=[...el.children];kids.forEach(c=>c.style.zoom='');let z=1;while(over(el)&&z>0.3){z-=0.04;kids.forEach(c=>c.style.zoom=z)}}
function noScroll(){const m=document.getElementById('main');if(!m)return;m.style.zoom='';
 document.querySelectorAll('#main .card:not(.wcard2), #main .rcol, #main .opts, #main .keys').forEach(shrinkToFit);
 shrinkToFit(m);
 const hd=document.querySelector('header');if(hd){hd.style.zoom='';let z=1;while(hd.offsetHeight>innerHeight*0.16&&z>0.5){z-=0.05;hd.style.zoom=z}}
 window.scrollTo(0,0)}

/* "My answers": show as many as fit, then page with ◀ ▶ */
function review(k,start){start=start||0;const ps=parts().filter((p,i)=>S.base.includes(i));const p=ps[k],log=S.log[p.id]||[];
 const item=(x,i)=>`<div class="it">${i+1}. ${esc(x.q)}<br>Your answer: <span class="${x.ok?'v':'x'}">${esc(x.given)} ${x.ok?'✔':'✘'}</span>${x.ok?'':`<br>Correct: <span class="v">${esc(x.right)}</span>`}</div>`;
 frame(`<div class="card" style="justify-content:flex-start"><div class="q mid">${p.icon} ${esc(p.name)} – ${fmt(S.res[p.id]||0)} / ${p.items.length}</div><div class="review" id="rvw">${log.length?'':'<div class="instr">Not played yet.</div>'}</div></div>`);
 const box=document.getElementById('rvw'),card=box.closest('.card');let end=start;
 while(end<log.length){box.insertAdjacentHTML('beforeend',item(log[end],end));if((card.scrollHeight>card.clientHeight+1||box.scrollHeight>box.clientHeight+1)&&end>start){box.lastElementChild.remove();break}end++}
 const more=end<log.length,back=start>0;
 setActions(`${k>0&&!back?'<button class="btn sec" id="pv">◀ Part</button>':''}${back?'<button class="btn sec" id="pb">◀</button>':''}<button class="btn" id="bk">Back to results</button>${more?'<button class="btn sec" id="pm">More ▶</button>':''}${!more&&k<ps.length-1?'<button class="btn sec" id="nx">Part ▶</button>':''}`);
 $('bk').onclick=results;if($('pv'))$('pv').onclick=()=>review(k-1);if($('nx'))$('nx').onclick=()=>review(k+1);
 if($('pm'))$('pm').onclick=()=>review(k,end);if($('pb'))$('pb').onclick=()=>review(k,Math.max(0,start-(end-start)))}

/* choice words as big as each button allows */
function fitOpts(){document.querySelectorAll('#main .opts, #main .keys').forEach(g=>{const bs=[...g.querySelectorAll('.opt')];if(!bs.length)return;let best=400;
 bs.forEach(b=>{const sp=b.querySelector('span');if(!sp)return;const H=b.clientHeight;let f=Math.min(H*0.6,180);sp.style.setProperty('font-size',f+'px','important');
  const tw=()=>{const r=document.createRange();r.selectNodeContents(sp);const cs=getComputedStyle(sp);const inner=sp.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);let mx=0;[...r.getClientRects()].forEach(q=>mx=Math.max(mx,q.width));return mx>inner+1};
  const ic=b.querySelector('.ospk');let room=H-10;if(ic){const iw=ic.offsetHeight+10;if(H>3.2*iw){room=H-2*iw;sp.style.setProperty('padding','0 14px','important');ic.style.setProperty('top','8px','important');ic.style.setProperty('transform','none','important')}else{sp.style.setProperty('padding','0 '+iw+'px','important');ic.style.setProperty('top','50%','important');ic.style.setProperty('transform','translateY(-50%)','important')}}
  while(f>12&&(tw()||sp.offsetHeight>room)){f*=0.93;sp.style.setProperty('font-size',f+'px','important')}best=Math.min(best,f)});
 bs.forEach(b=>{const sp=b.querySelector('span');if(sp)sp.style.setProperty('font-size',best+'px','important')})})}

/* block menu tiles: icon and words as big as each tile allows */
function fitTiles(){const ts=[...document.querySelectorAll('.pmenu .btile')];if(!ts.length)return;let best=200;
 ts.forEach(t=>{t.style.zoom='';const H=t.clientHeight,W=t.clientWidth;const pi=t.querySelector('.pi');let f=Math.min(H*0.16,W*0.12,46);
  const set=()=>{t.style.setProperty('font-size',f+'px','important');if(pi)pi.style.setProperty('font-size',Math.min(f*2.3,H*0.4)+'px','important')};set();
  while(f>11&&(t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1)){f*=0.94;set()}best=Math.min(best,f)});
 ts.forEach(t=>{const pi=t.querySelector('.pi');t.style.setProperty('font-size',best+'px','important');if(pi)pi.style.setProperty('font-size',Math.min(best*2.3,t.clientHeight*0.4)+'px','important')})}

/* ---- best voice on every device + sound effects ---- */
let _VC=null;
const BAD=/albert|bad news|bahh|bells|boing|bubbles|cellos|zarvox|whisper|jester|organ|trinoids|wobble|superstar|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|good news|hysterical|pipe|deranged/i;
bestVoice=function(){try{if(_VC)return _VC;const all=speechSynthesis.getVoices().filter(v=>!BAD.test(v.name));if(!all.length)return null;
 let vs=all.filter(v=>/^en[-_]GB/i.test(v.lang));if(!vs.length)vs=all.filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
 const sc=v=>{const n=v.name;let x=0;
  if(/natural/i.test(n))x+=120;            // Microsoft Edge neural (Windows)
  if(/online/i.test(n))x+=40;
  if(/premium/i.test(n))x+=110;            // Apple premium (iPhone, iPad, Mac)
  if(/enhanced/i.test(n))x+=90;            // Apple enhanced
  if(/siri/i.test(n))x+=80;
  if(/google uk english/i.test(n))x+=85;   // Chrome desktop
  if(/network/i.test(n))x+=70;             // Android network voices
  if(/google/i.test(n))x+=30;
  if(/sonia|libby|maisie|ryan|thomas|serena|kate|daniel|martha|arthur|stephanie|hazel|george|susan/i.test(n))x+=15;
  if(/^en[-_]GB/i.test(v.lang))x+=20;
  if(/local/i.test(n))x-=5;
  if(/espeak|compact/i.test(n))x-=80;
  return x};
 _VC=vs.sort((a,b)=>sc(b)-sc(a))[0];return _VC}catch(e){return null}};
try{speechSynthesis.onvoiceschanged=()=>{_VC=null;bestVoice()}}catch(e){}
let _AC=null;
function ac(){try{if(!_AC)_AC=new (window.AudioContext||window.webkitAudioContext)();if(_AC.state==='suspended')_AC.resume();return _AC}catch(e){return null}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>ac(),{once:true,passive:true}));
function tone(c,f,t0,d,type,vol,f2){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);
 g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+d);
 o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+0.05)}
function sfx(ok){const c=ac();if(!c)return;try{
 if(ok){tone(c,523.25,0,0.16,'triangle',0.25);tone(c,659.25,0.09,0.16,'triangle',0.25);tone(c,783.99,0.18,0.32,'triangle',0.28)}
 else{tone(c,220,0,0.22,'square',0.08,180);tone(c,165,0.2,0.35,'square',0.08,120)}}catch(e){}}
const _afterS=after;after=function(ok,right){sfx(ok);_afterS(ok,right)};
setRate(1);startScreen();try{speechSynthesis.getVoices()}catch(e){}
/* ---- accept other correct word orders (and / but / or) ---- */
const _orderOK1=orderOK;
function altOrders(r){const out=[];const low=w=>w.toLowerCase().replace(/[,.]/g,'');
 r.forEach((w,c)=>{if(!['and','but','or'].includes(low(w))||c<2||c>r.length-2)return;
  for(let i1=1;i1<c;i1++){for(let i2=c+1;i2<r.length;i2++){
   const A=r.slice(i1,c),Bs=r.slice(i2);if(!A.length||!Bs.length)continue;
   const same=low(r[i1-1])===low(r[i2-1]),wild=(i2===c+1&&A.length===Bs.length);
   if(!same&&!wild)continue;
   const lastA=A[A.length-1],punct=(lastA.match(/[,]$/)||[''])[0];
   const A2=A.slice();A2[A2.length-1]=lastA.replace(/,$/,'');const B2=Bs.slice();B2[B2.length-1]=B2[B2.length-1]+punct;
   out.push([...r.slice(0,i1),...B2,...r.slice(c,i2),...A2])}}});
 r.forEach((w,c)=>{if(!['and','but'].includes(low(w))||c<2)return;const L=r.slice(0,c),R=r.slice(c+1);if(R.length<2)return;
  const PR=/^(he|she|we|they|it|my|his|her|our|their|the|a|an|you)$/i;if(!PR.test(low(R[0]))&&R[0]!=='I')return;if(!PR.test(low(L[0]))&&L[0]!=='I')return;const SUBJ=/^(he|she|it|they)$/i;if(SUBJ.test(low(R[0]))&&!SUBJ.test(low(L[0]))&&L[0]!=='I')return;
  const cap=x=>x==='I'?x:x[0].toUpperCase()+x.slice(1),dn=x=>x==='I'?x:x[0].toLowerCase()+x.slice(1);
  const lp=(L[L.length-1].match(/,$/)||[''])[0];const L2=L.slice();L2[L2.length-1]=L2[L2.length-1].replace(/,$/,'');L2[0]=dn(L2[0]);
  const R2=R.slice();R2[0]=cap(R2[0]);R2[R2.length-1]=R2[R2.length-1]+lp;out.push([...R2,w,...L2])});
 return out}
orderOK=function(got,right){if(_orderOK1(got,right))return true;try{return altOrders(right).some(a=>_orderOK1(got,a))}catch(e){return false}};
