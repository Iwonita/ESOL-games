<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health – ESOL game</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1f1b2e;--muted:#4a4560;--bg:#eef3f9;--navy:#012169;--red:#c8102e;--lv:#2e7d32;--lvs:#e4f2e4;--ok:#2e9e3e;--oks:#e2f4dd;--no:#c0561c;--nos:#fbe2d2;--G:#2e9e3e;--A:#f0a500;--R:#d32f2f;box-sizing:border-box}
body.l2{--lv:#1f5fa8;--lvs:#e3edf9}
*,*::before,*::after{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:clamp(15px,2.3vh,22px);display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--lv);outline-offset:2px}
.hide{display:none!important}
.flag{display:inline-block;aspect-ratio:2/1;border-radius:4px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2060%2030%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15h30v15zv15h-30zh-30v-15zv-15h30z%22/%3E%3C/clipPath%3E%3Cpath%20d%3D%22M0%2C0v30h60v-30z%22%20fill%3D%22%23012169%22/%3E%3Cpath%20d%3D%22M0%2C0L60%2C30M60%2C0L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22/%3E%3Cpath%20d%3D%22M0%2C0L60%2C30M60%2C0L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22/%3E%3Cpath%20d%3D%22M30%2C0v30M0%2C15h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22/%3E%3Cpath%20d%3D%22M30%2C0v30M0%2C15h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22/%3E%3C/svg%3E");background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);flex:none}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--navy);color:#fff;border-bottom:5px solid var(--red);flex:none;flex-wrap:wrap}
header .flag{height:1.6em}.brand{font-weight:700;font-size:1.15em}
#hud{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700}
.dots{display:flex;gap:5px}.dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff}.dot.now{background:#fff}.dot.G{background:var(--G)}.dot.A{background:var(--A)}.dot.R{background:var(--R)}
.pill{background:#fff;color:var(--ink);border-radius:99px;padding:2px 12px}
.sw{display:flex;border:2px solid #fff;border-radius:12px;overflow:hidden;background:#fff;color:var(--ink)}.sw button{border:0;background:none;padding:3px 10px;font-weight:700}.sw button.on{background:var(--ink);color:#fff}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 12px}
.card{flex:1;min-height:0;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;text-align:center;overflow:hidden}
.instr{color:var(--muted);font-weight:700;font-size:clamp(15px,2.6vh,26px)}
.q{font-weight:700;font-size:clamp(20px,min(4.8vh,5.6vw),50px);line-height:1.25}
.q.mid{font-size:clamp(18px,min(4vh,4.6vw),42px)}
.big{font-size:clamp(34px,min(10vh,11vw),110px);font-weight:700;letter-spacing:.14em}
.pic{flex:1;min-height:0;max-width:100%;object-fit:contain}
.vis{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;gap:12px}.vis svg,.vis img{height:100%;max-width:100%}
.opts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;height:clamp(130px,30vh,300px)}
.opts.n3{grid-template-columns:1fr 1fr 1fr}.opts.n5{grid-template-columns:repeat(5,1fr)}.opts.n2{grid-template-columns:1fr 1fr}
.opts.long{grid-template-columns:1fr;height:clamp(170px,38vh,360px)}
.opt{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:4px 10px;font-weight:700;min-height:0;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.opt span{display:block;font-size:min(42cqh,11cqw);line-height:1.1}.opts.long .opt span{font-size:min(40cqh,5.2cqw)}.opts.n5 .opt span{font-size:min(55cqh,45cqw)}
.opt:hover:not(:disabled){background:var(--lvs)}
.card .opts{width:100%;height:auto;flex:1;min-height:0;max-height:62%}
.q.huge{font-size:clamp(30px,min(10vh,8vw),110px)}.q.intro{font-size:clamp(30px,min(7.5vh,6vw),80px)}.instr.bigi{font-size:clamp(20px,min(4.2vh,3.6vw),44px)}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.25fr;gap:12px}.split .card{min-height:0}
.opts.sq{height:auto;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}.opts.sq .opt span{font-size:min(30cqh,12cqw)}

.opts.long{height:clamp(220px,54vh,560px)}.opts.long .opt span{font-size:min(34cqh,4.6cqw)}
@media (max-width:760px){.opts{height:clamp(150px,40vh,380px)}.opts.n3{grid-template-columns:1fr}.opts.n3 .opt span{font-size:min(36cqh,8cqw)!important}.opts.n3.short .opt span{font-size:min(55cqh,14cqw)!important}.opts.n3 .opt span,.opts.n2 .opt span{font-size:min(30cqh,22cqw)}.opts.sq .opt span{font-size:min(26cqh,15cqw)}.opts.long .opt span{font-size:min(36cqh,8cqw)}.opts.n5 .opt span{font-size:min(45cqh,50cqw)}}
@media (max-width:760px){.split{grid-template-columns:1fr;grid-template-rows:1fr 1.1fr}}
@media (max-width:760px){.opt span{font-size:min(38cqh,14cqw)}.opts.long .opt span{font-size:min(42cqh,9cqw)}}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}.opt:disabled:not(.ok):not(.no){opacity:.5}
.actions{flex:none;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:clamp(54px,8vh,80px)}
.btn{border:3px solid var(--ink);background:var(--ink);color:#fff;border-radius:16px;padding:.45em 1.3em;font-weight:700;font-size:clamp(18px,3.2vh,32px)}
.btn.sec{background:#fff;color:var(--ink)}.btn.lv{background:var(--lv);border-color:var(--lv)}.btn:disabled{opacity:.4}
.fb{font-weight:700;font-size:clamp(17px,3vh,30px);padding:.3em .8em;border-radius:14px}.fb.ok{background:var(--oks);color:#14532d}.fb.no{background:var(--nos);color:#7a2e0a}
.say{border:0;background:var(--ok);color:#fff;border-radius:99px;padding:.2em .9em;font-weight:700;font-size:clamp(16px,2.6vh,26px)}
/* start */
.start{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.start .flag{height:clamp(70px,16vh,170px);border-radius:10px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.start h1{margin:0;font-size:clamp(28px,6vh,64px)}
.start input{font:inherit;font-size:clamp(20px,3.6vh,36px);padding:.35em .7em;border:3px solid var(--ink);border-radius:14px;width:min(560px,90vw);text-align:center}
.lvbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.lvb{border:4px solid var(--ink);border-radius:22px;padding:.5em 1.4em;font-weight:700;font-size:clamp(24px,5vh,52px);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.lvb.e1{background:#2e7d32}.lvb.e2{background:#1f5fa8}
.small{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 12px;font-weight:700;font-size:.85em}
/* letters / order / caps */
.word{font-size:clamp(34px,min(10vh,9vw),100px);font-weight:700;letter-spacing:.18em}
.word .gap{display:inline-block;min-width:.8em;border-bottom:.08em solid var(--lv);color:var(--lv)}
.line{min-height:clamp(56px,9vh,90px);width:100%;border:3px dashed var(--ink);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center}
.chip{border:3px solid var(--lv);background:#fff;border-radius:14px;padding:.3em .7em;font-weight:700;font-size:clamp(18px,min(4.4vh,4.6vw),44px)}
.chip.on{background:var(--lvs)}.chip.used{visibility:hidden}.chip.capd{background:#fff4cc;border-color:#e0a800}
.endp{font-weight:700;font-size:clamp(22px,4.4vh,44px)}
/* reading */
.reading{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.text{background:#fffbea;border:3px solid var(--ink);border-radius:20px;padding:12px 18px;overflow:hidden;text-align:left;font-size:clamp(22px,min(4.6vh,3.4vw),44px);line-height:1.45}
.text h3{margin:0 0 .3em;color:var(--lv)}
.tabs{display:none}
@media (max-width:760px){.reading{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}.tabs{display:flex;gap:8px}.reading[data-show=t] .gotoq{display:block;width:100%;margin-top:16px;font-size:clamp(20px,3.4vh,28px)}.tabs button{flex:1}.reading[data-show=q] .text{display:none}.reading[data-show=t] .card{display:none}.text{font-size:clamp(20px,3.6vh,30px)}}
/* lesson + results */
.lesson{align-items:stretch;text-align:left;overflow:hidden;justify-content:flex-start}
.lesson h2{margin:0;color:var(--lv)}.lesson ul{margin:.2em 0;font-size:clamp(17px,3vh,30px);line-height:1.4}.lesson .ex{background:var(--lvs);border-radius:14px;padding:10px 16px;font-size:clamp(16px,2.8vh,28px)}
table.res{border-collapse:collapse;width:min(900px,100%);font-size:clamp(15px,2.7vh,26px)}
table.res td,table.res th{border-bottom:2px solid #ddd;padding:.35em .5em;text-align:left}
.rag{display:inline-block;min-width:5.5em;text-align:center;border-radius:99px;color:#fff;font-weight:700;padding:.1em .6em}.rag.G{background:var(--G)}.rag.A{background:var(--A);color:#1f1b2e}.rag.R{background:var(--R)}
.bigrag{font-size:clamp(28px,7vh,72px);font-weight:700;border-radius:24px;padding:.15em .8em;color:#fff}.bigrag.G{background:var(--G)}.bigrag.A{background:var(--A);color:#1f1b2e}.bigrag.R{background:var(--R)}
.review{overflow:hidden;width:100%;text-align:left;font-size:clamp(15px,2.5vh,24px)}.review .it{border-bottom:2px solid #eee;padding:.3em 0}.review .x{color:var(--R);font-weight:700}.review .v{color:var(--G);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px;border:3px solid var(--ink);position:relative}
.qrs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.qb{text-align:center;border:2px solid var(--ink);border-radius:12px;padding:10px}
@media print{header,.actions,main>*:not(#modal),.mbox>p,.mbox>button,.mbox input{display:none!important}#modal{position:static;background:none}.mbox{border:0;max-height:none}}
@media (max-width:760px){table.res{font-size:clamp(12px,1.9vh,17px)}table.res td,table.res th{padding:.2em .3em}.bigrag{font-size:clamp(22px,4.6vh,40px);padding:.1em .6em}.rag{min-width:4.6em}.res .ico{display:none}}
.ospk{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#f1edf9;border-radius:50%;width:34px;height:34px;line-height:34px;text-align:center;font-size:17px;font-style:normal;cursor:pointer;padding:0}
.opt{position:relative}.opt span:first-child{padding-right:34px}.opts.short .opt span:first-child{padding-right:0}
.learn{justify-content:flex-start;overflow:hidden;gap:10px}
.learn h2{margin:0;font-size:clamp(22px,4vh,34px)}
.lrow{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e6dcc8;border-radius:14px;padding:8px 12px;font-size:clamp(17px,2.9vh,26px);text-align:left}
.lrow .t{flex:1}.lrow.ex{background:#eef7ee;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;width:100%}
.board .cell{background:#f1edf9;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(13px,2vh,18px);font-weight:700}
.board .cell img{height:clamp(44px,9vh,90px);width:auto}
.board .cell .m{font-size:1.25em;letter-spacing:2px}
.board .cell.x{background:#fbe6e6}.board .cell.x img{opacity:.45;filter:grayscale(1)}
.bt{font-weight:800;font-size:clamp(18px,3vh,26px);align-self:flex-start}
.hint{background:#e3f4e4;border-radius:14px;padding:10px 14px;font-weight:700;font-size:clamp(18px,3vh,26px);width:100%;text-align:left}
.exbox{background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;font-size:clamp(18px,3vh,26px);width:100%;text-align:left}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.rate button{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:10px;font:inherit;font-weight:800;font-size:clamp(16px,2.6vh,22px);cursor:pointer}
@media (max-width:600px){.board{grid-template-columns:repeat(4,1fr);gap:4px}.board .cell{font-size:10px;padding:3px}.board .cell img{height:5.5vh}.bt{font-size:15px}.ospk{width:28px;height:28px;line-height:28px;font-size:14px}}

/* v2: bigger learn / scene / write, parts menu, red crosses */
.xr{color:#d22;font-weight:900}.ck{color:#2e9e3e;font-weight:900}
.learn{justify-content:space-evenly!important;gap:1.2vh!important}
.learn h2{font-size:clamp(24px,min(6vh,5vw),56px)!important}
.learn .lrow{flex:1 1 0;min-height:0;font-size:clamp(18px,min(4.6vh,3.6vw),46px)!important;padding:4px 16px}
.learn .lrow .say{flex:none}
.lpics{display:flex;gap:2vw;justify-content:center;flex:1.6 1 0;min-height:0}
.lpics img{height:100%;max-height:22vh;width:auto}
.lnext{font-size:clamp(18px,min(4vh,3.4vw),40px)!important;font-weight:800;color:var(--ink);background:#fff4cc;border-radius:14px;padding:6px 16px;width:100%;box-sizing:border-box}
.scard{justify-content:flex-start!important;gap:1vh!important;flex:3 1 0!important}
.board .cell img{height:clamp(60px,17vh,190px)!important}
.board .cell{font-size:clamp(14px,2.4vh,24px)!important}
.board .cell .m{font-size:clamp(22px,5vh,50px)!important;font-weight:900;color:var(--ink)}
.board .cell.x .m{color:#d22}
.scard .q{font-size:clamp(24px,min(6vh,5vw),60px)!important}
.sopts{flex:1 1 0!important;max-height:22%!important}
.sopts .opt span{font-size:min(50cqh,9cqw)!important}
.wcard{justify-content:space-evenly!important;gap:1.2vh!important}
.wcard .instr{font-size:clamp(16px,3.2vh,32px)!important}
.wcard .q{font-size:clamp(26px,min(7.5vh,6vw),78px)!important}
.wcard .hint{font-size:clamp(22px,min(5.6vh,4.6vw),58px)!important;text-align:center}
.wcard .exbox{font-size:clamp(24px,min(6.4vh,5vw),66px)!important;text-align:center;font-weight:700;border-width:4px}
.wcard .rate button{font-size:clamp(18px,3.6vh,36px)!important;padding:1vh}
#hud .menub{border:2px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:2px 12px;font:inherit;font-weight:800;cursor:pointer}
.pmenu{justify-content:flex-start!important;overflow:hidden}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;width:100%}
.ptile{border:3px solid var(--ink);background:#fff;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-weight:800;font-size:clamp(15px,2.4vh,22px);cursor:pointer}
.ptile .pi{font-size:2.2em;line-height:1}
.ptile .pr{border-radius:99px;padding:1px 12px;color:#fff;font-size:.85em}
.ptile .pr.G{background:#2e9e3e}.ptile .pr.A{background:#e08a00}.ptile .pr.R{background:#d22}.ptile .pr.N{background:#9aa}
table.res{font-size:clamp(13px,2.1vh,22px)!important}
table.res td,table.res th{padding:.12em .4em!important}
.bigrag{font-size:clamp(22px,5vh,52px)!important;padding:.05em .6em!important}
@media (max-width:600px){.learn .lrow{font-size:17px!important}.lpics img{max-height:12vh}.board .cell img{height:6vh!important}.board .cell{font-size:10px!important}.board .cell .m{font-size:18px!important}.scard .q{font-size:22px!important}.sopts{max-height:34%!important}.sopts .opt span{font-size:24px!important}.wcard .q{font-size:24px!important}.wcard .hint,.wcard .exbox{font-size:20px!important}}

/* v3 */
.learn2{justify-content:space-evenly!important;gap:2vh!important}
.learn2 h2{margin:0;font-size:clamp(26px,min(7vh,6vw),70px)}
.lrow2{display:flex;align-items:center;gap:2vw;width:100%;box-sizing:border-box;background:#f6f3ec;border-radius:18px;padding:1vh 2vw;font-size:clamp(24px,min(8vh,6vw),84px);font-weight:600;text-align:left}
.lrow2 .t{flex:1}
.bspk{flex:none;border:0;background:#2e7d32;color:#fff;border-radius:99px;font-size:clamp(26px,6vh,60px);padding:.1em .5em;cursor:pointer}
.learn2 .lnext{font-size:clamp(18px,4vh,40px)!important}
.pmenu .pgrid{flex:1;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));grid-auto-rows:1fr;gap:1.4vh 1vw}
.pmenu .ptile{font-size:clamp(17px,3.3vh,32px);justify-content:center;border-width:4px}
.pmenu .ptile .pi{font-size:2em}
.pmenu .ptile .pr{font-size:1em;padding:.15em .8em}
.pmenu .q{font-size:clamp(20px,4vh,40px)!important}
.card.cq{flex:0 0 auto!important;padding:2vh 2vw}
.card.cq .q{white-space:nowrap}
.opts.big{max-height:none!important;flex:1 1 0!important;min-height:0}
.opts.big .opt span:first-child{font-size:min(40cqh,11cqw)!important}
.opts.big.long .opt span:first-child{font-size:min(38cqh,5.4cqw)!important}
.ospk{width:52px!important;height:52px!important;line-height:52px!important;font-size:26px!important}
.opt span:first-child{padding-right:56px!important}
.lrow2{font-size:clamp(24px,min(9vh,6vw),96px)}
#pool .chip,#ws .chip,#line .chip{font-size:clamp(20px,min(7vh,4.2vw),60px)!important;padding:.15em .45em!important;border-width:3px}
#line{min-height:1.6em!important;font-size:clamp(20px,min(7vh,4.2vw),60px)!important}
.card .instr{font-size:clamp(16px,3.4vh,34px)}
@media (max-width:600px){#pool .chip,#ws .chip,#line .chip,#line{font-size:20px!important}.ospk{width:34px!important;height:34px!important;line-height:34px!important;font-size:17px!important}.opt span:first-child{padding-right:36px!important}.lrow2{font-size:24px}.bspk{font-size:22px}.card.cq .q{white-space:normal}.pmenu .ptile{font-size:16px}}

.pmenu .cont{width:100%;margin:0 0 1.2vh 0;font-size:clamp(17px,3vh,28px)}
.ptile .pr.P{background:#5b7fbf}
.btile.bG{border-color:#2e9e3e;background:#e8f6ea}.btile.bA{border-color:#e08a00;background:#fff4e0}.btile.bR{border-color:#d22;background:#fde8e8}
.pmenu{overflow:hidden}@media (max-width:700px){.pmenu .pgrid{grid-auto-rows:auto;flex:none}}

/* ===== v5 ===== */
.wcard .q .qw{color:var(--lv);font-weight:900}
.wcard .exbox{background:var(--lvs)!important;border-color:var(--lv)!important}

function bestVoice(){try{const all=speechSynthesis.getVoices();let vs=all.filter(v=>/^en[-_]GB/i.test(v.lang));if(!vs.length)vs=all.filter(v=>/^en/i.test(v.lang));const sc=v=>(/natural/i.test(v.name)?100:0)+(/online/i.test(v.name)?50:0)+(/google/i.test(v.name)?40:0)+(/premium/i.test(v.name)?35:0)+(/enhanced/i.test(v.name)?30:0)+(/sonia|libby|serena|kate|daniel|female/i.test(v.name)?5:0)+(/^en[-_]US/i.test(v.lang)?3:0)-(v.localService===false?0:1);return vs.sort((a,b)=>sc(b)-sc(a))[0]}catch(e){}}

 for(let i=0;i<60;i++){const [x1,y1]=R(i*6,i%5?86:80),[x2,y2]=R(i*6,90);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1f1b2e" stroke-width="${i%5?1.5:3.5}"/>`}
 for(let i=1;i<=12;i++){const [x,y]=R(i*30,66);s+=`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="21" font-weight="700" font-family="Atkinson Hyperlegible,Verdana,sans-serif" fill="#1f1b2e">${i}</text>`}
 const [hx,hy]=R(a,46),[mx,my]=R(b,74);return s+`<line x1="100" y1="100" x2="${hx}" y2="${hy}" stroke="#1f1b2e" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="100" x2="${mx}" y2="${my}" stroke="#c0561c" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#1f1b2e"/></svg>`}

 setActions(`${k>0&&!back?'<button class="btn sec" id="pv">◀ Part</button>':''}${back?'<button class="btn sec" id="pb">◀</button>':''}<button class="btn" id="bk">Back to results</button>${more?'<button class="btn sec" id="pm">More ▶</button>':''}${!more&&k<ps.length-1?'<button class="btn sec" id="nx">Part ▶</button>':''}`);
 $('bk').onclick=results;if($('pv'))$('pv').onclick=()=>review(k-1);if($('nx'))$('nx').onclick=()=>review(k+1);
 if($('pm'))$('pm').onclick=()=>review(k,end);if($('pb'))$('pb').onclick=()=>review(k,Math.max(0,start-(end-start)))}

/* choice words as big as each button allows */
function fitOpts(){document.querySelectorAll('#main .opts, #main .keys').forEach(g=>{const bs=[...g.querySelectorAll('.opt')];if(!bs.length||!g.offsetParent)return;let best=400;
 bs.forEach(b=>{const sp=b.querySelector('span');if(!sp)return;const H=b.clientHeight;let f=Math.min(H*0.6,180);sp.style.setProperty('font-size',f+'px','important');
  const tw=()=>{const r=document.createRange();r.selectNodeContents(sp);const cs=getComputedStyle(sp);const inner=sp.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);let mx=0;[...r.getClientRects()].forEach(q=>mx=Math.max(mx,q.width));return mx>inner+1};
  const ic=b.querySelector('.ospk');let room=H-10;if(ic){const iw=ic.offsetHeight+10;if(H>3.2*iw){room=H-2*iw;sp.style.setProperty('padding','0 14px','important');ic.style.setProperty('top','8px','important');ic.style.setProperty('transform','none','important')}else{sp.style.setProperty('padding','0 '+iw+'px','important');ic.style.setProperty('top','50%','important');ic.style.setProperty('transform','translateY(-50%)','important')}}
  while(f>12&&(tw()||sp.offsetHeight>room)){f*=0.93;sp.style.setProperty('font-size',f+'px','important')}best=Math.min(best,f)});
 bs.forEach(b=>{const sp=b.querySelector('span');if(sp)sp.style.setProperty('font-size',best+'px','important')})})}
const _fitBigO=fitBig;fitBig=function(){fitOpts();_fitBigO();fitOpts()};
addEventListener('resize',()=>setTimeout(fitOpts,80));

/* block menu tiles: icon and words as big as each tile allows */
function fitTiles(){const ts=[...document.querySelectorAll('.pmenu .btile')];if(!ts.length)return;let best=200;
 ts.forEach(t=>{t.style.zoom='';const H=t.clientHeight,W=t.clientWidth;const pi=t.querySelector('.pi');let f=Math.min(H*0.16,W*0.12,46);
  const set=()=>{t.style.setProperty('font-size',f+'px','important');if(pi)pi.style.setProperty('font-size',Math.min(f*2.3,H*0.4)+'px','important')};set();
  while(f>11&&(t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1)){f*=0.94;set()}best=Math.min(best,f)});
 ts.forEach(t=>{const pi=t.querySelector('.pi');t.style.setProperty('font-size',best+'px','important');if(pi)pi.style.setProperty('font-size',Math.min(best*2.3,t.clientHeight*0.4)+'px','important')})}
const _fitBigT=fitBig;fitBig=function(){fitTiles();_fitBigT()};


/* ---- best voice on every device + sound effects ---- */
let _VC=null;
const BAD=/albert|bad news|bahh|bells|boing|bubbles|cellos|zarvox|whisper|jester|organ|trinoids|wobble|superstar|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|good news|hysterical|pipe|deranged/i;
bestVoice=function(){try{if(_VC)return _VC;const all=speechSynthesis.getVoices().filter(v=>!BAD.test(v.name));if(!all.length)return null;
 let vs=all.filter(v=>/^en[-_]GB/i.test(v.lang));if(!vs.length)vs=all.filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
 const sc=v=>{const n=v.name;let x=0;
  if(/natural/i.test(n))x+=120;            // Microsoft Edge neural (Windows)
  if(/online/i.test(n))x+=40;
  if(/premium/i.test(n))x+=110;            // Apple premium (iPhone, iPad, Mac)
  if(/enhanced/i.test(n))x+=90;            // Apple enhanced
  if(/siri/i.test(n))x+=80;
  if(/google uk english/i.test(n))x+=85;   // Chrome desktop
  if(/network/i.test(n))x+=70;             // Android network voices
  if(/google/i.test(n))x+=30;
  if(/sonia|libby|maisie|ryan|thomas|serena|kate|daniel|martha|arthur|stephanie|hazel|george|susan/i.test(n))x+=15;
  if(/^en[-_]GB/i.test(v.lang))x+=20;
  if(/local/i.test(n))x-=5;
  if(/espeak|compact/i.test(n))x-=80;
  return x};
 _VC=vs.sort((a,b)=>sc(b)-sc(a))[0];return _VC}catch(e){return null}};
try{speechSynthesis.onvoiceschanged=()=>{_VC=null;bestVoice()}}catch(e){}
let _AC=null;
function ac(){try{if(!_AC)_AC=new (window.AudioContext||window.webkitAudioContext)();if(_AC.state==='suspended')_AC.resume();return _AC}catch(e){return null}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>ac(),{once:true,passive:true}));
function tone(c,f,t0,d,type,vol,f2){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);
 g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+d);
 o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+0.05)}
function sfx(ok){const c=ac();if(!c)return;try{
 if(ok){tone(c,523.25,0,0.16,'triangle',0.25);tone(c,659.25,0.09,0.16,'triangle',0.25);tone(c,783.99,0.18,0.32,'triangle',0.28)}
 else{tone(c,220,0,0.22,'square',0.08,180);tone(c,165,0.2,0.35,'square',0.08,120)}}catch(e){}}
const _afterS=after;after=function(ok,right){sfx(ok);_afterS(ok,right)};
speak=function(t){try{const txt=String(t).replace(/_+/g,' … ').replace(/[✘✔→●○↔|]/g,' ').replace(/\p{Extended_Pictographic}|\u200d|\ufe0f/gu,' ').replace(/\([^)]*\)/g,'').replace(/\s{2,}/g,' ').trim();
 const go=()=>{const u=new SpeechSynthesisUtterance(txt);const v=bestVoice();if(v){u.voice=v;u.lang=String(v.lang).replace('_','-')}else u.lang='en-GB';u.rate=[0.65,0.9][RATE];speechSynthesis.speak(u)};
 if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80)}else go()}catch(e){}};
setRate(1);startScreen();try{speechSynthesis.getVoices()}catch(e){}
/* ---- accept other correct word orders (and / but / or) ---- */
const _orderOK1=orderOK;
function altOrders(r){const out=[];const low=w=>w.toLowerCase().replace(/[,.]/g,'');
 r.forEach((w,c)=>{if(!['and','but','or'].includes(low(w))||c<2||c>r.length-2)return;
  for(let i1=1;i1<c;i1++){for(let i2=c+1;i2<r.length;i2++){
   const A=r.slice(i1,c),Bs=r.slice(i2);if(!A.length||!Bs.length)continue;
   const same=low(r[i1-1])===low(r[i2-1]),wild=(i2===c+1&&A.length===Bs.length);
   if(!same&&!wild)continue;
   const lastA=A[A.length-1],punct=(lastA.match(/[,]$/)||[''])[0];
   const A2=A.slice();A2[A2.length-1]=lastA.replace(/,$/,'');const B2=Bs.slice();B2[B2.length-1]=B2[B2.length-1]+punct;
   out.push([...r.slice(0,i1),...B2,...r.slice(c,i2),...A2])}}});
 r.forEach((w,c)=>{if(!['and','but'].includes(low(w))||c<2)return;const L=r.slice(0,c),R=r.slice(c+1);if(R.length<2)return;
  const PR=/^(he|she|we|they|it|my|his|her|our|their|the|a|an|you)$/i;if(!PR.test(low(R[0]))&&R[0]!=='I')return;if(!PR.test(low(L[0]))&&L[0]!=='I')return;const SUBJ=/^(he|she|it|they)$/i;if(SUBJ.test(low(R[0]))&&!SUBJ.test(low(L[0]))&&L[0]!=='I')return;
  const cap=x=>x==='I'?x:x[0].toUpperCase()+x.slice(1),dn=x=>x==='I'?x:x[0].toLowerCase()+x.slice(1);
  const lp=(L[L.length-1].match(/,$/)||[''])[0];const L2=L.slice();L2[L2.length-1]=L2[L2.length-1].replace(/,$/,'');L2[0]=dn(L2[0]);
  const R2=R.slice();R2[0]=cap(R2[0]);R2[R2.length-1]=R2[R2.length-1]+lp;out.push([...R2,w,...L2])});
 return out}
orderOK=function(got,right){if(_orderOK1(got,right))return true;try{const lw=x=>String(x).toLowerCase().replace(/[,.?!]/g,'').trim();if(got.length===right.length&&right.length>=4&&lw(got[0])===lw(right[right.length-1])&&got.slice(1).every((g,k)=>lw(g)===lw(right[k])))return true;return altOrders(right).some(a=>_orderOK1(got,a))}catch(e){return false}};
