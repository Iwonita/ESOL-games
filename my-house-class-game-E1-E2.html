<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My House – Class Game</title>
<style>
:root{--e1:#2E7D32;--e1bg:#E3F3E4;--e2:#1565C0;--e2bg:#E2EEFB;--ink:#1d1d1d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Tenorite,Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:1.2vw;padding:.8vh 1.6vw;border-bottom:3px solid #ddd;flex:0 0 auto}
.flag{height:clamp(22px,5vh,48px);aspect-ratio:2/1;flex:0 0 auto;border:1px solid #999}
header h1{font-size:clamp(16px,3.4vh,30px);font-weight:800;white-space:nowrap}
.badge{font-size:clamp(14px,3.2vh,30px);font-weight:900;color:#fff;padding:.2em .9em;border-radius:40px;white-space:nowrap}
.l1 .badge{background:var(--e1)} .l2 .badge{background:var(--e2)}
.count{font-size:clamp(13px,2.6vh,24px);font-weight:700;color:#444;white-space:nowrap}
.teams{display:flex;gap:8px;margin-left:auto}
.team{display:flex;align-items:center;gap:5px;background:#f2f2f2;border-radius:12px;padding:3px 7px;font-size:clamp(13px,2.6vh,22px);font-weight:800}
.team button{font:inherit;border:0;border-radius:8px;width:1.7em;height:1.7em;cursor:pointer;background:#222;color:#fff}
.team button.minus{background:#bbb;width:1.2em}
main{flex:1 1 auto;display:flex;gap:1.6vw;padding:1.4vh 1.6vw;min-height:0;transition:background .2s}
main.l1{background:var(--e1bg)} main.l2{background:var(--e2bg)}
.passage{flex:0 0 40%;background:#fff;border-radius:18px;padding:1.2em 1.4em;line-height:1.45;overflow:hidden;border:4px solid rgba(0,0,0,.08)}
.passage h3{font-size:1.05em;margin-bottom:.3em}
.card{flex:1;background:#fff;border-radius:22px;padding:2vh 2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;text-align:center;border:5px solid rgba(0,0,0,.08);min-height:0;min-width:0;overflow:hidden}
.l1 .card{border-color:var(--e1)} .l2 .card{border-color:var(--e2)}
.prompt{font-size:1em;font-weight:800;line-height:1.2}
.prompt .sub{font-weight:500}
.gap{display:inline-block;min-width:2.6em;border-bottom:.12em solid #222;margin:0 .1em}
.gap.filled{min-width:0;border:0;background:#fff3b0;padding:0 .2em;border-radius:.2em}
.spaced{letter-spacing:.16em}
.hint{font-size:.6em;color:#555;font-style:italic}
.pic{height:4.2em;max-height:30vh}
.card.withpic{flex-direction:row;gap:2vw}
.picwrap{flex:0 0 40%;height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
.picwrap{position:relative;align-self:stretch}
.picwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.content{flex:1;min-width:0;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em}
.card.withpic.only .picwrap{flex-basis:55%}
.opts{display:grid;gap:.35em;width:100%;max-width:1200px}
.opts.n2{grid-template-columns:1fr 1fr} .opts.n3{grid-template-columns:1fr 1fr 1fr} .opts.n1{grid-template-columns:1fr;max-width:900px}
.opt{font:inherit;font-size:.78em;font-weight:800;padding:.35em .3em;border-radius:.4em;border:4px solid #333;background:#fff;cursor:pointer;color:var(--ink)}
.opt.right{background:#1b8a2f;border-color:#1b8a2f;color:#fff}
.opt.wrong{background:#c62828;border-color:#c62828;color:#fff}
.opt.fade{opacity:.3}
.tiles{display:flex;flex-wrap:wrap;gap:.3em;justify-content:center}
.tile{font-size:.72em;font-weight:800;padding:.15em .5em;border:3px dashed #555;border-radius:.35em;background:#fff}
.answer{font-size:.8em;font-weight:900;padding:.25em .6em;border-radius:.35em;background:#fff8d6;border:4px solid #e0b400;display:none}
.why{font-size:.5em;color:#333;display:none}
.model{display:none;width:100%}
.model table{width:100%;border-collapse:collapse;font-size:.75em;table-layout:fixed}
.model.vert table{font-size:.7em}
.model.vert th{text-align:right;width:38%}
.model th{background:#d9d9d9;padding:.2em;border:3px solid #333;font-size:.6em}
.model td{background:#fff;padding:.3em .2em;border:3px solid #333;font-weight:800}
.model td.often{background:#fff3b0}
.shown .answer,.shown .why,.shown .model{display:block}
.shown .tiles{display:none}
footer{display:flex;gap:1vw;align-items:center;justify-content:center;padding:1vh;border-top:3px solid #ddd;flex:0 0 auto}
footer button{font:inherit;font-size:clamp(15px,3.2vh,28px);font-weight:800;padding:.35em .9em;border-radius:14px;border:0;cursor:pointer;background:#333;color:#fff}
footer .reveal{background:#e0b400;color:#000;min-width:7em}
footer .reveal:disabled{background:#ddd;color:#888}
footer .light{background:#eee;color:#000}
footer .light:disabled{opacity:.35}
#menu{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;z-index:5;padding:2vh 3vw}
#menu h2{font-size:clamp(22px,6vh,60px);font-weight:900;display:flex;align-items:center;gap:.4em;text-align:center}
#menu .sub{font-size:clamp(15px,3vh,28px);color:#444;text-align:center}
.legend{display:flex;gap:12px;font-size:clamp(14px,3vh,28px);font-weight:800}
.legend span{padding:.2em .8em;border-radius:30px;color:#fff}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.4vw;width:min(1100px,96vw)}
.blockBtn{font:inherit;font-size:clamp(16px,3.6vh,36px);font-weight:900;padding:1.4vh 1.2vw;border-radius:18px;border:4px solid #333;background:#fff;cursor:pointer;text-align:left}
.blockBtn small{display:block;font-size:.55em;font-weight:700;color:#555;margin-top:2px}
.hidden{display:none!important}
@media (max-width:700px){
  header{flex-wrap:wrap;row-gap:4px}
  .count{font-size:13px}
  .teams{gap:4px}
  footer{gap:6px}
  footer button{font-size:clamp(14px,4.4vw,22px);padding:.35em .6em}
  footer .reveal{min-width:0}
}
@media (max-aspect-ratio:1/1){
  .card.withpic{flex-direction:column}
  .picwrap{flex:0 0 38%;height:auto;width:100%;align-self:stretch}
  .card.withpic.only .picwrap{flex-basis:50%}
  .content{width:100%}
  main{flex-direction:column}
  .passage{flex:0 0 42%}
  header h1{display:none}
  .blocks{grid-template-columns:1fr}
  .opts.n3{grid-template-columns:1fr}
}

main.l0{background:#FFF2CC}
.emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(30vh,20vw);line-height:1}
.typebox{font:inherit;font-size:.8em;font-weight:700;width:100%;padding:.25em .4em;border:4px solid #333;border-radius:.35em;background:#fff}
.l1 .typebox:focus{outline:5px solid var(--e1)} .l2 .typebox:focus{outline:5px solid var(--e2)}
.checks{display:flex;flex-wrap:wrap;gap:.3em .8em;justify-content:center;font-size:.55em;font-weight:800}
.ck{padding:.1em .5em;border-radius:.4em;background:#eee}
.ck.ok{background:#1b8a2f;color:#fff}
.passage{font-size:20px}
.blockBtn.stretch{border-color:#e0b400;background:#FFF2CC}
.blocks{grid-template-columns:1fr 1fr 1fr}
.passage{flex-basis:50%}
#menu .flag{height:clamp(40px,11vh,110px)}
header .flag{height:clamp(26px,6vh,56px)}
@media (max-aspect-ratio:1/1){.blocks{grid-template-columns:1fr}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs><symbol id="uj" viewBox="0 0 60 30"><clipPath id="c"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#c)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></symbol></defs></svg>
<div id="menu">
  <h2><svg class="flag" viewBox="0 0 60 30"><use href="#uj"/></svg>My House – Class Game</h2>
  <div class="legend"><span style="background:var(--e1)">ENTRY 1</span><span style="background:var(--e2)">ENTRY 2</span></div>
  <div class="sub">Write your answer on your white paper. Hold it up!</div>
  <div class="blocks" id="blocks"></div>
</div>
<header id="hdr">
  <svg class="flag" viewBox="0 0 60 30"><use href="#uj"/></svg>
  <h1>My House</h1>
  <div class="badge" id="badge"></div>
  <div class="count" id="count"></div>
  <div class="teams">
    <div class="team">A <span id="sA">0</span><button onclick="score('A',1)">+</button><button class="minus" onclick="score('A',-1)">–</button></div>
    <div class="team">B <span id="sB">0</span><button onclick="score('B',1)">+</button><button class="minus" onclick="score('B',-1)">–</button></div>
  </div>
</header>
<main id="main">
  <div class="passage hidden" id="passage"></div>
  <div class="card" id="card"></div>
</main>
<footer>
  <button class="light" onclick="openMenu()">☰</button>
  <button onclick="go(-1)">◀</button>
  <button class="reveal" id="revealBtn" onclick="reveal()">Answer</button>
  <button onclick="go(1)">▶</button>
  <button class="light" id="sayBtn" onclick="say()" disabled title="Say the correct answer">🔊</button>
</footer>

let B=0,i=0,shown=false; const sc={A:0,B:0};
const $=id=>document.getElementById(id);
function shuffle(orig){let a;do{a=orig.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}}while(a.length>1&&a.join(' ')===orig.join(' '));return a}
function score(t,d){sc[t]=Math.max(0,sc[t]+d);$('s'+t).textContent=sc[t]}
function buildMenu(){ $('blocks').innerHTML=BLOCKS.map((b,k)=>`<button class="blockBtn${b.id==='6'?' stretch':''}" onclick="start(${k})">${b.name}<small>${b.sub} · ${b.items.length} questions</small></button>`).join('') }
function openMenu(){ $('menu').classList.remove('hidden'); try{speechSynthesis.cancel()}catch(e){} }
function start(k){ B=k;i=0;$('menu').classList.add('hidden');render() }
function fit(el,start){
  let fs=start; el.style.fontSize=fs+'px';
  const inner=()=>[...el.querySelectorAll('.opt,.tile,.content')].some(x=>x.scrollWidth>x.clientWidth+1||(x.classList.contains('content')&&x.scrollHeight>x.clientHeight+1));
  while((el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1||inner())&&fs>9){fs*=0.94;el.style.fontSize=fs+'px'}
}
function fitAll(){
  const vh=innerHeight,vw=innerWidth,wide=vw>vh,pas=$('passage');
  if(!pas.classList.contains('hidden')) fit(pas,Math.min(vh*0.05,vw*(wide?0.026:0.05)));
  fit($('card'),Math.min(vh*0.085,vw*(wide?0.055:0.09)));
}
function render(){
  const blk=BLOCKS[B],it=blk.items[i]; shown=false;
  $('main').className='l'+it.lv; $('hdr').className='l'+it.lv;
  $('badge').textContent='ENTRY '+it.lv;
  $('count').textContent=blk.name.split('·')[0].trim()+' · '+(i+1)+' / '+blk.items.length;
  const pas=$('passage');
  if(it.text){pas.classList.remove('hidden');pas.innerHTML=`<h3>${TEXTS[it.text].title}</h3>${TEXTS[it.text].body}`}else pas.classList.add('hidden');
  let h=`<div class="prompt">${it.p}</div>`;
  if(it.hint) h+=`<div class="hint">${it.hint}</div>`;
  if(it.order) h+=`<div class="tiles">${shuffle(it.order).map(w=>`<span class="tile">${w}</span>`).join('')}</div>`;
  if(it.o){const long=Math.max(...it.o.map(x=>x.length));const n=long>18?1:(it.o.length>3?2:it.o.length);h+=`<div class="opts n${n}">${it.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}</div>`}
  if(it.type) h+=`<input class="typebox" id="tb" autocomplete="off" spellcheck="false" value="${it.start||''}" oninput="checkType()"><div class="checks" id="ck">${it.checks.map(c=>`<span class="ck">☐ ${c[0]}</span>`).join('')}</div>`;
  if(it.a) h+=`<div class="answer">${it.type?'Example: ':''}${it.a}</div>`;
  if(it.why) h+=`<div class="why">${it.why}</div>`;
  const c=$('card');
  if(it.emo){c.className='card withpic';c.innerHTML=`<div class="picwrap"><div class="emo">${it.emo}</div></div><div class="content">${h}</div>`}
  else{c.className='card';c.innerHTML=h}
  $('revealBtn').disabled=false; $('sayBtn').disabled=true;
  fitAll();
  if(it.type){const tb=$('tb');tb.focus();tb.setSelectionRange(tb.value.length,tb.value.length);checkType()}
}
function checkType(){
  const it=BLOCKS[B].items[i],v=$('tb').value.trim();
  $('ck').innerHTML=it.checks.map(c=>{const ok=c[1].test(v);return `<span class="ck${ok?' ok':''}">${ok?'✔':'☐'} ${c[0]}</span>`}).join('');
}
function pick(k){ if(!shown) reveal(k) }
function reveal(k){
  if(shown) return;
  const it=BLOCKS[B].items[i]; shown=true;
  $('card').classList.add('shown'); $('revealBtn').disabled=true; $('sayBtn').disabled=false;
  if(it.o){
    const right=it.o.indexOf(it.ok);
    document.querySelectorAll('.opt').forEach((b,n)=>b.classList.add(n===right?'right':(n===k?'wrong':'fade')));
    document.querySelectorAll('.gap').forEach(g=>{g.textContent=it.ok;g.classList.add('filled')});
  }else if(it.a&&!it.type){document.querySelectorAll('.gap').forEach(g=>{g.textContent=it.a;g.classList.add('filled')})}
  fitAll(); say();
}
function go(d){
  const n=BLOCKS[B].items.length; try{speechSynthesis.cancel()}catch(e){}
  if(i+d>=n){endScreen();return}
  i=Math.max(0,i+d); render();
}
function endScreen(){
  $('passage').classList.add('hidden'); $('revealBtn').disabled=true; $('sayBtn').disabled=true;
  $('main').className='l0'; $('card').className='card';
  $('card').innerHTML=`<div class="prompt">Well done! 🎉</div><div class="hint" style="font-style:normal;font-weight:800">Team A: ${sc.A} &nbsp;·&nbsp; Team B: ${sc.B}</div><div class="hint">Now go to your worksheet.</div><button class="opt" style="max-width:12em" onclick="openMenu()">☰ Blocks</button>`;
  fitAll();
}
function say(){
  if(!shown) return;
  try{const it=BLOCKS[B].items[i]; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(it.s.replace(/’/g,"'")); u.lang='en-GB'; u.rate=.85;
  const v=bestVoice(); if(v) u.voice=v; speechSynthesis.speak(u)}catch(e){}
}
document.addEventListener('keydown',e=>{
  if(!$('menu').classList.contains('hidden')) return;
  if(document.activeElement&&document.activeElement.id==='tb'){ if(e.key==='Enter'){e.preventDefault();reveal()} return }
  if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault(); shown?go(1):reveal()}
  else if(e.key==='Escape') openMenu();
});
let wasWide=innerWidth>=innerHeight;
addEventListener('resize',()=>{ if(!$('menu').classList.contains('hidden')) return; const w=innerWidth>=innerHeight; if(w!==wasWide){wasWide=w;const sh=shown;render();if(sh)reveal()} else fitAll() });
buildMenu();
const qb=new URLSearchParams(location.search).get('block');
if(qb){const k=BLOCKS.findIndex(b=>b.id===qb); if(k>=0) start(k)}

</script>
