<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Education – My ESOL Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --k:1;
  --e1:#1f9d46; --e1d:#137232; --e1l:#e3f6e8;
  --e2:#1f6fd1; --e2d:#13509c; --e2l:#e2eefc;
  --lev:var(--e1); --levd:var(--e1d); --levl:var(--e1l);
  --gold:#f4b400; --goldl:#fff4cc;
  --red:#e0352b; --amber:#f39c12; --green:#1fa64a;
  --ink:#1d2433; --muted:#5b6475; --bg:#f3f6fb; --card:#fff; --line:#d9e0ea;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-weight:700}
body.l2{--lev:var(--e2);--levd:var(--e2d);--levl:var(--e2l)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;font-weight:800;border:0;cursor:pointer;color:inherit}
.f{font-size:calc(var(--k) * 1rem)}

/* header */
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:3px solid var(--lev);flex:0 0 auto}
header .uj{width:54px;height:30px;flex:0 0 auto;border-radius:4px;box-shadow:0 1px 3px #0003}
header .t{flex:1;min-width:0;line-height:1.1}
header .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{font-size:13px;color:var(--muted);white-space:nowrap}
.pill{background:var(--lev);color:#fff;border-radius:99px;padding:5px 12px;font-size:15px;font-weight:900;white-space:nowrap}
.hbtn{background:var(--levl);color:var(--levd);border-radius:12px;padding:9px 13px;font-size:16px;white-space:nowrap}

#stage{flex:1 1 auto;min-height:0;overflow:hidden;padding:12px;display:flex;flex-direction:column}
.center{margin:auto;width:100%;max-width:1000px}

/* start */
.start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--k)*16px);height:100%;justify-content:center}
.start .ujbig{width:min(62vw,300px);height:auto;border-radius:10px;box-shadow:0 6px 18px #0003}
.start h1{font-size:calc(var(--k)*clamp(34px,6vh,60px));font-weight:900;line-height:1}
.start p{font-size:calc(var(--k)*clamp(18px,2.6vh,26px));color:var(--muted)}
.levbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%}
.lev{flex:1 1 220px;max-width:340px;border-radius:22px;padding:calc(var(--k)*22px) 16px;font-size:calc(var(--k)*clamp(30px,4.8vh,46px));color:#fff;box-shadow:0 6px 0 #0003}
.lev.a{background:var(--e1)}.lev.b{background:var(--e2)}
.lev:active{transform:translateY(3px);box-shadow:0 3px 0 #0003}
.qrs{display:none;gap:30px;justify-content:center}
.qrs div{font-size:16px;color:var(--muted)}
.qrs .q{background:#fff;padding:8px;border-radius:10px;margin-bottom:4px;display:inline-block}
@media (min-width:1000px) and (min-height:700px){.qrs{display:flex}}

/* menu */
.menu{display:flex;flex-direction:column;height:100%;gap:calc(var(--k)*10px)}
.menu h2{font-size:calc(var(--k)*clamp(20px,3vh,30px));text-align:center}
.grid{flex:1;min-height:0;display:grid;gap:calc(var(--k)*10px);grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:16px;border:3px solid var(--line);display:flex;align-items:center;gap:8px;padding:6px 10px;text-align:left;min-height:0;overflow:hidden}
.tile img{height:100%;max-height:calc(var(--k)*70px);aspect-ratio:1;object-fit:contain;flex:0 0 auto}
.tile .tx{flex:1;min-width:0;line-height:1.1}
.tile .n{font-size:calc(var(--k)*13px);color:var(--muted)}
.tile .nm{font-size:calc(var(--k)*clamp(15px,2.2vh,20px));font-weight:900}
.tile .st{display:inline-block;margin-top:4px;font-size:calc(var(--k)*13px);border-radius:99px;padding:2px 9px;background:var(--levl);color:var(--levd)}
.tile.star{background:var(--goldl);border-color:var(--gold)}
.tile.g{border-color:var(--green)}.tile.a{border-color:var(--amber)}.tile.r{border-color:var(--red)}
.st.g{background:var(--green);color:#fff}.st.a{background:var(--amber);color:#fff}.st.r{background:var(--red);color:#fff}
.mfoot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--lev);color:#fff;border-radius:16px;padding:calc(var(--k)*13px) calc(var(--k)*24px);font-size:calc(var(--k)*clamp(18px,2.6vh,26px));box-shadow:0 4px 0 var(--levd)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--levd)}
.btn.ghost{background:#fff;color:var(--levd);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.goldb{background:var(--gold);color:#3b2b00;box-shadow:0 4px 0 #b88700}

/* intro */
.intro{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--k)*22px);text-align:center}
.ititle{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:calc(var(--k)*18px) 26px;border:3px solid var(--lev)}
.ititle img{height:calc(var(--k)*clamp(110px,24vh,230px));max-width:70vw;object-fit:contain}
.ititle .pn{font-size:calc(var(--k)*18px);color:var(--muted)}
.ititle h2{font-size:calc(var(--k)*clamp(26px,4.4vh,44px));font-weight:900;line-height:1.1}
.iins{font-size:calc(var(--k)*clamp(22px,3.4vh,34px))}
.icount{font-size:calc(var(--k)*clamp(16px,2.3vh,22px));color:var(--muted);margin-top:4px}

/* question */
.q{height:100%;display:flex;flex-direction:column;gap:calc(var(--k)*10px)}
.qtop{display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*8px);flex:1 1 auto;min-height:0;justify-content:center;text-align:center}
.qimg{max-height:calc(var(--k)*clamp(110px,30vh,300px));max-width:80%;object-fit:contain;border-radius:12px;min-height:0}
.prompt{font-size:calc(var(--k)*clamp(24px,4.4vh,46px));line-height:1.2;font-weight:900;max-width:1000px}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--lev);color:var(--levd)}
.big1{font-size:calc(var(--k)*clamp(40px,8vh,80px));font-weight:900;color:var(--levd)}
.hint{font-size:calc(var(--k)*clamp(26px,4.6vh,44px));letter-spacing:.18em;color:var(--muted)}
.sub{font-size:calc(var(--k)*clamp(17px,2.4vh,24px));color:var(--muted)}
.opts{display:grid;gap:calc(var(--k)*10px);grid-template-columns:repeat(var(--cols,3),1fr);flex:0 0 auto}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:calc(var(--k)*14px) 8px;font-size:calc(var(--k)*clamp(24px,4.6vh,46px));line-height:1.1;font-weight:900;box-shadow:0 4px 0 var(--line);min-height:calc(var(--k)*clamp(70px,13vh,130px))}
.opt.long{font-size:calc(var(--k)*clamp(18px,3vh,30px));font-weight:800}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 #137232}
.opt.no{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 #9b1f17}
.opt[disabled]{cursor:default}
.fb{display:flex;align-items:center;justify-content:center;gap:12px;flex:0 0 auto;min-height:calc(var(--k)*64px);flex-wrap:wrap}
.fbmsg{font-size:calc(var(--k)*clamp(20px,3vh,30px));font-weight:900}
.fbmsg.g{color:var(--green)}.fbmsg.r{color:var(--red)}
.say{background:var(--levl);color:var(--levd);border-radius:14px;padding:10px 14px;font-size:calc(var(--k)*22px)}

/* typing */
.tin{width:min(100%,760px);font-family:inherit;font-weight:800;font-size:calc(var(--k)*clamp(24px,4.4vh,42px));padding:12px 16px;border:3px solid var(--lev);border-radius:16px;text-align:center;background:#fff;color:var(--ink);outline:none}
.tin.ok{border-color:var(--green);background:#e7f7ec}.tin.no{border-color:var(--red);background:#fdeceb}
.corr{font-size:calc(var(--k)*clamp(22px,3.6vh,36px));color:var(--green);font-weight:900}
.wrongtxt{font-size:calc(var(--k)*clamp(20px,3vh,30px));color:var(--red);text-decoration:line-through}

/* order */
.oline{min-height:calc(var(--k)*clamp(64px,11vh,100px));width:min(100%,1000px);border:3px dashed var(--lev);border-radius:18px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px}
.oline.ok{border-style:solid;border-color:var(--green);background:#e7f7ec}.oline.no{border-style:solid;border-color:var(--red);background:#fdeceb}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:calc(var(--k)*60px)}
.tilew{background:var(--levl);color:var(--levd);border:3px solid var(--lev);border-radius:14px;padding:calc(var(--k)*10px) calc(var(--k)*16px);font-size:calc(var(--k)*clamp(22px,4vh,40px));font-weight:900;box-shadow:0 3px 0 var(--levd)}
.oline .tilew{background:#fff;box-shadow:none}

/* reading */
.read{height:100%;display:flex;gap:12px;min-height:0}
.rtext{flex:1.15;min-width:0;background:#fffdf5;border:3px solid #e9dfb8;border-radius:18px;padding:calc(var(--k)*14px) calc(var(--k)*18px);font-size:calc(var(--k)*clamp(15px,2.35vh,24px));line-height:1.35;overflow:hidden;font-weight:600}
.rtext h3{font-size:1.35em;font-weight:900;margin-bottom:.25em;color:#7a5a00}
.rtext p{margin-bottom:.4em}
.rtext .big{font-size:1.15em;font-weight:900}
.rq{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--k)*10px);justify-content:center}
.rq .prompt{font-size:calc(var(--k)*clamp(20px,3.3vh,34px))}
.rq .opts{--cols:1}
.rq .opt{min-height:calc(var(--k)*clamp(52px,9vh,90px));font-size:calc(var(--k)*clamp(20px,3.3vh,34px))}
.tabs{display:none;gap:8px}
.tabs button{flex:1;border-radius:12px;padding:9px;font-size:18px;background:#fff;border:3px solid var(--line)}
.tabs button.on{background:var(--lev);color:#fff;border-color:var(--lev)}
@media (max-width:760px){
  .readwrap{display:flex;flex-direction:column;gap:8px;height:100%}
  .tabs{display:flex}
  .read{flex:1}
  .read.showq .rtext{display:none}
  .read.showt .rq{display:none}
}
.readwrap{display:flex;flex-direction:column;gap:8px;height:100%}

/* writing self-check */
.wr{height:100%;display:flex;gap:14px;min-height:0}
.wl{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--k)*8px);justify-content:center}
.wl .prompt{font-size:calc(var(--k)*clamp(22px,3.6vh,36px))}
.lab{font-size:calc(var(--k)*15px);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.starter{font-size:calc(var(--k)*clamp(24px,4vh,40px));font-weight:900;color:var(--levd)}
.ta{width:100%;font-family:inherit;font-weight:800;font-size:calc(var(--k)*clamp(20px,3.3vh,32px));padding:10px 14px;border:3px solid var(--lev);border-radius:16px;resize:none;outline:none;line-height:1.3;overflow:hidden;min-height:2.8em;color:var(--ink)}
.paper{font-size:calc(var(--k)*15px);color:var(--muted)}
.ex{background:#e7f7ec;border-radius:14px;padding:8px 12px;font-size:calc(var(--k)*clamp(18px,2.8vh,28px));color:#137232}
.wrr{flex:0 0 clamp(150px,24vw,240px);display:flex;flex-direction:column;gap:10px;justify-content:center}
.rag{border-radius:16px;padding:calc(var(--k)*12px) 8px;font-size:calc(var(--k)*clamp(17px,2.5vh,24px));color:#fff;box-shadow:0 4px 0 #0003}
.rag.r{background:var(--red)}.rag.a{background:var(--amber)}.rag.g{background:var(--green)}
.rag[disabled]{opacity:.35}
@media (max-width:760px){.wr{flex-direction:column}.wrr{flex:0 0 auto;flex-direction:row}.rag{flex:1}}

/* results */
.res{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--k)*16px);text-align:center}
.score{font-size:calc(var(--k)*clamp(54px,11vh,110px));font-weight:900;line-height:1}
.score.g{color:var(--green)}.score.a{color:var(--amber)}.score.r{color:var(--red)}
.rbadge{display:inline-block;border-radius:99px;padding:8px 22px;color:#fff;font-size:calc(var(--k)*clamp(20px,3vh,30px))}
.rbadge.g{background:var(--green)}.rbadge.a{background:var(--amber)}.rbadge.r{background:var(--red)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rtable{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;width:min(100%,900px);text-align:left}
@media (min-width:760px){.rtable{grid-template-columns:repeat(3,1fr)}}
.rrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;font-size:calc(var(--k)*clamp(14px,2vh,19px));border-left:8px solid var(--line)}
.rrow.g{border-left-color:var(--green)}.rrow.a{border-left-color:var(--amber)}.rrow.r{border-left-color:var(--red)}
.rrow span:first-child{flex:1}
.stamp{font-size:calc(var(--k)*16px);color:var(--muted)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

<div id="app">

  <div id="stage"></div>

</svg>

const LEVELS = {1:E1, 2:E2};

/* ---------------------------------------------------------------- STATE */
let S = {}; try { S = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e) { S = {}; }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e){} }
let level = null, cur = null; // cur = {p, i, pts, tries}
function LS(){ S[level] = S[level] || {}; return S[level]; }
function pstate(p){ const l = LS(); l[p] = l[p] || {}; return l[p]; }

/* ---------------------------------------------------------------- VOICE */
let VOICE = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices(); if (!vs.length) return;
  const gb = vs.filter(v => /en[-_]GB/i.test(v.lang));
  const rank = v => {
    const n = v.name;
    if (/natural|online/i.test(n)) return 0;
    if (/google uk english/i.test(n)) return 1;
    if (/premium|enhanced/i.test(n)) return 2;
    return 3;
  };
  const pool = gb.length ? gb : vs.filter(v => /^en/i.test(v.lang));
  pool.sort((a, b) => rank(a) - rank(b));
  VOICE = pool[0] || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t){
  if (!('speechSynthesis' in window) || !t) return;
  t = t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}★➕→✓✗]/gu, '').replace(/_+/g, ' ').replace(/£(\d+)/g, '$1 pounds').trim();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  if (VOICE){ u.voice = VOICE; u.lang = VOICE.lang; } else u.lang = 'en-GB';
  u.rate = .9;
  speechSynthesis.speak(u);
}

/* ---------------------------------------------------------------- HELPERS */
const $ = s => document.querySelector(s);
const stage = $('#stage');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const img = k => IMG[k] ? `<img src="${IMG[k]}" alt="">` : '';
const pct = (p, t) => t ? p / t : 0;
const rag = f => f >= .8 ? 'g' : f >= .5 ? 'a' : 'r';
const RAGW = {g:'Green – well done!', a:'Amber – nearly there!', r:'Red – try again!'};
function fill(q, a){ return q.replace(/_{2,}/, a).replace(/\s+([.?!,])/g, '$1'); }
function gapHTML(q, inner){ return esc(q).replace(/_{2,}/, `<span class="gap">${inner || '&nbsp;'}</span>`); }
function sentence(tiles){ let s = tiles.join(' '); s = s.charAt(0).toUpperCase() + s.slice(1); return s + '.'; }
function norm(s, cs){ s = s.replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim(); return cs ? s : s.toLowerCase(); }

function fit(){
  const root = document.documentElement;
  const set = k => root.style.setProperty('--k', k.toFixed(2));
  const bad = () => stage.scrollHeight > stage.clientHeight + 1 || overflowing();
  let k = 1; set(k);
  if (!bad()){
    // grow to fill big screens, then step back once it no longer fits
    while (k < 1.9){ set(k + .05); if (bad()){ set(k); break; } k += .05; }
  } else {
    let n = 0;
    while (bad() && k > .55 && n++ < 20){ k -= .05; set(k); }
  }
}
function overflowing(){
  const els = stage.querySelectorAll('.rtext,.grid,.q,.qtop,.rq,.wl,.wr,.menu,.res,.intro,.start,.tile,.opts');
  for (const e of els) if (e.scrollHeight > e.clientHeight + 1 || e.scrollWidth > e.clientWidth + 1) return true;
  return false;
}
let fitT; const refit = () => { clearTimeout(fitT); fitT = setTimeout(fit, 60); };
window.addEventListener('resize', refit);
if (window.visualViewport) visualViewport.addEventListener('resize', refit);

function header(show, title, sub){
  $('#hdr').style.display = show ? 'flex' : 'none';
  if (title) $('#htitle').textContent = title;
  $('#hsub').textContent = sub || '';
  $('#hlev').textContent = level == 2 ? 'Entry 2' : 'Entry 1';
}
$('#hmenu').onclick = () => { if ('speechSynthesis' in window) speechSynthesis.cancel(); menu(); };

/* ---------------------------------------------------------------- SCREENS */
function start(){
  header(false);
  stage.innerHTML = `<div class="start pop">
    <svg class="ujbig" viewBox="0 0 60 30"><use href="#ujs"/></svg>
    <div><h1>Education</h1><p>My ESOL Class · Reading and Writing</p></div>
    <p>Choose your level.</p>
    <div class="levbtns"><button class="lev a" data-l="1">Entry 1</button><button class="lev b" data-l="2">Entry 2</button></div>
    <div class="qrs"><div><span class="q" id="qr1"></span><br>Entry 1</div><div><span class="q" id="qr2"></span><br>Entry 2</div></div>
  </div>`;
  stage.querySelectorAll('.lev').forEach(b => b.onclick = () => setLevel(+b.dataset.l));
  if (!window.QRCode) stage.querySelector('.qrs').remove();
  try {
    if (window.QRCode){
      new QRCode($('#qr1'), {text: GAME_URL + '?level=1', width: 130, height: 130});
      new QRCode($('#qr2'), {text: GAME_URL + '?level=2', width: 130, height: 130});
    }
  } catch(e){}
  fit();
}
function setLevel(l){
  level = l; document.body.classList.toggle('l2', l == 2);
  try { history.replaceState(null, '', location.pathname + '?level=' + l); } catch(e){}
  menu();
}

function menu(){
  cur = null;
  header(true, 'Education – My ESOL Class', 'Choose a part');
  const parts = LEVELS[level];
  const tiles = parts.map((p, i) => {
    const s = pstate(i);
    let cls = '', st = 'Start ▶';
    if (s.res){ const r = rag(pct(s.res[0], s.res[1])); cls = r; st = `<span class="st ${r}">${fmt(s.res[0])}/${s.res[1]}</span>`; }
    if (s.i != null && s.i > 0 && s.i < p.items.length) st = `<span class="st">Continue ${s.i + 1}/${p.items.length} ▶</span>`;
    else if (!s.res) st = `<span class="st">Start ▶</span>`;
    return `<button class="tile ${p.star ? 'star' : ''} ${cls}" data-p="${i}">${img(p.pic)}
      <div class="tx"><div class="n">Part ${i + 1}</div><div class="nm">${esc(p.t)}</div>${st}</div></button>`;
  }).join('');
  stage.innerHTML = `<div class="menu pop">
    <div class="grid">${tiles}</div>
    <div class="mfoot"><button class="btn goldb" id="myres">🏆 My results</button>
    <button class="btn ghost" id="chg">Change level</button></div></div>`;
  stage.querySelectorAll('.tile').forEach(b => b.onclick = () => intro(+b.dataset.p));
  $('#myres').onclick = results; $('#chg').onclick = start;
  fit();
}
const fmt = n => Number.isInteger(n) ? n : n.toFixed(1).replace('.5', '½').replace('.0', '');

function intro(p){
  const P = LEVELS[level][p], s = pstate(p), n = P.items.length;
  const resume = s.i != null && s.i > 0 && s.i < n;
  header(true, P.t, `Part ${p + 1} of ${LEVELS[level].length}`);
  const unit = P.type === 'write' ? 'sentences' : 'questions';
  stage.innerHTML = `<div class="intro pop">
    <div class="ititle">${img(P.pic)}<div class="pn">Part ${p + 1} of ${LEVELS[level].length}</div><h2>${esc(P.t)}</h2></div>
    <div><div class="iins">${esc(P.ins)}</div><div class="icount">${n} ${unit} · 1 point each</div></div>
    <div class="btns">${resume ? `<button class="btn" id="go">Continue ${s.i + 1}/${n} ▶</button><button class="btn ghost" id="again">Start again</button>`
                               : `<button class="btn" id="again">Start ▶</button>`}</div></div>`;
  if (resume) $('#go').onclick = () => { cur = {p, i: s.i, pts: s.pts || 0}; show(); };
  $('#again').onclick = () => { s.i = 0; s.pts = 0; save(); cur = {p, i: 0, pts: 0}; show(); };
  fit();
}

function show(){
  const P = LEVELS[level][cur.p];
  if (cur.i >= P.items.length) return partEnd();
  const it = P.items[cur.i];
  cur.tries = 0;
  header(true, P.t, `Part ${cur.p + 1} · ${cur.i + 1} of ${P.items.length}`);
  const ty = it.w === 1 ? 'write' : it.mc ? 'mc' : P.type;
  ({pic: qMC, mc: qMC, type: qType, order: qOrder, read: qRead, write: qWrite})[ty](P, it);
}
function award(x){
  cur.pts += x;
  const s = pstate(cur.p); s.i = cur.i + 1; s.pts = cur.pts; save();
}
function next(){ cur.i++; show(); }
function fbBar(ok, msg, sayTxt){
  const fb = stage.querySelector('.fb');
  fb.innerHTML = `<span class="fbmsg ${ok ? 'g' : 'r'}">${msg}</span>
    ${sayTxt ? '<button class="say" id="rep">🔊</button>' : ''}<button class="btn" id="nx">Next ▶</button>`;
  if (sayTxt){ $('#rep').onclick = () => speak(sayTxt); speak(sayTxt); }
  $('#nx').onclick = next; $('#nx').focus({preventScroll: true});
  fit();
}

/* multiple choice (with or without picture) */
function qMC(P, it){
  const opts = shuffle(it.o);
  const long = opts.some(o => o.length > 14);
  const cols = it.cols || P.cols || (long ? 1 : opts.length);
  const pic = it.img ? `<img class="qimg" src="${IMG[it.img]}" alt="">` : '';
  const bigw = it.big ? `<div class="big1">${esc(it.big)}</div>` : '';
  const prompt = it.big ? `<div class="sub">Same meaning?</div>` : `<div class="prompt">${gapHTML(it.q)}</div>`;
  stage.innerHTML = `<div class="q pop"><div class="qtop">${pic}${bigw}${prompt}</div>
    <div class="opts" style="--cols:${cols}">${opts.map(o => `<button class="opt ${long ? 'long' : ''}">${esc(o)}</button>`).join('')}</div>
    <div class="fb"></div></div>`;
  const sayTxt = it.say || (/_{2,}/.test(it.q) ? fill(it.q, it.a) : it.a);
  stage.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.textContent === it.a;
    stage.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.textContent === it.a) x.classList.add('ok'); });
    if (!ok) b.classList.add('no', 'shake');
    const g = stage.querySelector('.gap'); if (g) g.textContent = it.a;
    award(ok ? 1 : 0);
    fbBar(ok, ok ? '✓ Correct!' : '✗ Not this time', sayTxt);
  });
  fit();
}

/* typing */
function qType(P, it){
  const pic = it.img ? `<img class="qimg" src="${IMG[it.img]}" alt="">` : '';
  const top = it.big ? `<div class="big1">${esc(it.big)}</div>` : '';
  const q = it.q ? `<div class="prompt" style="color:var(--muted)">${esc(it.q)}</div>` : '';
  const hint = it.hint ? `<div class="hint">${esc(it.hint)}</div>` : '';
  stage.innerHTML = `<div class="q pop"><div class="qtop">${pic}${top}${q}${hint}
    <input class="tin" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div id="extra"></div></div>
    <div class="fb"><button class="btn" id="chk">Check ✓</button></div></div>`;
  const inp = $('#tin');
  setTimeout(() => inp.focus({preventScroll: true}), 150);
  const check = () => {
    const v = inp.value; if (!v.trim()) { inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 400); return; }
    const cs = !!P.cs;
    const ok = it.a.some(a => {
      let x = norm(v, cs), y = norm(a, cs);
      if (cs && !P.strict){ x = x.replace(/\.$/, ''); y = y.replace(/\.$/, ''); }
      return x === y;
    });
    cur.tries++;
    if (ok){
      inp.classList.remove('no'); inp.classList.add('ok'); inp.disabled = true;
      award(cur.tries === 1 ? 1 : .5);
      fbBar(true, cur.tries === 1 ? '✓ Correct!' : '✓ Correct! (½ point)', it.a[0]);
    } else if (cur.tries === 1){
      inp.classList.add('no', 'shake'); setTimeout(() => inp.classList.remove('shake'), 400);
      $('#extra').innerHTML = `<div class="sub" style="color:var(--red)">Not quite. Try again!</div>`;
      inp.focus({preventScroll: true}); fit();
    } else {
      inp.disabled = true;
      $('#extra').innerHTML = `<div class="corr">✓ ${esc(it.a[0])}</div>`;
      award(0);
      fbBar(false, '✗ Look at the answer', it.a[0]);
    }
  };
  $('#chk').onclick = check;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); if (!inp.disabled) check(); } });
  fit();
}

/* word order */
function qOrder(P, it){
  let pool;
  const key = t => t.join(' ').toLowerCase();
  const right = it.a.map(key);
  do { pool = shuffle(it.w); } while (right.includes(key(pool)));
  let line = [];
  stage.innerHTML = `<div class="q pop"><div class="qtop">
    <div class="sub">Tap the words.</div>
    <div class="oline" id="ol"></div><div class="pool" id="pl"></div><div id="extra"></div></div>
    <div class="fb"></div></div>`;
  const draw = () => {
    $('#ol').innerHTML = line.map((w, i) => `<button class="tilew" data-i="${i}">${esc(w)}</button>`).join('');
    $('#pl').innerHTML = pool.map((w, i) => `<button class="tilew" data-i="${i}">${esc(w)}</button>`).join('');
    $('#ol').querySelectorAll('button').forEach(b => b.onclick = () => { pool.push(line.splice(+b.dataset.i, 1)[0]); draw(); });
    $('#pl').querySelectorAll('button').forEach(b => b.onclick = () => { line.push(pool.splice(+b.dataset.i, 1)[0]); draw(); if (!pool.length) check(); });
    fit();
  };
  const check = () => {
    const ok = right.includes(key(line));
    cur.tries++;
    const ol = $('#ol');
    if (ok){
      ol.classList.add('ok'); ol.innerHTML = `<span class="prompt">${esc(sentence(line))}</span>`;
      award(cur.tries === 1 ? 1 : .5);
      fbBar(true, cur.tries === 1 ? '✓ Correct!' : '✓ Correct! (½ point)', sentence(line));
    } else if (cur.tries === 1){
      ol.classList.add('no', 'shake');
      $('#extra').innerHTML = `<div class="sub" style="color:var(--red)">Not quite. Tap a word to move it back.</div>`;
      setTimeout(() => ol.classList.remove('no', 'shake'), 700);
      fit();
    } else {
      ol.classList.add('no'); ol.innerHTML = `<span class="wrongtxt">${esc(sentence(line))}</span>`;
      $('#extra').innerHTML = `<div class="corr">✓ ${esc(sentence(it.a[0]))}</div>`;
      award(0);
      fbBar(false, '✗ Look at the answer', sentence(it.a[0]));
    }
  };
  draw();
}

/* reading */
let readTab = 'q';
function qRead(P, it){
  const opts = shuffle(it.o);
  stage.innerHTML = `<div class="readwrap pop">
    <div class="tabs"><button id="tt">📄 Text</button><button id="tq">❓ Question</button></div>
    <div class="read show${readTab}"><div class="rtext">${P.text}</div>
    <div class="rq"><div class="prompt">${esc(it.q)}</div>
      <div class="opts">${opts.map(o => `<button class="opt">${esc(o)}</button>`).join('')}</div>
      <div class="fb"></div></div></div></div>`;
  const setTab = t => { readTab = t; const r = stage.querySelector('.read'); r.classList.remove('showt', 'showq'); r.classList.add('show' + t);
    $('#tt').classList.toggle('on', t === 't'); $('#tq').classList.toggle('on', t === 'q'); fit(); };
  $('#tt').onclick = () => setTab('t'); $('#tq').onclick = () => setTab('q');
  setTab(cur.i === 0 ? 't' : 'q');
  stage.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.textContent === it.a;
    stage.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.textContent === it.a) x.classList.add('ok'); });
    if (!ok) b.classList.add('no', 'shake');
    award(ok ? 1 : 0);
    fbBar(ok, ok ? '✓ Correct!' : '✗ Not this time', it.say || it.a);
  });
  fit();
}

/* writing self-check with typing */
function qWrite(P, it){
  stage.innerHTML = `<div class="wr pop"><div class="wl">
      <div class="prompt">${esc(it.q)}</div>
      <div><div class="lab">Example sentence starter</div><div class="starter">${esc(it.st)}</div></div>
      <textarea class="ta" id="ta" rows="2" placeholder="Type your sentence here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="paper">✏️ Write your sentences on paper too.</div>
      <div id="exw"></div></div>
    <div class="wrr">
      <button class="rag r" data-v="0" disabled>Not yet</button>
      <button class="rag a" data-v=".5" disabled>Nearly</button>
      <button class="rag g" data-v="1" disabled>I can write it!</button></div></div>`;
  const ta = $('#ta');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; refit(); };
  let shown = false;
  ta.addEventListener('input', () => {
    grow();
    const has = ta.value.trim().split(/\s+/).length >= 3;
    stage.querySelectorAll('.rag').forEach(b => b.disabled = !has);
    if (has && !shown){ shown = true; $('#exw').innerHTML = `<div class="lab">Example</div><div class="ex">✓ ${esc(it.ex)}</div>`; refit(); }
  });
  stage.querySelectorAll('.rag').forEach(b => b.onclick = () => {
    speak(it.ex);
    award(+b.dataset.v);
    setTimeout(next, 500);
  });
  setTimeout(() => ta.focus({preventScroll: true}), 150);
  fit();
}

function partEnd(){
  const P = LEVELS[level][cur.p], s = pstate(cur.p), n = P.items.length;
  s.res = [cur.pts, n]; s.i = null; s.pts = 0; s.when = new Date().toISOString(); save();
  const r = rag(pct(cur.pts, n));
  const nextP = cur.p + 1 < LEVELS[level].length ? cur.p + 1 : null;
  header(true, P.t, `Part ${cur.p + 1} finished`);
  stage.innerHTML = `<div class="res pop">
    <div class="sub">${esc(P.t)}</div>
    <div class="score ${r}">${fmt(cur.pts)} / ${n}</div>
    <span class="rbadge ${r}">${RAGW[r]}</span>
    <div class="btns">${nextP != null ? `<button class="btn" id="np">Next part ▶</button>` : `<button class="btn goldb" id="rs">🏆 My results</button>`}
      <button class="btn ghost" id="ag">Try again</button><button class="btn ghost" id="mn">Menu</button></div></div>`;
  if (nextP != null) $('#np').onclick = () => intro(nextP); else $('#rs').onclick = results;
  $('#ag').onclick = () => { s.i = 0; s.pts = 0; save(); cur = {p: cur.p, i: 0, pts: 0}; show(); };
  $('#mn').onclick = menu;
  fit();
}

function results(){
  const parts = LEVELS[level];
  let tp = 0, tn = 0, done = 0;
  const rows = parts.map((p, i) => {
    const s = pstate(i);
    if (!s.res) return `<div class="rrow"><span>${i + 1}. ${esc(p.t)}</span><span>–</span></div>`;
    done++; tp += s.res[0]; tn += s.res[1];
    const r = rag(pct(s.res[0], s.res[1]));
    return `<div class="rrow ${r}"><span>${i + 1}. ${esc(p.t)}</span><b>${fmt(s.res[0])}/${s.res[1]}</b></div>`;
  }).join('');
  const all = done === parts.length;
  const r = tn ? rag(pct(tp, tn)) : 'r';
  header(true, 'My results', level == 2 ? 'Entry 2' : 'Entry 1');
  const d = new Date();
  stage.innerHTML = `<div class="res pop">
    <div class="score ${r}" style="font-size:calc(var(--k)*clamp(40px,7vh,72px))">${fmt(tp)} / ${tn || '–'}</div>
    <div><span class="rbadge ${r}">${all ? RAGW[r] : `${done} of ${parts.length} parts done`}</span></div>
    <div class="rtable">${rows}</div>
    <div class="stamp">${d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'})} · Show me your result in class!</div>
    <div class="btns"><button class="btn" id="mn">Menu</button></div></div>`;
  $('#mn').onclick = menu;
  fit();
}

/* ---------------------------------------------------------------- BOOT */
const lv = new URLSearchParams(location.search).get('level');
if (lv === '1' || lv === '2') setLevel(+lv); else start();
