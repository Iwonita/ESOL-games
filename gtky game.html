/* ================= ENGINE ================= */
const RATES=[0.45,0.6,0.8];let RATE=1,LEVEL=1,GAME=null,Q=[],qi=0,score=0,total=0,missed=[],STREAK=0,ROUND=0,LOCK=false;
const $=id=>document.getElementById(id);
const st=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fw=s=>s.split(' ')[0], rest=s=>s.split(' ').slice(1).join(' ');

let SPK=0,CT=null;
function gbVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));const sc=v=>(/natural/i.test(v.name)?0:/online|google/i.test(v.name)?1:2);return vs.sort((a,b)=>sc(a)-sc(b))}catch(e){return[]}}
function pickVoice(){const vs=gbVoices();const want=st('gt-voice');let v=vs.find(x=>x.name===want);if(!v){v=navigator.onLine?vs[0]:(vs.find(x=>x.localService)||vs[0])}return v}
function utter(t,done){try{const s=speechSynthesis;if(!t.trim()){done&&done();return}const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=RATES[RATE];const v=pickVoice();if(v)u.voice=v;if(done)u.onend=done;s.speak(u)}catch(e){done&&done()}}
function speak(t){const id=++SPK;clearInterval(CT);try{speechSynthesis.cancel()}catch(e){}
 if(t.includes('___')){const [a,b]=t.split('___');utter(a,()=>{if(id!==SPK)return;let n=7;const g=$('gap');const show=()=>{if(g&&id===SPK&&!g.dataset.done){g.textContent=n>0?n:'?';g.classList.toggle('count',n>0)}};show();
  CT=setInterval(()=>{if(id!==SPK){clearInterval(CT);return}n--;show();if(n<=0){clearInterval(CT);utter(b)}},1000)})}else utter(t)}
const say=(t,l='🔊 Listen')=>`<button class="say" onclick='speak(${JSON.stringify(t).replace(/'/g,"&#39;")})'>${l}</button>`;
function setRate(r){RATE=r;[0,1,2].forEach(i=>$('sp'+i).classList.toggle('on',i===r));st('gt-rate',r);speak('My name is Marek. M. A. R. E. K.')}
function voices(){const vs=gbVoices();const cur=(pickVoice()||{}).name;
 modal(`<h2>🗣️ Choose a British voice</h2>${vs.length?vs.map(v=>`<button class="vbtn ${v.name===cur?'on':''}" onclick='setVoice(${JSON.stringify(v.name).replace(/'/g,"&#39;")})'>${esc(v.name.replace(/Microsoft |Google /,''))}${/natural/i.test(v.name)?' ⭐ natural':''}</button>`).join(''):'<p>No British voices found on this device.</p>'}
 <p class="hint">Voices depend on the device. For the most natural voices on a computer, open the game in <b>Microsoft Edge</b> (⭐ natural).</p>`)}

function setLevel(l){LEVEL=l;[0,1,2].forEach(i=>$('lv'+i).classList.toggle('on',i===l));document.body.className='l'+l;st('gt-level',l);home()}
/* points */

function addPts(n,l){const b=pts(),a=b+n;st('gt-pts-'+LEVEL,a);ROUND+=n;drawPts();const nb=BADGES.find(([x])=>b<x&&a>=x);pop(nb?`New badge ${nb[1]}!`:`+${n}${l?' '+l:''}`)}
function right(){STREAK++;addPts(STREAK>=3?15:10,STREAK>=3?`🔥${STREAK}`:'');score++}
function wrong(t){STREAK=0;missed.push(t)}

 $('lvname').textContent=LVNAME[LEVEL];

 $('menu').innerHTML=gamesFor(LEVEL).map(([id,ic,t])=>{const b=st(`gt-best-${id}-${LEVEL}`);return `<button class="gbtn" onclick="start('${id}')"><span class="gic">${ic}</span><span class="gt">${t}</span>${b&&id!=='learn'?`<span class="gb">⭐ ${b}</span>`:''}</button>`}).join('')}
/* ================= QUESTION BUILDERS ================= */
function mc(prompt,ans,opts,extra={}){const n=extra.n||4;const o=[...new Set(opts.filter(x=>x!==ans))].slice(0,n-1);return Object.assign({type:'mc',prompt,ans,opts:shuffle([ans,...o])},extra)}
const emo=e=>`<div class="emo">${e}</div>`;
const big=t=>`<div class="bigt">${esc(t)}</div>`;
function learnSet(){return VOC[LEVEL].map(([w,e,m])=>({e,w,lines:[m]}))}
function whatSet(){const L=LEVEL,n=L===0?3:4,V=VOC[L];return shuffle(V).slice(0,10).map(([w,e,m])=>{const ds=pick(V.filter(v=>v[0]!==w),n-1).map(v=>v[0]);
 return L===2?mc('Which word is it?',w,ds,{n,vis:emo(e)+`<div class="q">${esc(m)}</div>`,say:w+'. '+m}):mc('What is it?',w,ds,{n,vis:emo(e)+(L===1?`<div class="hint">${esc(m)}</div>`:''),say:w})})}
/* alphabet */
const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const SHAPE=[['b','d','p','q'],['m','n','w','u'],['a','e','o'],['i','j','l'],['g','j','q','y'],['c','e','o'],['h','n','k'],['f','t'],['v','w','y'],['s','z','x'],['r','n'],['k','x']];
const SOUND=[['A','E','I','H'],['G','J','Z'],['B','P','V','D'],['M','N'],['K','Q','C'],['U','W','Y','Q'],['S','X','F'],['E','I','Y'],['T','D','P'],['O','U'],['R','A']];
const near=(x,groups,n)=>{const g=groups.find(g=>g.includes(x))||[];let c=g.filter(y=>y!==x);const pool=(groups===SOUND?AZ:AZ.map(a=>a.toLowerCase())).filter(y=>y!==x&&!c.includes(y));return shuffle(c).concat(shuffle(pool)).slice(0,n)};
const sayL=l=>l.toUpperCase()+'.';
function abcSet(){const L=LEVEL,Q=[];
 const lisN=L===0?3:4;
 const listen=k=>{for(let i=0;i<k;i++){const x=rnd(L===0?AZ:SOUND.flat());Q.push(mc('Listen. Which letter is it?',x,near(x,SOUND,lisN-1),{n:lisN,vis:emo('👂')+say(sayL(x),'🔊 Listen again'),say:sayL(x),auto:sayL(x),big:true}))}};
 const small=k=>{for(let i=0;i<k;i++){const g=rnd(SHAPE),x=rnd(g);Q.push(mc('Find the small letter.',x,near(x,SHAPE,L===0?2:3),{n:L===0?3:4,vis:big(x.toUpperCase()),say:sayL(x),big:true}))}};
 const capital=k=>{for(let i=0;i<k;i++){const g=rnd(SHAPE),x=rnd(g);Q.push(mc('Find the capital letter.',x.toUpperCase(),near(x,SHAPE,L===0?2:3).map(y=>y.toUpperCase()),{n:L===0?3:4,vis:big(x),say:sayL(x),big:true}))}};
 const nextL=k=>{for(let i=0;i<k;i++){const j=1+Math.floor(Math.random()*22);const ans=AZ[j+2];Q.push(mc('What comes next?',ans,[AZ[j+3],AZ[j+1],AZ[(j+5)%26],AZ[(j+8)%26]],{vis:big(AZ.slice(j-1,j+2).join('  ')+'  ?'),say:ans,big:true}))}};
 const before=k=>{for(let i=0;i<k;i++){const j=2+Math.floor(Math.random()*22);Q.push(mc(`What letter comes before ${AZ[j]}?`,AZ[j-1],[AZ[j+1],AZ[j-2],AZ[(j+4)%26]],{vis:big('?  '+AZ[j]),say:AZ[j-1],big:true}))}};
 const first=k=>{const W=['bakery','nephew','knit','relaxing','single','shift','hobbies','college','occupation','email','because','address','status','country'];
  for(let i=0;i<k;i++){const s=pick(W,4);const a=[...s].sort()[0];Q.push(mc('Which word comes first in a dictionary (A–Z)?',a,s,{vis:emo('📖'),say:a}))}};
 if(L===0){small(4);capital(3);listen(3)}else if(L===1){listen(4);nextL(3);small(3)}else{first(4);listen(3);before(3)}
 return shuffle(Q)}
function spellSet(){return shuffle(SPELLW[LEVEL]).slice(0,8).map(w=>{const v=VOC[LEVEL].find(x=>x[0].toLowerCase()===w);return {type:'build',spell:true,text:w,vis:v?emo(v[1]):''}})}
function spellOut(s){return s.split('').map(c=>c===' '?'… space …':c==='.'?'dot':c==='@'?'at':/\d/.test(c)?c:c.toUpperCase()+'.').join(' ')}
function phoneSet(){const L=LEVEL,n=L===0?3:4;return shuffle(LISTEN[L]).map(([a,o])=>mc('Listen to the spelling. Choose the word.',a,o,{n,vis:emo('📞')+say(spellOut(a),'🔊 Listen again'),auto:spellOut(a),say:a,mono:true}))}
function possSet(){const L=LEVEL;return shuffle(POSS[L]).map(([p,a,w])=>mc(p,a,PCHOICE[L],{n:PCHOICE[L].length,vis:`<div class="whoc"><span>${WHO[w]}</span><b>${w==='I'?'I → my':w==='you'?'you → your':w==='he'?'he → his':w==='she'?'she → her':w==='we'?'we → our':'they → their'}</b></div>`,gap:true,capfirst:p.startsWith('___')}))}
function buildSet(){return shuffle(BUILD[LEVEL]).map(s=>({type:'build',text:s}))}
function letterHTML(hl){const s=k=>`class="lp ${hl===k?'hl':''}"`;
 return `<div class="gletter"><div class="lad"><span ${s('address')}>Flat 3<br>15 Willow Street<br>Leeds</span><br><span ${s('postcode')}>LS4 2XT</span><br><br><span ${s('date')}>12/5/24</span></div>
 <div><span ${s('greeting')}>Dear Class</span></div><div ${s('body')}>Hello! How are you? My name is Grace Owusu and I am <span ${s('age')}>29</span> years old. I am from Leeds, England. I live on Willow Street. I am a cleaner. Please write to me and tell me all about yourselves.</div>
 <div><span ${s('closing')}>Kind regards</span><br><span ${s('name')}>Grace</span></div></div>`}
function extraSet(){const L=LEVEL;
 if(L===0){const W=['NAME','ADDRESS','AGE','EMAIL','POSTCODE','FOOD','DRINK','LIVE','CHILDREN','SOUP'];
  const swap={a:'e',e:'a',o:'a',m:'n',n:'m',d:'b',b:'d',p:'q',i:'l',l:'i',s:'z',c:'e',r:'n',k:'h',u:'v',f:'t',v:'w',t:'f'};
  const bad=w=>{const i=Math.floor(Math.random()*w.length);const c=w[i];return w.slice(0,i)+(swap[c]||'o')+w.slice(i+1)};
  return shuffle(W).map((W1,k)=>{const lo=W1.toLowerCase();let ds=[];while(ds.length<2){const b=bad(lo);if(b!==lo&&!ds.includes(b))ds.push(b)}
   return k%2?mc('Write it in small letters. Which is right?',lo,ds,{n:3,vis:big(W1),say:lo,big:true}):mc('Write it in CAPITAL letters. Which is right?',W1,ds.map(x=>x.toUpperCase()),{n:3,vis:big(lo),say:lo,big:true})})}
 if(L===1){const parts=['address','postcode','date','greeting','closing','name'];
  return shuffle(LETTERQ.map(([p,q])=>mc(q,p,parts,{n:4,vis:letterHTML(p),say:p,letter:true})).concat(LETTERF.map(([q,a,o,hl])=>mc(q,a,o,{n:4,vis:letterHTML(hl),gap:true,letter:true})))).slice(0,10)}
 return shuffle(CONN).map(([p,a,o])=>mc(p,a,o,{n:o.length+1,gap:true,vis:`<div class="conn"><span><b>and</b> adds</span><span><b>but</b> contrast</span><span><b>because</b> reason</span><span><b>so</b> result</span></div>`}))}

/* ================= PLAY ================= */
function start(id){GAME=id;qi=0;score=0;total=0;missed=[];STREAK=0;ROUND=0;show('play');$('gtitle').textContent=gamesFor(LEVEL).find(g=>g[0]===id)[2];
 Q=({learn:learnSet,what:whatSet,abc:abcSet,spell:spellSet,phone:phoneSet,poss:possSet,build:buildSet,extra:extraSet})[id]();render()}
function prog(){$('bar').style.width=(Q.length?qi/Q.length*100:0)+'%';$('cnt').textContent=`${Math.min(qi+1,Q.length)}/${Q.length}`}
const stage=h=>$('stage').innerHTML=h;
function render(){LOCK=false;document.body.classList.remove('fbon');if(qi>=Q.length)return GAME==='learn'?home():end();prog();$('fb').className='fb';
 if(GAME==='learn')return rLearn();const q=Q[qi];({mc:rMC,build:rBuild})[q.type](q)}
function next(){qi++;render()}
function fb(ok,ans,sayt,extra=''){const f=$('fb');document.body.classList.add('fbon');f.className='fb show '+(ok?'ok':'no');
 f.innerHTML=`<div class="fbt"><b>${ok?'✅ Well done!':'❌ The answer is: '+esc(ans)}</b>${extra?'<span>'+extra+'</span>':''}</div><button class="nx" onclick="next()">Next ▶</button>`;if(sayt)speak(sayt)}
function opts(list,onpick){const long=list.some(o=>o.length>16);return `<div class="opts n${list.length} ${long?'long':''}">${list.map(o=>`<button class="opt" data-v="${esc(o)}" onclick="${onpick}(this)"><span class="t ${long?'sent':''}">${esc(o)}</span></button>`).join('')}</div>`}
function mark(ans,btn){document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===ans)b.classList.add('right')});if(btn&&btn.dataset.v!==ans)btn.classList.add('wrong')}
function rLearn(){const v=Q[qi];stage(`<div class="card learn">${emo(v.e)}<div class="word">${esc(v.w)}</div><div class="mean">${v.lines.map(esc).join('<br>')}</div>${say(v.w+'. '+v.lines.join(' '))}</div>
 <div class="row"><button class="nav" onclick="qi=Math.max(0,qi-1);render()" ${qi?'':'disabled'}>◀</button><button class="nav main" onclick="next()">${qi<Q.length-1?'Next ▶':'Finish ✓'}</button></div>`);speak(v.w+'. '+v.lines.join(' '))}
const capA=(q,a)=>q.prompt.startsWith('___')?a.charAt(0).toUpperCase()+a.slice(1):a;
function rMC(q){const p=esc(q.prompt).replace('___','<span class="gap" id="gap">?</span>');
 const top=`<div class="card ${q.letter?'lcard':''}">${q.vis?`<div class="vis">${q.vis}</div>`:''}<div class="q ${q.gap?'big':''}">${p}</div>${q.gap?say(q.prompt):''}</div>`;
 const long=q.opts.some(o=>o.length>16);
 stage(top+`<div class="opts n${q.opts.length} ${long?'long':''} ${q.big?'bigo':''} ${q.mono?'mono':''}">${q.opts.map(o=>`<button class="opt" data-v="${esc(o)}" onclick="pMC(this)"><span class="t ${long?'sent':''}">${esc(o)}</span></button>`).join('')}</div>`);
 if(q.auto)setTimeout(()=>speak(q.auto),300)}
function pMC(b){if(LOCK)return;LOCK=true;SPK++;const q=Q[qi];total++;const ok=b.dataset.v===q.ans;mark(q.ans,b);const g=$('gap');const A=capA(q,q.ans);if(g){g.dataset.done=1;g.classList.remove('count');g.textContent=A}
 const full=q.prompt.includes('___')?q.prompt.replace('___',A):(q.say||q.ans);
 ok?right():wrong(q.prompt.includes('___')?full:`${q.prompt} → ${q.ans}`);fb(ok,q.ans,full)}
let placed=[],pool=[];
function rBuild(){const it=Q[qi];const w=it.spell?it.text.split(''):it.text.split(' ');placed=[];pool=shuffle(w.map((x,i)=>({x,i})));if(pool.length>1&&pool.map(p=>p.x).join('')===w.join(''))pool.reverse();dBuild()}
function dBuild(){const it=Q[qi],sp=it.spell;stage(`<div class="card ${it.vis?'':'slim'}">${it.vis?`<div class="vis">${it.vis}</div>`:''}<div class="q">${sp?'Spell the word.':'Put the words in order.'}</div>${sp?'':'<div class="hint">Start with a capital letter. End with a full stop or question mark.</div>'}${say(it.text,'🔊 Hint')}</div>
 <div class="slot">${placed.map((p,k)=>`<button class="tile on ${sp?'letter':''}" onclick="unp(${k})">${esc(p.x)}</button>`).join('')||`<span class="hint">Tap the ${sp?'letters':'words'} below</span>`}</div>
 <div class="tiles">${pool.map((p,k)=>`<button class="tile ${sp?'letter':''}" onclick="plc(${k})">${esc(p.x)}</button>`).join('')}</div>
 <div class="row"><button class="nav" onclick="rBuild()">↺ Start again</button><button class="nav main" onclick="cBuild()" ${pool.length?'disabled':''}>Check</button></div>`)}
function plc(k){placed.push(pool.splice(k,1)[0]);dBuild()}function unp(k){pool.push(placed.splice(k,1)[0]);dBuild()}
function cBuild(){if(LOCK)return;LOCK=true;const it=Q[qi],s=it.text,got=placed.map(p=>p.x).join(it.spell?'':' ');total++;const ok=got===s;ok?right():wrong(s);document.querySelectorAll('.tile,.nav').forEach(b=>b.disabled=true);fb(ok,s,it.spell?s+'. '+spellOut(s):s)}

/* order */
let OSHOW=[],OPICK=[];
function rOrder(q){OSHOW=shuffle(q.seq.map((x,i)=>i));if(OSHOW.every((v,i)=>v===i))OSHOW.reverse();OPICK=[];dOrder()}
function dOrder(){const q=Q[qi];const n=k=>{const p=OPICK.indexOf(k);return p<0?'':`<span class="num">${p+1}</span>`};
 const head=`<div class="card slim"><div class="q">${q.pics?'Tap the pictures in order: 1, 2, 3, 4.':'Tap the sentences in order.'}</div>${q.pics?'':`<div class="hint">Look for the clue words: first, then, after that, in the end.</div>`}</div>`;
 const body=q.pics?`<div class="popts p4">${OSHOW.map(k=>`<button class="popt" data-k="${k}" onclick="tOrd(${k})">${n(k)}${img(q.seq[k],'op')}<span class="lbl on">I ${esc(IT[q.seq[k]].b)}.</span></button>`).join('')}</div>`
  :`<div class="olist">${OSHOW.map(k=>`<button class="oit ${OPICK.includes(k)?'picked':''}" data-k="${k}" onclick="tOrd(${k})">${n(k)}<span class="t">${esc(q.seq[k])}</span></button>`).join('')}</div>`;
 stage(head+body+`<div class="row"><button class="nav" onclick="OPICK=[];dOrder()">↺ Start again</button><button class="nav main" onclick="cOrder()" ${OPICK.length<q.seq.length?'disabled':''}>Check</button></div>`)}
function tOrd(k){if(LOCK)return;const p=OPICK.indexOf(k);if(p<0)OPICK.push(k);else OPICK.splice(p,1);dOrder()}
function cOrder(){if(LOCK)return;LOCK=true;const q=Q[qi];total++;const ok=OPICK.every((k,i)=>k===i);
 document.querySelectorAll('[data-k]').forEach(b=>{b.disabled=true;const k=+b.dataset.k;b.classList.add(OPICK.indexOf(k)===k?'right':'wrong');const s=b.querySelector('.num');if(s)s.textContent=k+1});
 document.querySelectorAll('.row .nav').forEach(b=>b.disabled=true);
 const txt=q.pics?q.seq.map(id=>'I '+IT[id].b+'.').join(' '):q.seq.join(' ');ok?right():wrong(q.pics?q.seq.map(id=>IT[id].b).join(' → '):q.seq[0]+' …');
 fb(ok,'Look at the numbers now.',txt)}
/* end */
function end(){const pct=total?score/total:0,s=pct>=.9?3:pct>=.7?2:1;const k=`gt-best-${GAME}-${LEVEL}`;const prev=parseInt(st(k)||'0');if(score>=prev)st(k,`${score}/${total}`);
 $('bar').style.width='100%';$('cnt').textContent='';$('fb').className='fb';
 stage(`<div class="card end"><div class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><div class="big">${score} / ${total}</div><div>⭐ +${ROUND} points</div>
 ${missed.length?`<div class="miss"><b>Check again:</b><br>${missed.slice(0,4).map(esc).join('<br>')}</div>`:'<div>Excellent! No mistakes.</div>'}</div>
 <div class="row"><button class="nav" onclick="start('${GAME}')">Play again</button><button class="nav main" onclick="home()">All games</button></div>`)}
/* ================= SCORES + TEACHERS ================= */
function modal(h){$('mbody').innerHTML=h;$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide')}
const teachers=()=>[1,2].map(k=>({e:st('gt-t'+k),n:st('gt-tn'+k)||('Teacher '+k)})).filter(x=>x.e);
function learner(){const rows=gamesFor(LEVEL).filter(g=>g[0]!=='learn').map(([id,ic,t])=>`<tr><td>${ic} ${t}</td><td>${st(`gt-best-${id}-${LEVEL}`)||'–'}</td></tr>`).join('');const T=teachers();
 modal(`<h2>📧 My scores – ${LVNAME[LEVEL]}</h2><table class="sc">${rows}<tr><td><b>Total points</b></td><td><b>⭐ ${pts()}</b></td></tr></table>
 <input id="rn" placeholder="Your name" value="${esc(st('gt-name')||'')}">
 ${T.length?`<div class="row">${T.map(t=>`<button class="nav main" onclick='mailTo(${JSON.stringify(t.e).replace(/'/g,"&#39;")})'>📧 Send to ${esc(t.n)}</button>`).join('')}</div>`:'<p class="hint">Ask your teacher for the QR code to send scores to them.</p>'}
 <input id="rm" type="email" placeholder="My email address" value="${esc(st('gt-mail')||'')}">
 <div class="row"><button class="nav" onclick="mailMe()">📧 Send to me</button><button class="nav" onclick="copyS()">📋 Copy</button></div><p id="mm" class="hint"></p>`)}
function sText(){return `Getting to Know You game\nName: ${$('rn').value}\nLevel: ${LVNAME[LEVEL]}\nDate: ${new Date().toLocaleDateString('en-GB')}\n\n`+gamesFor(LEVEL).filter(g=>g[0]!=='learn').map(([id,ic,t])=>`${t}: ${st(`gt-best-${id}-${LEVEL}`)||'not played'}`).join('\n')+`\n\nTotal points: ${pts()}`}
function mailTo(e){const n=$('rn').value.trim();if(!n){$('mm').textContent='Please write your name.';return}st('gt-name',n);
 location.href=`mailto:${encodeURIComponent(e)}?subject=${encodeURIComponent('GTKY game – '+n)}&body=${encodeURIComponent(sText())}`;$('mm').textContent='Your email app opens now. Press Send.'}
function mailMe(){const m=$('rm').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$('mm').textContent='Please check the email address.';return}st('gt-mail',m);mailTo(m)}
function copyS(){try{navigator.clipboard.writeText(sText()).then(()=>$('mm').textContent='Copied!')}catch(e){}}
function teacher(){const here=/^https?:/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)?location.origin+location.pathname:'https://iwonita.github.io/ESOL-games/gtky-game.html';
 const row=k=>`<div class="row"><input id="n${k}" style="flex:1" placeholder="Name" value="${esc(st('gt-tn'+k)||(k===1?'Teacher Iwona':'Teacher Anna'))}"><input id="e${k}" style="flex:2" type="email" placeholder="email" value="${esc(st('gt-t'+k)||'')}"></div>`;
 modal(`<h2>👩‍🏫 Teacher</h2><p class="hint" style="text-align:left">Web address of this game:</p><input id="qu" value="${esc(here)}" placeholder="https://...">
 <p class="hint" style="text-align:left">Teachers who receive learners' scores (optional):</p>${row(1)}${row(2)}
 <div class="row"><button class="nav main" onclick="mkQR()">Make QR codes</button><button class="nav" onclick="window.print()">🖨️ Print</button></div><p id="qm" class="hint"></p><div id="qrs" class="qrs"></div>
 <p class="hint">Each QR code opens one level (the level switch is hidden). Points on this device – Emerging: ${st('gt-pts-0')||0} · Entry 1: ${st('gt-pts-1')||0} · Entry 2: ${st('gt-pts-2')||0}</p><button class="nav" onclick="if(confirm('Reset all scores on this device?')){Object.keys(localStorage).filter(k=>/^gt-(pts|best)/.test(k)).forEach(k=>localStorage.removeItem(k));closeM();home()}">Reset scores</button>`)}
function mkQR(){const u=$('qu').value.trim().split('?')[0];if(!/^https?:\/\//.test(u)){$('qm').textContent='Please paste an address that starts with https://';return}
 let tq='';for(const k of [1,2]){const e=$('e'+k).value.trim(),n=$('n'+k).value.trim();if(e){st('gt-t'+k,e);st('gt-tn'+k,n);tq+=`&t${k}=${encodeURIComponent(e)}&n${k}=${encodeURIComponent(n)}`}}
 const go=()=>{$('qrs').innerHTML=[0,1,2].map(l=>`<div class="qb"><b>${LVNAME[l]}</b><div id="qr${l}"></div><small>Getting to Know You</small></div>`).join('');[0,1,2].forEach(l=>new QRCode($('qr'+l),{text:`${u}?level=${l}${tq}`,width:170,height:170}))};
 if(window.QRCode)return go();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=go;s.onerror=()=>$('qm').textContent='Connect to the internet to make QR codes.';document.head.appendChild(s)}
/* init */
{const r=st('gt-rate');if(r!==null&&RATES[+r]!==undefined)RATE=+r;[0,1,2].forEach(i=>$('sp'+i).classList.toggle('on',i===RATE));
 const P=new URLSearchParams(location.search);for(const k of[1,2]){const e=P.get('t'+k);if(e){st('gt-t'+k,e);st('gt-tn'+k,P.get('n'+k)||('Teacher '+k))}}
 const q=P.get('level');if(['0','1','2'].includes(q)){LEVEL=+q;$('lvsw').classList.add('hide')}else{const s=st('gt-level');if(['0','1','2'].includes(s))LEVEL=+s}
 [0,1,2].forEach(i=>$('lv'+i).classList.toggle('on',i===LEVEL));document.body.className='l'+LEVEL;home();try{speechSynthesis.getVoices()}catch(e){}}
</script></body></html>
