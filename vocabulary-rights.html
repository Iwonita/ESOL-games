<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rights – Vocabulary – Game</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#e8eef8;--ink:#1f1b2e;--muted:#4a4560;--g:#2e9e3e;--gs:#e2f4dd;--can:#2f8a2f;--cans:#e2f2dc;--sh:#5b3fa8;--shs:#ece6f8;--lv:#2e7d32;--ps:#f3f6fb;--w:#c0561c;--ws:#fbe2d2;--navy:#012169;--red:#c8102e;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:clamp(15px,2.3vh,22px);display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.l1{--lv:#2e7d32}body.l2{--lv:#1f5fa8}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--lv);outline-offset:2px}
.hide{display:none!important}
.flag{display:inline-block;aspect-ratio:2/1;border-radius:4px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2060%2030%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15h30v15zv15h-30zh-30v-15zv-15h30z%22/%3E%3C/clipPath%3E%3Cpath%20d%3D%22M0%2C0v30h60v-30z%22%20fill%3D%22%23012169%22/%3E%3Cpath%20d%3D%22M0%2C0L60%2C30M60%2C0L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22/%3E%3Cpath%20d%3D%22M0%2C0L60%2C30M60%2C0L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22/%3E%3Cpath%20d%3D%22M30%2C0v30M0%2C15h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22/%3E%3Cpath%20d%3D%22M30%2C0v30M0%2C15h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22/%3E%3C/svg%3E");background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);flex:none}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;flex:none;background:var(--navy);color:#fff;border-bottom:5px solid var(--red)}
header .flag{height:1.6em}
.brand{font-weight:700;font-size:1.2em;margin-right:auto;display:flex;align-items:center;gap:10px}
.pill{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:3px 12px;font-weight:700}
.sw{display:flex;border:2px solid #fff;border-radius:12px;overflow:hidden;background:#fff;color:var(--ink)}
.sw button{border:0;background:none;padding:4px 10px;font-weight:700;font-size:.9em}
.sw button.on{background:var(--ink);color:#fff}
#lvsw button.on{background:var(--lv)}
.vb{border:2px solid #fff;background:#fff;color:var(--ink);border-radius:12px;padding:4px 10px;font-weight:700;font-size:.9em}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 10px;width:100%}
#home{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.hero{display:flex;align-items:stretch;gap:10px;flex:none;height:clamp(90px,22vh,210px)}
.hero .flag{height:100%;border-radius:10px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.hero .cs{flex:1;display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden;border:3px solid var(--ink)}
.hero .cs div{display:flex;flex-direction:column;justify-content:center;padding:6px 16px;color:#fff}
.hero .c{background:var(--can)}.hero .s{background:var(--sh)}
.hero strong{font-size:clamp(24px,min(7vh,8vw),72px);line-height:1}
.hero span{font-size:clamp(13px,min(2.6vh,3.6vw),26px);font-weight:700}
#menu{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:10px}
@media (max-width:700px){#menu{grid-template-columns:repeat(2,1fr)}.hero{height:auto;flex-direction:column}.hero .flag{height:14vh;width:auto;aspect-ratio:2/1;align-self:center}.opts.long{grid-template-columns:1fr}.hero .cs div{padding:6px 10px}}
.gbtn{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;min-height:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.gbtn:hover{background:var(--ps)}
.gic{font-size:40cqmin;line-height:1}
.gt{font-weight:700;text-align:center;line-height:1.1;font-size:min(15cqh,13cqw)}
.gb{font-size:.8em;color:var(--muted)}
.bottom{display:flex;gap:10px;flex:none}
.bottom button{flex:1;border:3px solid var(--ink);background:#fff;border-radius:16px;padding:10px;font-weight:700;font-size:clamp(16px,2.8vh,28px)}
#play{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;flex:none}
.back{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:4px 12px;font-weight:700}
#gtitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.1em}
.prog{flex:1;height:12px;background:rgba(255,255,255,.8);border-radius:6px;overflow:hidden;min-width:60px;border:2px solid var(--ink)}
#bar{display:block;height:100%;background:var(--lv);transition:width .3s}
#cnt{font-weight:700}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1.4;min-height:0}
.card.slim{flex:0 0 auto;padding:12px 16px}
.pics{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;width:100%}
.pics>img{min-width:0;max-width:100%;height:100%;max-height:100%;object-fit:contain}
.who{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(16px,3vh,30px);flex:none}
.who img{height:clamp(56px,13vh,140px);width:clamp(56px,13vh,140px);object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--ink);background:#fff}
.q{font-weight:700;font-size:clamp(18px,min(4.4vh,5.6vw),46px);text-align:center;line-height:1.25}
.q.big{font-size:clamp(22px,min(5.4vh,6.5vw),56px)}
.hint{font-weight:700;color:var(--muted);font-size:clamp(15px,2.8vh,28px);text-align:center}
.say{border:0;background:var(--g);color:#fff;border-radius:99px;padding:.25em .9em;font-weight:700;font-size:clamp(17px,3.2vh,30px);vertical-align:middle;box-shadow:0 4px 0 #1d6b28}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 #1d6b28}
.gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--muted);text-align:center;color:var(--g)}.gap.count{color:var(--muted)}
.gap.can{color:var(--can)}.gap.should{color:var(--sh)}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;max-height:30vh}
.opts.n4{max-height:none}
.opt{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:4px 10px;font-weight:700;min-height:0;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.opt .t{display:block;font-size:min(46cqh,22cqw);line-height:1.05}.opt .t.m{font-size:min(42cqh,14cqw)}.opt .t.l{font-size:min(36cqh,8.6cqw)}
.opt.can{background:var(--can);border-color:var(--can);color:#fff}.opt.should{background:var(--sh);border-color:var(--sh);color:#fff}
.opt.can:hover:not(:disabled){background:#267326}.opt.should:hover:not(:disabled){background:#4a3290}
.opt:hover:not(:disabled){background:var(--ps)}
.opt:disabled{opacity:.45}
.opt.right{opacity:1;box-shadow:0 0 0 6px var(--g),0 5px 0 rgba(0,0,0,.18)}
.opt.wrong{opacity:1;background:var(--w)!important;border-color:var(--w)!important;color:#fff!important}
.fb{display:none}
.fb.show{display:flex;position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0));align-items:center;gap:14px;z-index:5;border-top:3px solid var(--ink);font-size:clamp(16px,2.8vh,26px)}
.fb.ok{background:var(--gs)}.fb.no{background:var(--ws)}
.fbt{flex:1;display:flex;flex-direction:column;gap:2px}
.nx,.nav{border:3px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:10px 22px;font-weight:700;font-size:clamp(17px,3vh,28px)}
.nav{background:#fff;color:var(--ink)}.nav.main{background:var(--ink);color:#fff}
.nav:disabled{opacity:.4}
.row{display:flex;gap:10px;justify-content:center;flex:none;flex-wrap:wrap}
.text{font-size:clamp(16px,min(3.2vh,4.4vw),30px);line-height:1.45;max-width:60em;overflow:auto;min-height:0}
.people{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pbtn{container-type:size;border:3px solid var(--ink);background:#fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;min-height:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pbtn:hover{background:var(--ps)}
.pbtn img{height:62cqh;max-width:90cqw;object-fit:contain;border-radius:16px}
.pbtn b{font-size:min(12cqh,14cqw)}.pbtn small{color:var(--muted);font-weight:700}
.slot{min-height:9vh;border:3px dashed var(--ink);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#fff;flex:none}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;flex:1;min-height:0}
.tile{border:3px solid var(--lv);background:#fff;border-radius:14px;padding:.35em .7em;font-weight:700;font-size:clamp(16px,min(4.2vh,5vw),44px)}.tile.on{border-color:var(--g);background:var(--gs)}
.model{background:var(--ps);border:3px dashed var(--lv);border-radius:16px;padding:8px 16px;font-weight:700;text-align:center;font-size:clamp(18px,min(4vh,5vw),40px)}
.end .stars{font-size:clamp(40px,9vh,90px);letter-spacing:6px}.end .big{font-size:clamp(28px,6vh,60px);font-weight:700}.miss{font-size:clamp(15px,2.6vh,24px);color:var(--muted);text-align:center}
.pop{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);color:var(--ink);font-weight:700;font-size:1.4em;padding:6px 18px;border-radius:99px;animation:pp 1.2s forwards;z-index:9;pointer-events:none}
@keyframes pp{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:2s}#bar{transition:none}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px;position:relative;border:3px solid var(--ink)}
.mbox h2{margin:0 0 10px;padding-right:1.5em}.mbox input{width:100%;font:inherit;padding:10px;margin:6px 0;border:2px solid var(--ink);border-radius:10px}
.mbox .row input{width:auto}
.mx{position:absolute;right:10px;top:8px;border:0;background:none;font-size:1.6em}
.vbtn{display:block;width:100%;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:10px;margin:6px 0;font-weight:700}.vbtn.on{background:var(--gs);border-color:var(--g)}
.sc{width:100%;border-collapse:collapse;margin-bottom:8px}.sc td{border-bottom:1px solid #ddd;padding:6px}
.qrs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.qb{text-align:center;border:2px solid var(--ink);border-radius:12px;padding:10px}
@media (max-width:700px){.opts{max-height:none}.people{grid-template-columns:1fr;}.pbtn{flex-direction:row}.pbtn img{height:80cqh}.pbtn b{font-size:min(30cqh,12cqw)}}
@media (max-width:700px){.gbtn .gt{font-size:min(18cqh,15cqw)}.gbtn .gic{font-size:36cqmin}}
@media print{header,.bottom,#home,#play,.row,input,.hint,.mx,.mbox p{display:none!important}#modal{position:static;background:none}.mbox{max-height:none;border:0}}

.hero .vt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;background:var(--navy);color:#fff;border-radius:18px;border:3px solid var(--ink);padding:8px 20px;border-bottom:8px solid var(--red)}
.hero .vt strong{font-size:clamp(22px,min(5.5vh,6vw),56px)}.hero .vt span{font-size:clamp(14px,min(2.8vh,3.6vw),28px);font-weight:400}
.learn .word{font-size:clamp(34px,min(9vh,11vw),100px);font-weight:700;text-align:center;line-height:1.05}
.learn .mean{color:var(--muted);font-size:clamp(18px,min(4vh,5.5vw),42px);text-align:center;font-weight:700}
.emo{font-size:min(20vh,30vw);line-height:1}
.popts{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px}
@media (max-width:700px){.popts{grid-template-columns:1fr 1fr}}
.popt{container-type:size;position:relative;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.popt:hover:not(:disabled){background:var(--ps)}
.popt img.op{flex:1;min-height:0;max-width:100%;object-fit:contain}.popt .emo{font-size:50cqmin}
.popt .lbl{font-weight:700;display:none;text-align:center;line-height:1.1;font-size:min(12cqh,10cqw)}.popt.show .lbl{display:block}
.popt.right{background:var(--gs);box-shadow:0 0 0 6px var(--g)}.popt.wrong{background:var(--ws)}
.opt.notf{background:var(--red);border-color:var(--red);color:#fff}.opt.notf:hover:not(:disabled){background:#a50d26}
.opt{display:flex;align-items:center;justify-content:center;gap:4%}.opt .fi{height:60cqh;flex:none}
.tile.letter{min-width:1.6em;font-size:clamp(22px,min(6vh,8vw),60px);padding:.15em .4em}
.card .pics{max-height:100%}
#menu{grid-template-columns:repeat(4,1fr)}
.tiles{flex:0 1 auto;min-height:18%}
@media (max-width:700px){#menu{grid-template-columns:1fr 1fr}.gbtn{flex-direction:row;gap:8px}.gbtn .gic{font-size:50cqh}.gbtn .gt{font-size:min(26cqh,10cqw)!important;text-align:left}.hero .flag{height:9vh}.opts{flex:1.4}.opts.n4.long{grid-template-columns:1fr}
 .opt.can,.opt.notf{flex-direction:column}.opt .fi{height:40cqh}.opt.can .t,.opt.notf .t{font-size:min(30cqh,16cqw)}}
</style></head>

const RATES=[0.45,0.6,0.8];let RATE=1,LEVEL=1,GAME=null,Q=[],qi=0,score=0,total=0,missed=[],STREAK=0,ROUND=0,LOCK=false;

let SPK=0,CT=null;
function gbVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));const sc=v=>(/natural/i.test(v.name)?0:/online|google/i.test(v.name)?1:2);return vs.sort((a,b)=>sc(a)-sc(b))}catch(e){return[]}}
function pickVoice(){const vs=gbVoices();const want=st('vg-voice');let v=vs.find(x=>x.name===want);if(!v){v=navigator.onLine?vs[0]:(vs.find(x=>x.localService)||vs[0])}return v}
function utter(t,done){try{const s=speechSynthesis;if(!t.trim()){done&&done();return}const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=RATES[RATE];const v=pickVoice();if(v)u.voice=v;if(done)u.onend=done;s.speak(u)}catch(e){done&&done()}}
function speak(t){const id=++SPK;clearInterval(CT);try{speechSynthesis.cancel()}catch(e){}
 if(t.includes('___')){const [a,b]=t.split('___');utter(a,()=>{if(id!==SPK)return;let n=5;const g=$('gap');const show=()=>{if(g&&id===SPK&&!g.dataset.done){g.textContent=n>0?n:'?';g.classList.toggle('count',n>0)}};show();
  CT=setInterval(()=>{if(id!==SPK){clearInterval(CT);return}n--;show();if(n<=0){clearInterval(CT);utter(b)}},1000)})}else utter(t)}

function start(id){GAME=id;qi=0;score=0;total=0;missed=[];STREAK=0;ROUND=0;show('play');$('gtitle').textContent=GAMES.find(g=>g[0]===id)[2];fbOff();

 if(id==='find')Q=shuffle(vs).slice(0,LEVEL===1?12:16).map(v=>({type:'find',v,opts:shuffle([v,...shuffle(vs.filter(x=>x.id!==v.id)).slice(0,3)])}));
 if(id==='spell')Q=shuffle(SPELL[LEVEL]).map(([p,w])=>({type:'tiles',spell:true,pic:p,text:w}));
 if(id==='gap')Q=shuffle(GAPS[LEVEL]).slice(0,12).map(g=>({type:'mc',pic:g.p,prompt:g.s,ans:g.a,opts:shuffle(g.o),gap:true}));
 if(id==='build')Q=shuffle(BUILD[LEVEL]).map(([p,s])=>({type:'tiles',pic:p,text:s}));
 if(id==='fair')Q=shuffle(FAIRS).slice(0,LEVEL===1?10:12).map(f=>({type:'mc',pic:f.p,prompt:f.t,ans:f.k,opts:['FAIR','NOT FAIR'],extra:f.why,say:(f.k==='FAIR'?'It is fair. ':'It is not fair. ')+f.why,fair:true}));
 render()}

function rMC(q){const p=esc(q.prompt).replace('___','<span class="gap" id="gap">?</span>');const long=q.opts.some(o=>o.length>14);
 stage(`<div class="card"><div class="pics">${picHTML(q.pic)}</div><div class="q ${q.prompt.length<40?'big':''}">${p}</div>${q.prompt==='What is it?'?'':say(q.prompt)}</div>
 <div class="opts n${q.opts.length} ${long?'long':''}">${q.opts.map(o=>`<button class="opt ${q.fair?(o==='FAIR'?'can':'notf'):''}" data-v="${esc(o)}" onclick="pMC(this)">${q.fair?`<img class="fi" src="${IMG[o==='FAIR'?'fair':'notfair']}" alt="">`:''}<span class="t ${tsz(o)}">${esc(o)}</span></button>`).join('')}</div>`)}
function pMC(b){if(LOCK)return;LOCK=true;SPK++;const q=Q[qi];total++;const ok=b.dataset.v===q.ans;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.ans)x.classList.add('right')});if(!ok)b.classList.add('wrong');

let placed=[],pool=[];
function rTiles(){const q=Q[qi];const t=q.spell?q.text.split(''):q.text.split(' ');placed=[];pool=shuffle(t.map((x,i)=>({x,i})));if(pool.length>1&&pool.map(p=>p.x).join('')===t.join(''))pool.reverse();dTiles()}

function copyS(){try{navigator.clipboard.writeText(sText()).then(()=>$('mm').textContent='Copied!')}catch(e){}}
function teacher(){const here=/^https?:/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)?location.origin+location.pathname:'https://iwonita.github.io/ESOL-games/vocabulary-rights.html';
 const row=k=>`<div class="row"><input id="n${k}" style="flex:1" placeholder="Name" value="${esc(st('vg-tn'+k)||(k===1?'Teacher Iwona':'Teacher Anna'))}"><input id="e${k}" style="flex:2" type="email" placeholder="work email" value="${esc(st('vg-t'+k)||'')}"></div>`;
 modal(`<h2>👩‍🏫 Teacher</h2><p class="hint" style="text-align:left">Web address of this game:</p><input id="qu" value="${esc(here)}" placeholder="https://...">
 <p class="hint" style="text-align:left">Teachers who receive learners' scores:</p>${row(1)}${row(2)}
 <div class="row"><button class="nav main" onclick="mkQR()">Make QR codes</button><button class="nav" onclick="window.print()">🖨️ Print</button></div><p id="qm" class="hint"></p><div id="qrs" class="qrs"></div>
 <p class="hint">Each QR code opens one level (the level switch is hidden). Points on this device – Entry 1: ${st('vg-points-1')||0} · Entry 2: ${st('vg-points-2')||0}</p><button class="nav" onclick="if(confirm('Reset all scores on this device?')){Object.keys(localStorage).filter(k=>/^vg-(points|best)/.test(k)).forEach(k=>localStorage.removeItem(k));closeM();home()}">Reset scores</button>`)}
function mkQR(){const u=$('qu').value.trim().split('?')[0];if(!/^https?:\/\//.test(u)){$('qm').textContent='Please paste an address that starts with https://';return}
 let tq='';for(const k of [1,2]){const e=$('e'+k).value.trim(),n=$('n'+k).value.trim();if(e){st('vg-t'+k,e);st('vg-tn'+k,n);tq+=`&t${k}=${encodeURIComponent(e)}&n${k}=${encodeURIComponent(n)}`}}
 const go=()=>{$('qrs').innerHTML=[1,2].map(l=>`<div class="qb"><b>${LVNAME[l]}</b><div id="qr${l}"></div><small>Rights – Vocabulary</small></div>`).join('');[1,2].forEach(l=>new QRCode($('qr'+l),{text:`${u}?level=${l}${tq}`,width:170,height:170}))};
 if(window.QRCode)return go();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=go;s.onerror=()=>$('qm').textContent='Connect to the internet to make QR codes.';document.head.appendChild(s)}
/* init */
{const r=st('vg-rate');if(r!==null&&RATES[+r]!==undefined)RATE=+r;[0,1,2].forEach(i=>$('sp'+i).classList.toggle('on',i===RATE));
 const P=new URLSearchParams(location.search);for(const k of[1,2]){const e=P.get('t'+k);if(e){st('vg-t'+k,e);st('vg-tn'+k,P.get('n'+k)||('Teacher '+k))}}
 const q=P.get('level');if(['1','2'].includes(q)){LEVEL=+q;$('lvsw').classList.add('hide')}else{const s=st('vg-level');if(['1','2'].includes(s))LEVEL=+s}
 [1,2].forEach(i=>$('lv'+i).classList.toggle('on',i===LEVEL));document.body.className='l'+LEVEL;home();try{speechSynthesis.getVoices()}catch(e){}}
</script></body></html>
