<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rights in the UK – Vocabulary game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f4fa; --paper:#ffffff; --ink:#221d33; --muted:#5d5875;
  --can:#3f8a2f; --can-soft:#e5f2df;
  --should:#5b3fa8; --should-soft:#ece6f8;
  --warn:#b8561c; --warn-soft:#fbe9dd;
  --line:#dcd8e8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141d; --paper:#211e2b; --ink:#f0eef6; --muted:#aaa5bd;
    --can:#7cc76a; --can-soft:#1f3219; --should:#a993ea; --should-soft:#2a2340;
    --warn:#f0a070; --warn-soft:#3a2518; --line:#3a3548;
  }
}
:root[data-theme="dark"]{
  --bg:#16141d; --paper:#211e2b; --ink:#f0eef6; --muted:#aaa5bd;
  --can:#7cc76a; --can-soft:#1f3219; --should:#a993ea; --should-soft:#2a2340;
  --warn:#f0a070; --warn-soft:#3a2518; --line:#3a3548;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",Arial,sans-serif;font-size:19px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--should);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-weight:700;font-size:1.05rem}
.brand b{color:var(--can)} .brand i{color:var(--should);font-style:normal}
.level{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.level button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:.95rem}
.level button.on{background:var(--ink);color:var(--paper)}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;margin-bottom:22px}
.hero div{padding:22px 20px}
.hero .c{background:var(--can);color:#fff}
.hero .s{background:var(--should);color:#fff}
.hero strong{display:block;font-size:2.4rem;line-height:1}
.hero span{font-size:1rem;opacity:.95}
h1{font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:1rem}
.menu{display:grid;gap:12px}
.game{display:flex;align-items:center;gap:16px;text-align:left;background:var(--paper);border:2px solid var(--line);
  border-radius:16px;padding:14px 16px}
.game:hover{border-color:var(--should)}
.game .ic{font-size:2rem;width:48px;text-align:center;flex:none}
.game h2{font-size:1.1rem;margin:0}
.game p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.game .best{margin-left:auto;font-size:.9rem;color:var(--muted);white-space:nowrap}
/* play */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-size:.95rem}
.prog{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--can);width:0;transition:width .3s}
.count{font-size:.95rem;color:var(--muted);white-space:nowrap}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:14px}
.q{font-size:1.45rem;font-weight:700;margin:0 0 6px}
.q .gap{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--muted);text-align:center}
.q .gap.can{color:var(--can);border-color:var(--can)} .q .gap.should{color:var(--should);border-color:var(--should)}
.emoji{font-size:2.6rem;line-height:1;margin-bottom:8px}
.say{border:0;background:var(--bg);border-radius:10px;padding:4px 10px;font-size:.95rem;margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:16px 10px;font-size:1.25rem;font-weight:700}
.opt.can{border-color:var(--can);color:var(--can)} .opt.should{border-color:var(--should);color:var(--should)}
.opt.can:hover{background:var(--can-soft)} .opt.should:hover{background:var(--should-soft)}
.opt.right,.opt.right:hover{background:var(--can)!important;color:#fff!important;border-color:var(--can)!important}
.opt.wrong,.opt.wrong:hover{background:var(--warn)!important;color:#fff!important;border-color:var(--warn)!important}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px 16px;margin-top:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--can-soft)} .fb.no{background:var(--warn-soft)}
.fb strong{display:block;font-size:1.1rem}
.next{margin-top:12px;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 20px;font-weight:700}
.text{background:var(--bg);border-left:6px solid var(--should);border-radius:10px;padding:12px 14px;margin:6px 0 4px;font-size:1.05rem}
.persona{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.persona span{font-size:2.2rem}
/* build */
.slot{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--should);background:var(--should-soft);border-radius:10px;padding:8px 12px;font-weight:700}
.slot .tile{border-color:var(--can);background:var(--can-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ghost{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 16px;font-weight:700}
/* end */
.stars{font-size:3rem;letter-spacing:6px}
.review{margin:10px 0 0;padding-left:1.1em}
.review li{margin-bottom:8px}
.hide{display:none!important}
.big{font-size:1.6rem;font-weight:700;margin:6px 0}
.model{background:var(--can-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:700}
.frame{color:var(--muted);font-size:1rem;margin-top:8px}
@media (max-width:480px){.hero strong{font-size:1.9rem}.q{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{opacity:.09}}
:root[data-theme="dark"] body::before{opacity:.09}
.flag{display:inline-block;width:36px;height:18px;vertical-align:-3px;margin-right:8px;border-radius:3px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2060%2030%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3CclipPath%20id%3D%22t%22%3E%3Cpath%20d%3D%22M30%2C15h30v15zv15h-30zh-30v-15zv-15h30z%22/%3E%3C/clipPath%3E%3Cpath%20d%3D%22M0%2C0v30h60v-30z%22%20fill%3D%22%23012169%22/%3E%3Cpath%20d%3D%22M0%2C0L60%2C30M60%2C0L0%2C30%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22/%3E%3Cpath%20d%3D%22M0%2C0L60%2C30M60%2C0L0%2C30%22%20clip-path%3D%22url%28%23t%29%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%224%22/%3E%3Cpath%20d%3D%22M30%2C0v30M0%2C15h60%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2210%22/%3E%3Cpath%20d%3D%22M30%2C0v30M0%2C15h60%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%226%22/%3E%3C/svg%3E") center/cover;box-shadow:0 0 0 1px var(--line)}
body{position:relative;z-index:0}
.lead,h1{text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
.acorn{height:30px;vertical-align:middle;background:#fff;border-radius:8px;padding:3px 6px;margin-right:8px;box-shadow:0 0 0 1px var(--line)}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pts{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid #d9a400;border-radius:999px;padding:4px 12px;font-weight:700}
.pop{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#d9a400;color:#221d33;font-weight:700;font-size:1.4rem;padding:8px 18px;border-radius:999px;pointer-events:none;animation:pop 1.3s ease forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.badge{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:.95rem;opacity:.45}
.badge.got{opacity:1;border-color:#d9a400}
.teacher{margin-top:22px;border:2px dashed var(--line);background:var(--paper);border-radius:14px;padding:10px 16px;font-weight:700;width:100%}
.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.qrbox{background:#fff;color:#221d33;border:3px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.qrbox h3{margin:0 0 10px;font-size:1.4rem}
.qrbox .qr{display:flex;justify-content:center;margin:0 auto 8px}
.qrbox small{word-break:break-all;color:#5d5875}
input.url{width:100%;font:inherit;font-size:1rem;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.gap.count{color:var(--muted)!important}
@media print{body::before,.top,.bar,.row,.teacher,.noprint{display:none!important}.qrbox{break-inside:avoid;border-color:#999}}
.pic{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;border:2px solid var(--line);height:210px;margin-bottom:12px;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pic .emo{font-size:6rem;line-height:1}
.pic.sm{height:120px;margin:0}
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picopt{border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:6px;cursor:pointer}
.picopt.right{border-color:var(--can);box-shadow:0 0 0 3px var(--can)} .picopt.wrong{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn);opacity:.8}
.picopt .lbl{display:none;font-weight:700;padding-top:4px;text-align:center}
.picopt.show .lbl{display:block}
.fairbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fairbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:12px;font-weight:700;font-size:1.2rem}
.fairbtn img{width:70px;height:70px;object-fit:contain}
.fairbtn.f{color:var(--can);border-color:var(--can)} .fairbtn.n{color:#c0392b;border-color:#c0392b}
.fairbtn.right{background:var(--can);color:#fff!important;border-color:var(--can)} .fairbtn.wrong{background:var(--warn);color:#fff!important;border-color:var(--warn)}
.fairbtn.right img,.fairbtn.wrong img{background:#fff;border-radius:50%}
.learn{text-align:center}
.learn .word{font-size:2rem;font-weight:700;margin:6px 0}
.learn .mean{color:var(--muted);font-size:1.05rem}
.tile.letter{min-width:44px;text-align:center;font-size:1.3rem}
.hero .c,.hero .s{display:flex;align-items:center;gap:14px}
.hero img{width:64px;height:64px;background:#fff;border-radius:50%;padding:4px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="flag" aria-hidden="true"></span><span><b>Rights</b> in the <i>UK</i></span></div>
    <div class="pts" title="Your points">⭐ <span id="ptsN">0</span></div>
    <div class="level" role="group" aria-label="Audio speed">
      <button id="sp0" onclick="setRate(0)">🐢 Very slow</button>
      <button id="sp1" onclick="setRate(1)">Slow</button>
      <button id="sp2" onclick="setRate(2)">Normal</button>
    </div>
    <div class="level" id="levelSw" role="group" aria-label="Level">
      <button id="lv1" class="on" onclick="setLevel(1)">Entry 1</button>
      <button id="lv2" onclick="setLevel(2)">Entry 2</button>
    </div>
  </div>
  <section id="home">
    <div class="hero">
      <div class="c"><img id="heroF" alt=""><span><strong>FAIR</strong><span>The same for everyone.</span></span></div>
      <div class="s"><img id="heroN" alt=""><span><strong>NOT FAIR</strong><span>Discrimination is against the law.</span></span></div>
    </div>
    <h1>Rights in the UK – Key words</h1>
    <p class="lead">Choose a game. Tap 🔊 to listen.</p>
    <div class="badges" id="badges"></div>
    <div class="menu" id="menu"></div>
    <button class="teacher" onclick="teacher()">👩‍🏫 Teacher: QR codes and settings</button>
  </section>
  <section id="play" class="hide">
    <div class="bar">
      <button class="back" onclick="home()">◀ Games</button>
      <div class="prog"><i id="progFill"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div id="stage"></div>
  </section>
</div>

 {id:"build",ic:"🧩",h:"Build the sentence",p:"Put the words in order."},
 {id:"fair",ic:"🤔",h:"FAIR or NOT FAIR?",p:"Look at the picture. Is it fair?"}
];
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let SPK=0,CT=null;
function utter(t,done){try{const s=window.speechSynthesis;if(!s||!t.trim()){done&&done();return}const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=RATES[RATE];const vs=s.getVoices().filter(v=>v.lang==="en-GB"||v.lang==="en_GB");const v=(navigator.onLine?null:vs.find(v=>v.localService))||vs[0];if(v)u.voice=v;if(done)u.onend=done;s.speak(u)}catch(e){done&&done()}}
function speak(t){const id=++SPK;clearInterval(CT);try{speechSynthesis.cancel()}catch(e){}
 if(t.includes("___")){const [a,b]=t.split("___");
  utter(a,()=>{if(id!==SPK)return;let n=7;const g=$("gap");const show=()=>{if(g&&id===SPK&&!g.dataset.done){g.textContent=n>0?n:"?";g.classList.toggle("count",n>0)}};show();
   CT=setInterval(()=>{if(id!==SPK){clearInterval(CT);return}n--;show();if(n<=0){clearInterval(CT);utter(b)}},1000)})}
 else utter(t)}
function sayBtn(t,label){return `<button class="say" onclick='speak(${JSON.stringify(t).replace(/'/g,"&#39;")})'>🔊 ${label||"Listen"}</button>`}
function setRate(r){RATE=r;[0,1,2].forEach(i=>$("sp"+i).classList.toggle("on",i===r));store("vg-rate",String(r));speak("This is the speed.")}
function setLevel(l){LEVEL=l;$("lv1").classList.toggle("on",l===1);$("lv2").classList.toggle("on",l===2);store("vg-level",String(l));home()}

/* points */
const BADGES=[[50,"🥉 Bronze"],[150,"🥈 Silver"],[300,"🥇 Gold"],[500,"🏆 Champion"]];
function getPts(){return parseInt(store("vg-points-"+LEVEL)||"0")||0}
function drawPts(){$("ptsN").textContent=getPts();const b=$("badges");if(b)b.innerHTML=BADGES.map(([n,l])=>`<span class="badge ${getPts()>=n?"got":""}">${l} · ${n}</span>`).join("")}
function popup(t){const d=document.createElement("div");d.className="pop";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function addPts(n,label){const before=getPts(),after=before+n;store("vg-points-"+LEVEL,String(after));ROUNDPTS+=n;drawPts();const nb=BADGES.find(([x])=>before<x&&after>=x);popup(nb?`New badge: ${nb[1]}!`:`+${n}${label?" "+label:""}`)}
function right(){STREAK++;let n=10,l="";if(STREAK>=3){n+=5;l=`🔥 ${STREAK} in a row!`}addPts(n,l)}
function wrong(){STREAK=0}

function home(){SPK++;clearInterval(CT);try{speechSynthesis.cancel()}catch(e){}drawPts();
 $("home").classList.remove("hide");$("play").classList.add("hide");
 $("menu").innerHTML=GAMES.map(g=>{const b=store(`vg-best-${g.id}-${LEVEL}`);
  return `<button class="game" onclick="start('${g.id}')"><span class="ic">${g.ic}</span><span><h2>${g.h}</h2><p>${g.p}</p></span>${b?`<span class="best">Best: ${b}</span>`:""}</button>`}).join("")}
function prog(){const n=Q.length;$("progFill").style.width=n?(qi/n*100)+"%":"0";$("count").textContent=n?`${Math.min(qi+1,n)} / ${n}`:""}
function feedback(ok,ans,extra,sayText,nextFn){const fb=$("fb");fb.className="fb show "+(ok?"ok":"no");
 fb.innerHTML=`<strong>${ok?"✅ Well done!":"❌ Not quite. The answer is: "+esc(ans)}</strong>${extra||""}<br><button class="next" onclick="${nextFn||"nextQ()"}">Next ▶</button>`;
 if(sayText)speak(sayText);fb.querySelector(".next").focus()}
function nextQ(){qi++;show()}

function start(id){GAME=id;qi=0;score=0;total=0;missed=[];ROUNDPTS=0;STREAK=0;
 $("home").classList.add("hide");$("play").classList.remove("hide");
 const vs=vocab();
 if(id==="learn") Q=vs.slice();
 if(id==="what") Q=shuffle(vs).slice(0,LEVEL===1?12:16);
 if(id==="find") Q=shuffle(vs).slice(0,LEVEL===1?12:16);
 if(id==="spell") Q=shuffle(SPELL[LEVEL]);
 if(id==="gap") Q=shuffle(GAPS[LEVEL]).slice(0,12);
 if(id==="build") Q=shuffle(BUILD[LEVEL]);
 if(id==="fair") Q=shuffle(FAIRS).slice(0,LEVEL===1?10:12);
 show()}
function show(){if(qi>=Q.length)return GAME==="learn"?home():endShow();prog();
 ({learn:showLearn,what:showWhat,find:showFind,spell:showTiles,build:showTiles,gap:showGap,fair:showFair})[GAME]()}

/* learn */
function showLearn(){const v=Q[qi];
 $("stage").innerHTML=`<div class="card learn">${pic(v.id)}<div class="word">${esc(word(v))}</div><div class="mean">${esc(v.m)}</div>${sayBtn(word(v))}</div>
 <div class="row"><button class="ghost" onclick="qi=Math.max(0,qi-1);show()" ${qi?"":"disabled"}>◀ Back</button><button class="next" onclick="nextQ()">${qi<Q.length-1?"Next ▶":"Finish ✓"}</button></div>`;
 speak(word(v))}

/* what is it: picture -> word */
function showWhat(){const v=Q[qi];const opts=shuffle([v].concat(shuffle(vocab().filter(x=>x.id!==v.id)).slice(0,3)));
 $("stage").innerHTML=`<div class="card">${pic(v.id)}<p class="q">What is it?</p></div>
 <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="pickWhat(this)">${esc(word(o))}</button>`).join("")}</div><div class="fb" id="fb"></div>`}
function pickWhat(btn){const v=Q[qi];total++;const ok=btn.dataset.id===v.id;
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.id===v.id)b.classList.add("right")});
 if(ok){score++;right()}else{wrong();btn.classList.add("wrong");missed.push(`${word(v)} – ${v.m}`)}
 feedback(ok,word(v),`<br>${esc(word(v))} = ${esc(v.m)}`,word(v))}

/* listen and find: word -> picture */
function showFind(){const v=Q[qi];const opts=shuffle([v].concat(shuffle(vocab().filter(x=>x.id!==v.id)).slice(0,3)));
 $("stage").innerHTML=`<div class="card" style="text-align:center"><p class="q">Listen. Choose the picture.</p>${sayBtn(word(v),"Listen again")}
  <p class="frame">Need help? <button class="say" onclick="this.outerHTML='<b>${esc(word(v)).replace(/'/g,"&#39;")}</b>'">Show the word</button></p></div>
 <div class="picopts">${opts.map(o=>`<button class="picopt" data-id="${o.id}" onclick="pickFind(this)" aria-label="picture">${pic(o.id,"sm")}<div class="lbl">${esc(word(o))}</div></button>`).join("")}</div><div class="fb" id="fb"></div>`;
 setTimeout(()=>speak(word(v)),250)}
function pickFind(btn){const v=Q[qi];if(btn.disabled)return;total++;const ok=btn.dataset.id===v.id;
 document.querySelectorAll(".picopt").forEach(b=>{b.disabled=true;b.classList.add("show");if(b.dataset.id===v.id)b.classList.add("right")});
 if(ok){score++;right()}else{wrong();btn.classList.add("wrong");missed.push(word(v))}
 feedback(ok,word(v),"",word(v))}

/* gap */
function showGap(){const g=Q[qi];
 $("stage").innerHTML=`<div class="card">${pic(g.p)}<p class="q">${esc(g.s).replace("___",'<span class="gap" id="gap">?</span>')}</p>${sayBtn(g.s)}</div>
 <div class="opts">${shuffle(g.o).map(o=>`<button class="opt" onclick="pickGap(this)">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div>`}
function pickGap(btn){const g=Q[qi];total++;const ok=btn.textContent===g.a;const done=g.s.replace("___",g.a);
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===g.a)b.classList.add("right")});
 const gp=$("gap");gp.dataset.done="1";gp.classList.remove("count");gp.textContent=g.a;gp.classList.add("can");
 if(ok){score++;right()}else{wrong();btn.classList.add("wrong");missed.push(done)}
 feedback(ok,g.a,`<br>${esc(done)}`,done)}

/* fair */
function showFair(){const f=Q[qi];
 $("stage").innerHTML=`<div class="card">${IMG[f.p]?pic(f.p):`<div class="pic"><span class="emo">${f.e}</span></div>`}<p class="q">${esc(f.t)}</p>${sayBtn(f.t)}</div>
 <div class="fairbtns"><button class="fairbtn f" data-k="FAIR" onclick="pickFair(this)"><img src="${IMG.fair}" alt="">FAIR</button><button class="fairbtn n" data-k="NOT FAIR" onclick="pickFair(this)"><img src="${IMG.notfair}" alt="">NOT FAIR</button></div><div class="fb" id="fb"></div>`}
function pickFair(btn){const f=Q[qi];total++;const ok=btn.dataset.k===f.k;
 document.querySelectorAll(".fairbtn").forEach(b=>{b.disabled=true;if(b.dataset.k===f.k)b.classList.add("right")});
 if(ok){score++;right()}else{wrong();btn.classList.add("wrong");missed.push(`${f.t} → ${f.k}`)}
 feedback(ok,f.k,`<br>${esc(f.why)}`,(f.k==="FAIR"?"It is fair. ":"It is not fair. ")+f.why)}

/* tiles: build + spell */
let placed=[],pool=[];
function tokens(){const it=Q[qi];return GAME==="spell"?it[1].split(""):it[1].split(" ")}
function showTiles(){const t=tokens();placed=[];pool=shuffle(t.map((w,i)=>({w,i})));
 if(pool.length>1&&pool.map(p=>p.w).join("")===t.join(""))pool.reverse();drawTiles()}
function drawTiles(){const it=Q[qi],sp=GAME==="spell";
 $("stage").innerHTML=`<div class="card">${pic(it[0])}<p class="q">${sp?"Spell the word.":"Put the words in order."}</p>
  ${sp?"":'<p class="frame">Start with a capital letter. End with a full stop.</p>'}
  <div class="slot">${placed.map((p,k)=>`<button class="tile ${sp?"letter":""}" onclick="unplace(${k})">${esc(p.w)}</button>`).join("")||'<span class="frame">Tap the '+(sp?"letters":"words")+' below.</span>'}</div>
  <div class="tiles">${pool.map((p,k)=>`<button class="tile ${sp?"letter":""}" onclick="place(${k})">${esc(p.w)}</button>`).join("")}</div>
  <div class="row"><button class="next" id="chk" onclick="checkTiles()" ${pool.length?"disabled":""}>Check</button><button class="ghost" onclick="resetTiles()">Start again</button>${sayBtn(it[1],"Hint")}</div></div><div class="fb" id="fb"></div>`}
function place(k){placed.push(pool.splice(k,1)[0]);drawTiles()}
function unplace(k){pool.push(placed.splice(k,1)[0]);drawTiles()}
function resetTiles(){pool=shuffle(pool.concat(placed));placed=[];drawTiles()}
function checkTiles(){const it=Q[qi],sp=GAME==="spell";const got=placed.map(p=>p.w).join(sp?"":" ");const ok=got===it[1];total++;
 if(ok){score++;right()}else{wrong();missed.push(it[1])}
 document.querySelectorAll(".tile,.ghost,#chk").forEach(b=>b.disabled=true);
 feedback(ok,it[1],ok?"":`<br>You wrote: ${esc(got)}`,it[1])}

/* end + email */
function resultsText(){const n=($("rName")||{}).value||"";return `Rights vocabulary game\nName: ${n}\nLevel: Entry ${LEVEL}\n${LAST}`}
function mailResults(){const m=$("rMail").value.trim(),n=$("rName").value.trim();
 if(!n){$("mailMsg").textContent="Please write your name.";return}
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$("mailMsg").textContent="Please check the email address.";return}
 store("vg-name",n);store("vg-mail",m);
 location.href=`mailto:${encodeURIComponent(m)}?subject=${encodeURIComponent("My results – Rights vocabulary game – "+n)}&body=${encodeURIComponent(resultsText())}`;
 $("mailMsg").textContent="Your email app should open now. Press Send."}
function copyResults(){try{navigator.clipboard.writeText(resultsText()).then(()=>{$("mailMsg").textContent="Copied! Paste it into an email or message."})}catch(e){$("mailMsg").textContent="Copy did not work."}}
function endShow(){$("progFill").style.width="100%";$("count").textContent="";
 const pct=total?score/total:0,st=pct>=.9?3:pct>=.7?2:1;
 const key=`vg-best-${GAME}-${LEVEL}`,prev=store(key),best=prev?Math.max(parseInt(prev),score):score;store(key,best+"/"+total);
 const gname=GAMES.find(g=>g.id===GAME).h;
 LAST=`Game: ${gname}\nDate: ${new Date().toLocaleDateString("en-GB")}\nScore: ${score} / ${total}\nStars: ${"★".repeat(st)}${"☆".repeat(3-st)}\nPoints this game: ${ROUNDPTS}\nTotal points: ${getPts()}`+(missed.length?`\n\nCheck these again:\n- ${missed.join("\n- ")}`:"");
 $("stage").innerHTML=`<div class="card" style="text-align:center"><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><p class="big">${score} / ${total}</p><p>⭐ +${ROUNDPTS} points this game</p><p>${st===3?"Excellent!":st===2?"Good work!":"Keep practising!"}</p></div>
 ${missed.length?`<div class="card"><strong>Check these again:</strong><ul class="review">${missed.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`:""}
 <div class="card noprint"><strong>📧 Email my results</strong><p class="frame" style="margin-top:4px">Write your name and an email address. Your email app opens. Then press Send.</p>
  <input class="url" id="rName" placeholder="Your name" value="${esc(store('vg-name')||'')}" style="margin-bottom:8px"><input class="url" id="rMail" type="email" placeholder="Email address" value="${esc(store('vg-mail')||'')}">
  <div class="row"><button class="next" onclick="mailResults()">📧 Email</button><button class="ghost" onclick="copyResults()">📋 Copy</button></div><p class="frame" id="mailMsg"></p></div>
 <div class="row"><button class="next" onclick="start('${GAME}')">Play again</button><button class="ghost" onclick="home()">All games</button></div>`}

/* teacher */
function teacher(){$("home").classList.add("hide");$("play").classList.remove("hide");$("count").textContent="";$("progFill").style.width="0";
 const here=/^https?:/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)?location.origin+location.pathname:"";
 $("stage").innerHTML=`<div class="card noprint"><p class="q">QR codes for learners</p><p class="frame">Paste the web address where the game is online. Each code opens the game at one level, with the level switch hidden.</p>
  <input class="url" id="qrUrl" placeholder="https://..." value="${esc(here)}"><div class="row"><button class="next" onclick="makeQR()">Make QR codes</button><button class="ghost" onclick="window.print()">🖨️ Print</button></div><p class="frame" id="qrMsg"></p></div>
  <div class="qrs" id="qrs"></div>
  <div class="card noprint" style="margin-top:16px"><p class="q">Points</p><p class="frame">Saved on this device. Entry 1: ${store("vg-points-1")||0} · Entry 2: ${store("vg-points-2")||0}</p>
  <div class="row"><button class="ghost" onclick="if(confirm('Reset all points and best scores on this device?')){resetAll()}">Reset points on this device</button></div></div>`}
function resetAll(){try{Object.keys(localStorage).filter(k=>k.startsWith("vg-points")||k.startsWith("vg-best")).forEach(k=>localStorage.removeItem(k))}catch(e){}teacher()}
function loadQR(cb){if(window.QRCode)return cb();const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";sc.onload=cb;sc.onerror=()=>{$("qrMsg").textContent="Could not load the QR maker. Please connect to the internet and try again."};document.head.appendChild(sc)}
function makeQR(){const u=$("qrUrl").value.trim();if(!/^https?:\/\//.test(u)){$("qrMsg").textContent="Please paste a web address that starts with https://";return}
 const base=u.split("?")[0];$("qrMsg").textContent="";
 loadQR(()=>{$("qrs").innerHTML=[1,2].map(l=>`<div class="qrbox"><h3>Entry ${l}</h3><div class="qr" id="qr${l}"></div><p style="margin:4px 0;font-weight:700">Rights – vocabulary game</p><small>${esc(base)}?level=${l}</small></div>`).join("");
  [1,2].forEach(l=>new QRCode($("qr"+l),{text:`${base}?level=${l}`,width:220,height:220,correctLevel:QRCode.CorrectLevel.M}))})}

/* init */
const sr=store("vg-rate");if(sr!==null&&sr!==undefined&&RATES[+sr]!==undefined)RATE=+sr;[0,1,2].forEach(i=>$("sp"+i).classList.toggle("on",i===RATE));
const qpl=new URLSearchParams(location.search).get("level");
if(qpl==="1"||qpl==="2"){LEVEL=+qpl;$("levelSw").classList.add("hide")}else{const sv=store("vg-level");if(sv==="2")LEVEL=2}
$("lv1").classList.toggle("on",LEVEL===1);$("lv2").classList.toggle("on",LEVEL===2);
$("heroF").src=IMG.fair;$("heroN").src=IMG.notfair;
home();try{speechSynthesis.getVoices()}catch(e){}

</script>
</body>
</html>
